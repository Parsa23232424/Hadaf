
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گالری هنری | هدف 🏹</title>
    <meta name="description" content="گالری هنری هدف؛ عکس‌ها و ویدئوهای هنری کاربران">

    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: white;
            padding: 22px 15px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 8px 0 0;
            color: #777;
        }

        .container {
            width: min(1000px, 94%);
            margin: 25px auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .empty {
            background: white;
            padding: 45px 20px;
            border-radius: 20px;
            text-align: center;
            color: #777;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
            grid-column: 1 / -1;
        }

        .upload-section {
            margin-top: 45px;
            background: white;
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }

        .upload-section h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .upload-section p {
            margin: 0 0 15px;
            color: #777;
            font-size: 14px;
        }

        .upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            margin-top: 10px;
            min-height: 80px;
            resize: vertical;
        }

        input[type="file"] {
            margin-top: 10px;
            background: #f8f8f8;
        }

        button {
            margin-top: 10px;
            background: #222;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #status {
            margin: 10px 0 0;
            text-align: center;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #777;
        }

        @media (max-width: 600px) {
            .upload-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png" alt="هدف" style="width:70px;height:70px;object-fit:contain;">
    <h1>🎨 گالری هنری هدف 🏹</h1>
    <p>آثار هنری کاربران هدف</p>
</header>

<div class="container">

    <section>
        <div class="gallery" id="gallery">

            <div class="empty">
                🎨
                <br><br>
                هنوز اثری در گالری قرار نگرفته است.
                <br>
                اولین اثر را تو ارسال کن!
            </div>

        </div>
    </section>

    <section class="upload-section">

        <h2>📤 ارسال اثر</h2>

        <p>
            عکس یا ویدئوی هنری خودت را برای گالری ارسال کن.
        </p>

        <div class="upload-row">

            <input
                type="text"
                id="title"
                placeholder="عنوان اثر"
            >

            <input
                type="text"
                id="author"
                placeholder="نام سازنده"
            >

        </div>

        <textarea
            id="description"
            placeholder="توضیح کوتاه درباره اثر (اختیاری)"
        ></textarea>

        <input
            type="file"
            id="file"
            accept="image/*,video/*"
        >

        <button onclick="uploadArtwork()">
            🚀 ارسال اثر
        </button>

        <p id="status"></p>

    </section>

</div>

<footer>
    🏹 Hadaf © 2026
</footer>

<script>

function uploadArtwork() {

    const title =
        document.getElementById("title").value.trim();

    const author =
        document.getElementById("author").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const file =
        document.getElementById("file").files[0];

    const status =
        document.getElementById("status");

    if (!title || !author || !file) {

        status.textContent =
            "❌ عنوان، نام سازنده و فایل را وارد کن.";

        return;
    }

    status.textContent =
        "ℹ️ اطلاعات اثر آماده ارسال است.";

    console.log({
        title: title,
        author: author,
        description: description,
        file: file
    });

}

</script>

</body>
</html>
