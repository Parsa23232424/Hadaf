<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ماشین‌بازی</title>

<style>
* {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    box-sizing: border-box;
}

body{
    background:#222;
    color:white;
    text-align:center;
    font-family:tahoma;
    margin:0;
    padding:10px;
    touch-action: none;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

h1 {
    margin:5px 0;
    font-size:28px;
}

canvas{
    background:#2a2a2a;
    border:3px solid white;
    max-width:100%;
    height:auto;
    touch-action: none;
    display:block;
    margin:0 auto;
    border-radius:10px;
}

button{
    font-size:24px;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    touch-action: manipulation;
    border-radius:10px;
    border:2px solid white;
    background:#444;
    color:white;
    font-weight:bold;
}

button:active {
    transform: scale(0.92);
    background:#666;
}

#gameOver{
    display:none;
    font-size:40px;
    color:red;
    margin:10px 0;
    text-shadow:0 0 20px rgba(255,0,0,0.7);
    font-weight:bold;
}

#restartBtn{
    display:none;
    background:#ff4444;
    border-color:#ff4444;
    font-size:22px;
    padding:12px 30px;
}

#restartBtn:active {
    background:#cc0000;
}

#hiddenCar {
    display: none;
}

.back-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 25px;
    background: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
    border:2px solid #4CAF50;
    font-weight:bold;
}

.back-btn:active {
    background: #45a049;
    transform: scale(0.95);
}

.controls {
    margin-top: 15px;
    display:flex;
    gap:20px;
    justify-content:center;
    touch-action: none;
    width:100%;
    max-width:400px;
}

.control-btn {
    font-size: 50px;
    padding: 15px 40px;
    margin: 0;
    background: #3a3a3a;
    color: white;
    border: 3px solid #ffffff;
    border-radius: 15px;
    min-width: 120px;
    touch-action: manipulation;
    transition: all 0.1s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    flex:1;
    font-weight:bold;
    letter-spacing:5px;
}

.control-btn:active {
    background: #5a5a5a;
    transform: scale(0.90);
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    border-color:#ffcc00;
}

#leftBtn:active {
    border-color:#ff6b6b;
}

#rightBtn:active {
    border-color:#6bcfff;
}

.score-display {
    font-size:22px;
    margin:8px 0;
    background:rgba(255,255,255,0.08);
    padding:8px 25px;
    border-radius:12px;
    display:inline-block;
    border:1px solid rgba(255,255,255,0.1);
}

/* جلوگیری از اسکرول */
html, body {
    overflow: hidden;
    height: 100%;
    width: 100%;
    position: fixed;
}

/* ریسپانسیو برای موبایل */
@media (max-width: 480px) {
    .control-btn {
        font-size: 40px;
        padding: 12px 20px;
        min-width: 80px;
    }
    h1 {
        font-size: 22px;
    }
    .score-display {
        font-size: 18px;
        padding: 5px 15px;
    }
    #gameOver {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<h1>🚗 ماشین‌بازی</h1>

<div class="score-display">
🏆 امتیاز: <span id="score">0</span>
</div>

<div id="gameOver">
💥 GAME OVER 💥
</div>

<button id="restartBtn" onclick="restartGame()">
🔄 بازی دوباره
</button>

<br>

<canvas id="game" width="400" height="600"></canvas>

<br>

<div class="controls">
    <button class="control-btn" id="leftBtn">⬅️</button>
    <button class="control-btn" id="rightBtn">➡️</button>
</div>

<br>

<a href="/" class="back-btn">🏠 بازگشت</a>

<!-- تصویر ماشین -->
<img id="hiddenCar" src="Car.png" alt="ماشین" crossorigin="anonymous">

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// بارگذاری تصویر ماشین
const carImage = document.getElementById("hiddenCar");
let imageLoaded = false;

carImage.onload = function() {
    imageLoaded = true;
};

if (carImage.complete && carImage.naturalWidth !== 0) {
    imageLoaded = true;
}

// متغیرهای بازی
let score = 0;
let gameRunning = true;
let roadOffset = 0;
let frameId = null;
let enemySpeed = 2.5; // سرعت پایین‌تر
let gameOverDisplayed = false;

// ماشین بازیکن
const car = {
    x: 100,
    y: 500,
    width: 60,
    height: 100,
    minX: 100,
    maxX: 240,
    step: 20
};

// ماشین دشمن
const enemy = {
    x: 100 + Math.random() * 140,
    y: -100,
    width: 60,
    height: 70
};

// ====== توابع حرکت ======
function moveLeft() {
    if (!gameRunning) return;
    car.x = Math.max(car.minX, car.x - car.step);
}

function moveRight() {
    if (!gameRunning) return;
    car.x = Math.min(car.maxX, car.x + car.step);
}

// ====== کنترل با کیبورد ======
document.addEventListener("keydown", (e) => {
    if (!gameRunning) return;
    if (e.key === "ArrowLeft" || e.key === "Left") {
        e.preventDefault();
        moveLeft();
    }
    if (e.key === "ArrowRight" || e.key === "Right") {
        e.preventDefault();
        moveRight();
    }
});

// ====== کنترل با دکمه‌های لمسی ======
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

function setupButton(btn, action) {
    btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        action();
    });
    
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        action();
    }, { passive: false });
    
    btn.addEventListener("mouseup", (e) => e.preventDefault());
    btn.addEventListener("touchend", (e) => e.preventDefault());
    btn.addEventListener("touchcancel", (e) => e.preventDefault());
}

setupButton(leftBtn, moveLeft);
setupButton(rightBtn, moveRight);

// ====== تشخیص برخورد ======
function collision(a, b) {
    const shrink = 8;
    return (
        a.x + shrink < b.x + b.width - shrink &&
        a.x + a.width - shrink > b.x + shrink &&
        a.y + shrink < b.y + b.height - shrink &&
        a.y + a.height - shrink > b.y + shrink
    );
}

// ====== افزایش امتیاز ======
let scoreInterval = setInterval(() => {
    if (gameRunning) {
        score++;
        document.getElementById("score").textContent = score;
    }
}, 1000);

// ====== ریستارت بازی ======
function restartGame() {
    score = 0;
    gameRunning = true;
    gameOverDisplayed = false;
    enemySpeed = 2.5;
    document.getElementById("score").textContent = "0";
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";
    
    car.x = 170;
    car.y = 500;
    enemy.y = -100;
    enemy.x = 100 + Math.random() * 140;
    
    if (frameId) {
        cancelAnimationFrame(frameId);
        frameId = null;
    }
    draw();
}

// ====== نمایش Game Over ======
function showGameOver() {
    gameRunning = false;
    gameOverDisplayed = true;
    document.getElementById("gameOver").style.display = "block";
    document.getElementById("restartBtn").style.display = "inline-block";
    if (frameId) {
        cancelAnimationFrame(frameId);
        frameId = null;
    }
}

// ====== حلقه اصلی بازی ======
function draw() {
    if (!gameRunning) {
        return;
    }

    ctx.clearRect(0, 0, 400, 600);

    // ====== کشیدن جاده ======
    ctx.fillStyle = "#228B22";
    ctx.fillRect(0, 0, 100, 600);
    ctx.fillRect(300, 0, 100, 600);
    
    ctx.fillStyle = "#4a4a4a";
    ctx.fillRect(100, 0, 200, 600);
    
    ctx.fillStyle = "#ffffff";
    for (let y = -40; y < 600; y += 80) {
        ctx.fillRect(195, y + roadOffset, 10, 40);
    }
    
    roadOffset += 6;
    if (roadOffset >= 80) roadOffset = 0;

    // ====== کشیدن ماشین بازیکن ======
    if (imageLoaded) {
        ctx.drawImage(carImage, car.x, car.y, car.width, car.height);
    } else {
        ctx.fillStyle = "#e74c3c";
        ctx.shadowColor = "rgba(255,0,0,0.3)";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(car.x, car.y, car.width, car.height, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = "#3498db";
        ctx.beginPath();
        ctx.roundRect(car.x + 10, car.y + 15, 40, 25, 5);
        ctx.fill();
        
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(car.x + 15, car.y + 10, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(car.x + 45, car.y + 10, 7, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(car.x - 5, car.y + 20, 8, 30);
        ctx.fillRect(car.x + 57, car.y + 20, 8, 30);
        ctx.fillRect(car.x - 5, car.y + 60, 8, 25);
        ctx.fillRect(car.x + 57, car.y + 60, 8, 25);
    }

    // ====== کشیدن ماشین دشمن ======
    ctx.shadowColor = "rgba(0,100,255,0.3)";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#2c3e7a";
    ctx.beginPath();
    ctx.roundRect(enemy.x, enemy.y, enemy.width, enemy.height, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = "#85c1e9";
    ctx.beginPath();
    ctx.roundRect(enemy.x + 8, enemy.y + 12, 18, 15, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(enemy.x + 34, enemy.y + 12, 18, 15, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(enemy.x + 8, enemy.y + 40, 18, 15, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(enemy.x + 34, enemy.y + 40, 18, 15, 4);
    ctx.fill();
    
    ctx.fillStyle = "#f39c12";
    ctx.fillRect(enemy.x + 5, enemy.y + 3, 12, 6);
    ctx.fillRect(enemy.x + 43, enemy.y + 3, 12, 6);
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(enemy.x + 5, enemy.y + 61, 12, 6);
    ctx.fillRect(enemy.x + 43, enemy.y + 61, 12, 6);

    // ====== حرکت دشمن ======
    enemy.y += enemySpeed;
    
    if (enemy.y > 650) {
        enemy.y = -100;
        enemy.x = 100 + Math.random() * 140;
    }

    // ====== بررسی برخورد ======
    if (collision(car, enemy)) {
        showGameOver();
        return;
    }

    // ====== ادامه حلقه ======
    frameId = requestAnimationFrame(draw);
}

// اضافه کردن متد roundRect
CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w/2) r = w/2;
    if (r > h/2) r = h/2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    return this;
};

// ====== شروع بازی ======
draw();

// ====== جلوگیری از اسکرول در موبایل ======
document.addEventListener('touchmove', function(e) {
    if (e.target.closest('.controls') || e.target === canvas) {
        e.preventDefault();
    }
}, { passive: false });

// ====== جلوگیری از کلیک راست ======
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

</script>

</body>
</html>
