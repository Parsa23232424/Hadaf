<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین‌بازی</title>

<style>
body{
    background:#222;
    color:white;
    text-align:center;
    font-family:tahoma;
    margin:0;
}

canvas{
    background:#2a2a2a;
    border:3px solid white;
    margin-top:10px;
}

button{
    font-size:24px;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

#gameOver{
    display:none;
    font-size:40px;
    color:red;
    margin-top:10px;
}

#restartBtn{
    display:none;
}

#hiddenCar {
    display: none;
}
</style>
</head>

<body>

<h1>🚗 ماشین‌بازی</h1>

<div>
🏆 امتیاز:
<span id="score">0</span>
</div>

<div id="gameOver">
💥 GAME OVER 💥
</div>

<button id="restartBtn" onclick="restartGame()">
🔄 بازی دوباره
</button>

<br>

<canvas id="game" width="400" height="600"></canvas>

<br>

<button onclick="moveRight()">➡️</button>
<button onclick="moveLeft()">⬅️</button>

<!-- ====== عکس با آدرس درست برای Vercel ====== -->
<img id="hiddenCar" src="./Car.png" alt="ماشین">

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ====== گرفتن عکس از تگ مخفی ======
const carImage = document.getElementById("hiddenCar");

let score = 0;
let gameRunning = true;
let roadOffset = 0;

let car = {
    x:170,
    y:500,
    width:60,
    height:100
};

let enemy = {
    x:100 + Math.random()*140,
    y:-100,
    width:60,
    height:70
};

// ====== کنترل با کیبورد ======
document.addEventListener("keydown",(e)=>{
    if(!gameRunning) return;

    if(e.key==="ArrowLeft") moveLeft();
    if(e.key==="ArrowRight") moveRight();
});

// ====== حرکت ماشین ======
function moveLeft(){
    if(car.x > 105){
        car.x -= 20;
    }
}

function moveRight(){
    if(car.x < 235){
        car.x += 20;
    }
}

// ====== تشخیص برخورد ======
function collision(a,b){
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

// ====== افزایش امتیاز هر ثانیه ======
setInterval(()=>{
    if(gameRunning){
        score++;
        document.getElementById("score").innerText = score;
    }
},1000);

// ====== بازی دوباره ======
function restartGame(){

    score = 0;
    gameRunning = true;

    document.getElementById("score").innerText = 0;
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";

    car.x = 170;

    enemy.y = -100;
    enemy.x = 100 + Math.random()*140;

    draw();
}

// ====== حلقه‌ی اصلی بازی ======
function draw(){

    if(!gameRunning) return;

    // پاک کردن صفحه
    ctx.clearRect(0,0,400,600);

    // چمن
    ctx.fillStyle="green";
    ctx.fillRect(0,0,100,600);
    ctx.fillRect(300,0,100,600);

    // جاده
    ctx.fillStyle="#555";
    ctx.fillRect(100,0,200,600);

    // خط وسط جاده
    ctx.fillStyle="white";

    for(let y=-40;y<600;y+=80){
        ctx.fillRect(195,y+roadOffset,10,40);
    }

    roadOffset += 6;

    if(roadOffset >= 80){
        roadOffset = 0;
    }

    // ====== ماشین بازیکن با عکس ======
    if (carImage.complete && carImage.naturalWidth !== 0) {
        ctx.drawImage(carImage, car.x, car.y, car.width, car.height);
    } else {
        // اگه عکس پیدا نشد، ماشین نقاشی شده
        ctx.fillStyle = "red";
        ctx.fillRect(car.x, car.y, car.width, car.height);
        
        ctx.fillStyle = "skyblue";
        ctx.fillRect(car.x+10, car.y+15, 40, 25);
        
        ctx.fillStyle = "yellow";
        ctx.fillRect(car.x+5, car.y+5, 10, 10);
        ctx.fillRect(car.x+45, car.y+5, 10, 10);
        
        ctx.fillStyle = "black";
        ctx.fillRect(car.x-5, car.y+15, 10, 25);
        ctx.fillRect(car.x+55, car.y+15, 10, 25);
        ctx.fillRect(car.x-5, car.y+60, 10, 25);
        ctx.fillRect(car.x+55, car.y+60, 10, 25);
    }

    // ====== ماشین دشمن ======
    ctx.fillStyle="blue";
    ctx.fillRect(enemy.x,enemy.y,enemy.width,enemy.height);

    enemy.y += 3;

    if(enemy.y > 650){
        enemy.y = -100;
        enemy.x = 100 + Math.random()*140;
    }

    // ====== بررسی برخورد ======
    if(collision(car,enemy)){
        gameRunning = false;

        document.getElementById("gameOver").style.display = "block";
        document.getElementById("restartBtn").style.display = "inline-block";

        return;
    }

    requestAnimationFrame(draw);
}

// ====== شروع بازی ======
draw();

</script>

</body>
</html>
