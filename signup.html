<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(
        135deg,
        #0f0c29,
        #302b63,
        #24243e
      );
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      backdrop-filter: blur(12px);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow:
        0 0 0 3px rgba(108, 99, 255, .2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          #6c63ff,
          #3f3d9e
        );
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
      white-space: pre-line;
      word-break: break-word;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 ثبت نام</h1>

    <p class="subtitle">
      به خانواده‌ی هدف خوش آمدی!
    </p>


    <!-- نام کاربری -->

    <div class="form-group">

      <label for="username">
        👤 نام کاربری
      </label>

      <input
        id="username"
        type="text"
        placeholder="مثلاً: parsabravo"
        maxlength="30"
        autocomplete="username">

    </div>


    <!-- ایمیل -->

    <div class="form-group">

      <label for="email">
        📧 ایمیل
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email">

    </div>


    <!-- رمز -->

    <div class="form-group">

      <label for="password">
        🔒 رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="حداقل ۶ کاراکتر"
        autocomplete="new-password">

    </div>


    <!-- دکمه -->

    <button id="signupBtn">
      ثبت نام ✨
    </button>


    <!-- پیام -->

    <div id="message"></div>


    <!-- ورود -->

    <div class="login-link">

      قبلاً عضو شدی؟

      <a href="login.html">
        وارد شو
      </a>

    </div>

  </div>


  <script>

    /* =====================================
       🔗 API
    ===================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx1UsE5KUPdEgjDKXNQHWglVVqgvCCs6uU47ZERKlyi7e4VfHI65gxemnf5EmHisxal/exec";


    /* =====================================
       🎯 عناصر صفحه
    ===================================== */

    const username =
      document.getElementById("username");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    /* =====================================
       💬 نمایش پیام
    ===================================== */

    function showMessage(
      text,
      error = false
    ) {

      message.style.display = "block";

      message.textContent = text;

      if (error) {

        message.style.background =
          "rgba(255, 70, 70, .15)";

        message.style.color =
          "#ff6b6b";

      } else {

        message.style.background =
          "rgba(70, 255, 70, .15)";

        message.style.color =
          "#6cff6c";

      }

    }


    /* =====================================
       📧 بررسی ایمیل
    ===================================== */

    function validEmail(value) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(value);

    }


    /* =====================================
       🚀 ثبت نام
    ===================================== */

    async function signup() {

      const user =
        username.value.trim();

      const mail =
        email.value.trim();

      const pass =
        password.value;


      /* -------------------------------
         بررسی نام کاربری
      -------------------------------- */

      if (user.length < 3) {

        showMessage(
          "❌ نام کاربری باید حداقل ۳ کاراکتر باشد.",
          true
        );

        username.focus();

        return;

      }


      /* -------------------------------
         بررسی ایمیل
      -------------------------------- */

      if (!validEmail(mail)) {

        showMessage(
          "❌ ایمیل معتبر وارد کن.",
          true
        );

        email.focus();

        return;

      }


      /* -------------------------------
         بررسی رمز
      -------------------------------- */

      if (pass.length < 6) {

        showMessage(
          "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
          true
        );

        password.focus();

        return;

      }


      /* -------------------------------
         شروع درخواست
      -------------------------------- */

      button.disabled = true;

      button.textContent =
        "⏳ در حال ثبت نام...";

      message.style.display = "none";


      try {

        /* ==============================
           ارسال به Google Apps Script
        ============================== */

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              body: JSON.stringify({

                action: "signup",

                username: user,

                email: mail,

                password: pass

              })

            }
          );


        /* ==============================
           پاسخ خام سرور
        ============================== */

        const text =
          await response.text();


        console.log(
          "Hadaf API Response:",
          text
        );


        /* ==============================
           تبدیل JSON
        ============================== */

        let result;

        try {

          result =
            JSON.parse(text);

        } catch (jsonError) {

          console.error(
            "Invalid JSON:",
            text
          );

          throw new Error(
            "سرور پاسخ JSON معتبر نداد."
          );

        }


        /* ==============================
           بررسی موفقیت
        ============================== */

        if (!result.success) {

          throw new Error(
            result.message ||
            "ثبت نام انجام نشد."
          );

        }


        /* ==============================
           موفقیت
        ============================== */

        showMessage(
          "🎉 ثبت نام با موفقیت انجام شد!\n\n" +
          "اکنون می‌توانی وارد حساب خودت شوی."
        );


        /* پاک کردن فرم */

        username.value = "";

        email.value = "";

        password.value = "";


        /* انتقال به ورود */

        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          1500
        );


      } catch (error) {

        console.error(
          "Hadaf Signup Error:",
          error
        );


        showMessage(
          "❌ " +
          error.message,
          true
        );

      }


      finally {

        button.disabled = false;

        button.textContent =
          "ثبت نام ✨";

      }

    }


    /* =====================================
       🖱️ کلیک دکمه
    ===================================== */

    button.addEventListener(
      "click",
      signup
    );


    /* =====================================
       ⌨️ Enter
    ===================================== */

    password.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          signup();

        }

      }
    );

  </script>

</body>

</html>
