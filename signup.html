<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام | هدف</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            color: #fff;
            font-size: 28px;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #6c63ff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
        }
        input::placeholder {
            color: #666;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #3f3d9e);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108,99,255,0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        #message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .login-link {
            text-align: center;
            color: #aaa;
            margin-top: 20px;
            font-size: 14px;
        }
        .login-link a {
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 ثبت نام</h1>
    <p class="subtitle">به خانواده‌ی هدف خوش آمدی!</p>

    <div class="form-group">
        <label>👤 نام کاربری</label>
        <input type="text" id="username" placeholder="مثلا: parsabravo" />
    </div>

    <div class="form-group">
        <label>📧 ایمیل</label>
        <input type="email" id="email" placeholder="example@gmail.com" />
    </div>

    <div class="form-group">
        <label>🔒 رمز عبور</label>
        <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" />
    </div>

    <button id="signupBtn">ثبت نام ✨</button>

    <div id="message"></div>

    <div class="login-link">
        قبلاً عضو شدی؟ <a href="login.html">وارد شو</a>
    </div>
</div>

<script>
    // ======================== تنظیمات JSONBin ========================
    const BIN_ID = 'https://api.jsonbin.io/v3/b/6a7377c7da38895dfebdfff2';   // <-- : 
    const API_KEY = '$2a$10$JPsC7WYEBM7.ZXf/LONpLOOFcHbnPJINQUxTrzB28s31bk3.gph8C'; // <-- $$abc123def456...
    // ================================================================

    async function getData() {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        return data.record;
    }

    async function saveData(data) {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': API_KEY
            },
            body: JSON.stringify(data)
        });
    }

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const msgDiv = document.getElementById('message');

        if (!username || !email || !password) {
            msgDiv.style.display = 'block';
            msgDiv.style.background = 'rgba(255,70,70,0.15)';
            msgDiv.style.color = '#ff6b6b';
            msgDiv.textContent = '❌ همه‌ی فیلدها رو پر کن!';
            return;
        }

        if (password.length < 6) {
            msgDiv.style.display = 'block';
            msgDiv.style.background = 'rgba(255,70,70,0.15)';
            msgDiv.style.color = '#ff6b6b';
            msgDiv.textContent = '❌ رمز عبور حداقل ۶ کاراکتر باشه!';
            return;
        }

        try {
            const currentData = await getData();

            if (currentData.users.find(u => u.username === username || u.email === email)) {
                msgDiv.style.display = 'block';
                msgDiv.style.background = 'rgba(255,70,70,0.15)';
                msgDiv.style.color = '#ff6b6b';
                msgDiv.textContent = '❌ این کاربر یا ایمیل قبلاً ثبت شده!';
                return;
            }

            const newUser = {
                id: currentData.users.length + 1,
                username,
                email,
                password
            };

            currentData.users.push(newUser);
            await saveData(currentData);

            msgDiv.style.display = 'block';
            msgDiv.style.background = 'rgba(70,255,70,0.15)';
            msgDiv.style.color = '#6cff6c';
            msgDiv.textContent = '✅ ثبت نام موفق! حالا برو وارد شو.';
            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';

        } catch (error) {
            msgDiv.style.display = 'block';
            msgDiv.style.background = 'rgba(255,70,70,0.15)';
            msgDiv.style.color = '#ff6b6b';
            msgDiv.textContent = '❌ خطا در ارتباط با سرور!';
        }
    });
</script>

</body>
</html>
