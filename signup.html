<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,.2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg,#6c63ff,#3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
      white-space: pre-line;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 ثبت نام</h1>

    <p class="subtitle">
      به خانواده‌ی هدف خوش آمدی!
    </p>

    <div class="form-group">
      <label>👤 نام کاربری</label>

      <input
        id="username"
        type="text"
        placeholder="مثلاً: parsabravo"
        maxlength="30"
        autocomplete="username">
    </div>

    <div class="form-group">
      <label>📧 ایمیل</label>

      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label>🔒 رمز عبور</label>

      <input
        id="password"
        type="password"
        placeholder="حداقل ۶ کاراکتر"
        autocomplete="new-password">
    </div>

    <button id="signupBtn">
      ثبت نام ✨
    </button>

    <div id="message"></div>

    <div class="login-link">
      قبلاً عضو شدی؟
      <a href="login.html">وارد شو</a>
    </div>

  </div>

  <script>

    /*
      آدرس Web App گوگل اسکریپت را اینجا قرار بده
    */

    const API_URL "https://script.google.com/macros/s/AKfycby8bXQ7qf_Ld20bN03W4afb7mLfAXoTkL9Bzq8AFXI1Bz6HjE6MyVUisL3hAjQn-k2o/exec";


    const username =
      document.getElementById("username");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, error = false) {

      message.style.display = "block";

      message.textContent = text;

      if (error) {

        message.style.background =
          "rgba(255,70,70,.15)";

        message.style.color =
          "#ff6b6b";

      } else {

        message.style.background =
          "rgba(70,255,70,.15)";

        message.style.color =
          "#6cff6c";
      }
    }


    function validEmail(value) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

    }


    async function signup() {

      const user =
        username.value.trim();

      const mail =
        email.value.trim();

      const pass =
        password.value;


      if (user.length < 3) {

        showMessage(
          "❌ نام کاربری باید حداقل ۳ کاراکتر باشد.",
          true
        );

        return;
      }


      if (!validEmail(mail)) {

        showMessage(
          "❌ ایمیل معتبر وارد کن.",
          true
        );

        return;
      }


      if (pass.length < 6) {

        showMessage(
          "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
          true
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "⏳ در حال ثبت نام...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "signup",

              username: user,

              email: mail,

              password: pass

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "ثبت نام انجام نشد."
          );

        }


        showMessage(
          "🎉 ثبت نام با موفقیت انجام شد!\n\n" +
          "اکنون می‌توانی وارد حساب خودت شوی."
        );


        username.value = "";
        email.value = "";
        password.value = "";


        setTimeout(() => {

          location.href =
            "login.html";

        }, 1500);


      } catch (error) {

        showMessage(
          "❌ " +
          error.message,
          true
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "ثبت نام ✨";

      }

    }


    button.addEventListener(
      "click",
      signup
    );


    password.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          signup();
        }

      }
    );

  </script>

</body>
</html>
