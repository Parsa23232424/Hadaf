<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت نام | هدف</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; font-size: 28px; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #aaa; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #ddd; font-size: 14px; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #6c63ff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
        }
        input::placeholder { color: #666; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #3f3d9e);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108,99,255,0.3);
        }
        button:active { transform: scale(0.98); }
        #message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .login-link { text-align: center; color: #aaa; margin-top: 20px; font-size: 14px; }
        .login-link a { color: #6c63ff; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        #debug {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            color: #0f0;
            font-size: 12px;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            display: block;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 ثبت نام</h1>
    <p class="subtitle">به خانواده‌ی هدف خوش آمدی!</p>

    <div class="form-group">
        <label>👤 نام کاربری</label>
        <input type="text" id="username" placeholder="مثلا: parsabravo" />
    </div>

    <div class="form-group">
        <label>📧 ایمیل</label>
        <input type="email" id="email" placeholder="example@gmail.com" />
    </div>

    <div class="form-group">
        <label>🔒 رمز عبور</label>
        <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" />
    </div>

    <button id="signupBtn">ثبت نام ✨</button>

    <div id="message"></div>

    <div class="login-link">
        قبلاً عضو شدی؟ <a href="login.html">وارد شو</a>
    </div>

    <div id="debug">⏳ منتظر کلیک...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

<script>
    // ===== دیباگ =====
    const debug = document.getElementById('debug');

    function log(msg) {
        debug.innerHTML += '🟢 ' + new Date().toLocaleTimeString() + ' - ' + msg + '<br>';
        debug.scrollTop = debug.scrollHeight;
    }

    log('🚀 صفحه بارگذاری شد');

    // ===== مقداردهی EmailJS =====
    (function() {
        try {
            emailjs.init({
                publicKey: 'OIV0VJKImeRxTYHk8'
            });
            log('✅ EmailJS مقداردهی شد');
        } catch (e) {
            log('❌ خطا در مقداردهی EmailJS: ' + e.message);
        }
    })();

    // ===== تنظیمات JSONBin =====
    const BIN_ID = '674f4e08ad19ca34f8d8d1d0';
    const API_KEY = '$2b$10$bSF1e6iK1eTp2wpHNkfGYuQ4R1Vj5C5M5q6R7S8T9U0V1W2X3Y4Z';

    // ===== توابع JSONBin =====
    async function getData() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await res.json();
            return data.record || { users: [] };
        } catch (e) {
            log('❌ خطا در خواندن داده: ' + e.message);
            return { users: [] };
        }
    }

    async function saveData(data) {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(data)
            });
            log('✅ داده ذخیره شد');
        } catch (e) {
            log('❌ خطا در ذخیره داده: ' + e.message);
            throw e;
        }
    }

    // ===== تابع ارسال ایمیل با EmailJS =====
    function sendVerificationEmail(userEmail, username) {
        log('📧 ارسال ایمیل به: ' + userEmail);

        const templateParams = {
            to_email: userEmail,
            to_name: username,
            verification_link: 'https://hadaf.site/verify?email=' + encodeURIComponent(userEmail)
        };

        emailjs.send('service_xeltni9', 'template_k94e2cs', templateParams)
            .then(function(response) {
                log('✅ ایمیل تأیید با EmailJS فرستاده شد');
                console.log('✅ EmailJS response:', response);
            }, function(error) {
                log('❌ خطا در ارسال ایمیل با EmailJS: ' + error.text);
                console.error('❌ EmailJS error:', error);
            });
    }

    // ===== دکمه ثبت نام =====
    const btn = document.getElementById('signupBtn');
    const msg = document.getElementById('message');

    log('🔍 دکمه پیدا شد: ' + (btn ? 'بله' : 'خیر'));

    function show(text, isError) {
        msg.style.display = 'block';
        msg.textContent = text;
        msg.style.background = isError ? 'rgba(255,70,70,0.15)' : 'rgba(70,255,70,0.15)';
        msg.style.color = isError ? '#ff6b6b' : '#6cff6c';
        log('📨 پیام: ' + text);
    }

    btn.addEventListener('click', async function() {
        log('✅ دکمه کلیک شد!');
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        log('👤 نام: ' + username + ' | 📧 ایمیل: ' + email);

        if (!username || !email || !password) {
            show('❌ همه فیلدها رو پر کن!', true);
            return;
        }

        if (password.length < 6) {
            show('❌ رمز عبور حداقل ۶ کاراکتر!', true);
            return;
        }

        try {
            log('📤 خواندن داده‌ها از JSONBin...');
            const currentData = await getData();

            if (currentData.users.find(u => u.email === email)) {
                show('❌ این ایمیل قبلاً ثبت شده!', true);
                log('❌ ایمیل تکراری');
                return;
            }

            const newUser = {
                id: Date.now(),
                username: username,
                email: email,
                password: password,
                created_at: new Date().toISOString()
            };
            currentData.users.push(newUser);

            log('📤 ذخیره داده در JSONBin...');
            await saveData(currentData);

            show('✅ ثبت نام موفق! ایمیل تأیید برات فرستاده شد.', false);
            log('✅ ثبت نام موفق');

            // ارسال ایمیل با EmailJS
            sendVerificationEmail(email, username);

            document.getElementById('username').value = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';

        } catch (error) {
            show('❌ خطا: ' + error.message, true);
            log('❌ خطا: ' + error.message);
        }
    });
</script>

</body>
</html>
