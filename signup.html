<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت نام | هدف</title>
    <style>
        /* همون استایل‌های قبلی */
    </style>
</head>
<body>
    <!-- فرم ثبت نام (همون قبلی) -->

    <script type="module">
        import { supabase } from './supabase.js';

        const btn = document.getElementById('signupBtn');
        const msg = document.getElementById('message');

        function show(text, isError) {
            msg.style.display = 'block';
            msg.textContent = text;
            msg.style.background = isError ? 'rgba(255,70,70,0.15)' : 'rgba(70,255,70,0.15)';
            msg.style.color = isError ? '#ff6b6b' : '#6cff6c';
        }

        btn.onclick = function() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !email || !password) {
                show('❌ همه فیلدها رو پر کن!', true);
                return;
            }

            if (password.length < 6) {
                show('❌ رمز عبور حداقل ۶ کاراکتر!', true);
                return;
            }

            supabase.auth.signUp({
                email: email,
                password: password,
                options: { data: { username: username } }
            })
            .then(result => {
                if (result.error) {
                    show('❌ ' + result.error.message, true);
                } else {
                    show('✅ ثبت نام موفق! ایمیل تأیید برات فرستاده شد.', false);
                    document.getElementById('username').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                }
            })
            .catch(err => {
                show('❌ خطا: ' + err.message, true);
            });
        };
    </script>
</body>
</html>
