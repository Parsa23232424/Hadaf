<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, .2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c63ff, #3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
      white-space: pre-line;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 ثبت نام</h1>

    <p class="subtitle">
      به خانواده‌ی هدف خوش آمدی!
    </p>

    <div class="form-group">
      <label for="username">👤 نام کاربری</label>

      <input
        type="text"
        id="username"
        placeholder="مثلاً: parsabravo"
        autocomplete="username"
        maxlength="30">
    </div>

    <div class="form-group">
      <label for="email">📧 ایمیل</label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">🔒 رمز عبور</label>

      <input
        type="password"
        id="password"
        placeholder="حداقل ۶ کاراکتر"
        autocomplete="new-password">
    </div>

    <button id="signupBtn">
      ثبت نام ✨
    </button>

    <div id="message"></div>

    <div class="login-link">
      قبلاً عضو شدی؟
      <a href="login.html">وارد شو</a>
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jnmgncodjjilbxynhuyi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_aWMTLp8GZDjKSwBN9H65-w_5W8g_G-2";


    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );


    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, error = false) {

      message.style.display = "block";

      message.textContent = text;

      if (error) {

        message.style.background =
          "rgba(255,70,70,0.15)";

        message.style.color =
          "#ff6b6b";

      } else {

        message.style.background =
          "rgba(70,255,70,0.15)";

        message.style.color =
          "#6cff6c";
      }
    }


    function validEmail(email) {

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    }


    async function register() {

      const username =
        usernameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!username) {

        showMessage(
          "❌ نام کاربری را وارد کن.",
          true
        );

        usernameInput.focus();

        return;
      }


      if (username.length < 3) {

        showMessage(
          "❌ نام کاربری باید حداقل ۳ کاراکتر باشد.",
          true
        );

        usernameInput.focus();

        return;
      }


      if (!email) {

        showMessage(
          "❌ ایمیل را وارد کن.",
          true
        );

        emailInput.focus();

        return;
      }


      if (!validEmail(email)) {

        showMessage(
          "❌ ایمیل واردشده معتبر نیست.",
          true
        );

        emailInput.focus();

        return;
      }


      if (!password) {

        showMessage(
          "❌ رمز عبور را وارد کن.",
          true
        );

        passwordInput.focus();

        return;
      }


      if (password.length < 6) {

        showMessage(
          "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
          true
        );

        passwordInput.focus();

        return;
      }


      signupBtn.disabled = true;

      signupBtn.textContent =
        "⏳ در حال ثبت نام...";

      message.style.display = "none";


      try {

        /*
          حداکثر ۳۰ ثانیه برای پاسخ Supabase
        */

        const request =
          supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                username: username
              }

            }

          });


        const timeout =
          new Promise((_, reject) => {

            setTimeout(() => {

              reject(
                new Error("TIMEOUT")
              );

            }, 30000);

          });


        const result =
          await Promise.race([
            request,
            timeout
          ]);


        const data =
          result.data;

        const error =
          result.error;


        if (error) {
          throw error;
        }


        if (!data || !data.user) {

          throw new Error(
            "ثبت نام انجام نشد."
          );

        }


        /*
          اگر تأیید ایمیل فعال باشد
        */

        if (!data.session) {

          showMessage(
            "✅ ثبت نام با موفقیت انجام شد! 🎉\n\n" +
            "📧 یک ایمیل تأیید برایت ارسال شده است.\n" +
            "لطفاً ایمیلت را بررسی کن."
          );

        } else {

          showMessage(
            "🎉 ثبت نام با موفقیت انجام شد!"
          );

          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1500);

        }


        usernameInput.value = "";
        emailInput.value = "";
        passwordInput.value = "";


      } catch (error) {

        console.error(
          "Signup Error:",
          error
        );


        let text =
          error?.message ||
          "خطای ناشناخته";


        const lower =
          text.toLowerCase();


        if (
          text === "TIMEOUT" ||
          lower.includes("failed to fetch")
        ) {

          text =
            "ارتباط با سرور برقرار نشد. 🌐\n" +
            "لطفاً اینترنت یا اتصال Supabase را بررسی کن و دوباره تلاش کن.";

        }

        else if (
          lower.includes(
            "user already registered"
          )
        ) {

          text =
            "این ایمیل قبلاً ثبت شده است. ❌";

        }

        else if (
          lower.includes(
            "invalid email"
          )
        ) {

          text =
            "ایمیل واردشده معتبر نیست. 📧";

        }

        else if (
          lower.includes(
            "password"
          )
        ) {

          text =
            "رمز عبور مناسب نیست. 🔒";

        }

        else if (
          lower.includes(
            "rate limit"
          )
        ) {

          text =
            "تعداد درخواست‌ها زیاد شده است. ⏳\n" +
            "کمی بعد دوباره امتحان کن.";

        }


        showMessage(
          "❌ " + text,
          true
        );


      } finally {

        signupBtn.disabled = false;

        signupBtn.textContent =
          "ثبت نام ✨";

      }

    }


    signupBtn.addEventListener(
      "click",
      register
    );


    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          register();
        }

      }
    );

  </script>

</body>

</html>
