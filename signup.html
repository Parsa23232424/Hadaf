<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, .2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c63ff, #3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
      white-space: pre-line;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }

    #debug {
      margin-top: 20px;
      padding: 12px;
      background: rgba(0, 0, 0, .5);
      border-radius: 10px;
      color: #7cff7c;
      font-size: 12px;
      direction: ltr;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 ثبت نام</h1>

    <p class="subtitle">
      به خانواده‌ی هدف خوش آمدی!
    </p>

    <div class="form-group">
      <label for="username">👤 نام کاربری</label>

      <input
        type="text"
        id="username"
        placeholder="مثلاً: parsabravo"
        autocomplete="username">
    </div>

    <div class="form-group">
      <label for="email">📧 ایمیل</label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">🔒 رمز عبور</label>

      <input
        type="password"
        id="password"
        placeholder="حداقل ۶ کاراکتر"
        autocomplete="new-password">
    </div>

    <button id="signupBtn">
      ثبت نام ✨
    </button>

    <div id="message"></div>

    <div class="login-link">
      قبلاً عضو شدی؟
      <a href="login.html">وارد شو</a>
    </div>

    <div id="debug">
      ⏳ آماده...
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* ==========================================
       🔐 تنظیمات Supabase
    ========================================== */

    const SUPABASE_URL =
      "https://jnmgncodjjilbxynhuyi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_aWMTLp8GZDjKSwBN9H65-w_5W8g_G-2";


    /* ==========================================
       🚀 اتصال به Supabase
    ========================================== */

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* ==========================================
       🎯 عناصر صفحه
    ========================================== */

    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signupBtn =
      document.getElementById("signupBtn");

    const message =
      document.getElementById("message");

    const debug =
      document.getElementById("debug");


    /* ==========================================
       📝 دیباگ
    ========================================== */

    function log(text) {

      const time =
        new Date().toLocaleTimeString("fa-IR");

      debug.innerHTML +=
        `🟢 ${time} - ${text}<br>`;

      debug.scrollTop =
        debug.scrollHeight;
    }


    log("صفحه ثبت نام آماده شد.");
    log("Supabase آماده شد.");


    /* ==========================================
       💬 نمایش پیام
    ========================================== */

    function showMessage(text, error = false) {

      message.style.display = "block";

      message.textContent = text;

      if (error) {

        message.style.background =
          "rgba(255,70,70,0.15)";

        message.style.color =
          "#ff6b6b";

      } else {

        message.style.background =
          "rgba(70,255,70,0.15)";

        message.style.color =
          "#6cff6c";
      }
    }


    /* ==========================================
       🚀 ثبت نام
    ========================================== */

    signupBtn.addEventListener(
      "click",
      async function () {

        const username =
          usernameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        log("دکمه ثبت نام کلیک شد.");


        /* ======================================
           بررسی نام کاربری
        ====================================== */

        if (!username) {

          showMessage(
            "❌ نام کاربری را وارد کن.",
            true
          );

          usernameInput.focus();

          return;
        }


        if (username.length < 3) {

          showMessage(
            "❌ نام کاربری باید حداقل ۳ کاراکتر باشد.",
            true
          );

          usernameInput.focus();

          return;
        }


        /* ======================================
           بررسی ایمیل
        ====================================== */

        if (!email) {

          showMessage(
            "❌ ایمیل را وارد کن.",
            true
          );

          emailInput.focus();

          return;
        }


        /* ======================================
           بررسی رمز
        ====================================== */

        if (!password) {

          showMessage(
            "❌ رمز عبور را وارد کن.",
            true
          );

          passwordInput.focus();

          return;
        }


        if (password.length < 6) {

          showMessage(
            "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
            true
          );

          passwordInput.focus();

          return;
        }


        /* ======================================
           شروع ثبت نام
        ====================================== */

        signupBtn.disabled = true;

        signupBtn.textContent =
          "⏳ در حال ثبت نام...";

        message.style.display = "none";


        try {

          log("📤 ارسال اطلاعات به Supabase...");


          /* ====================================
             👤 ساخت حساب
          ==================================== */

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                data: {

                  username: username

                }

              }

            });


          /* ====================================
             ❌ بررسی خطا
          ==================================== */

          if (error) {

            log(
              "❌ Supabase Error: " +
              error.message
            );

            throw error;
          }


          log(
            "✅ حساب با موفقیت ساخته شد."
          );


          console.log(
            "Supabase signup data:",
            data
          );


          /* ====================================
             📧 تأیید ایمیل
          ==================================== */

          if (
            data.user &&
            !data.session
          ) {

            showMessage(
              "✅ ثبت نام با موفقیت انجام شد! 🎉\n\n" +
              "📧 یک ایمیل تأیید برایت ارسال شده است.\n" +
              "لطفاً ایمیلت را بررسی کن."
            );

            log(
              "📧 منتظر تأیید ایمیل کاربر هستیم."
            );

          } else {

            showMessage(
              "🎉 ثبت نام با موفقیت انجام شد!"
            );

            log(
              "🎉 کاربر وارد حساب شد."
            );

          }


          /* ====================================
             پاک کردن فرم
          ==================================== */

          usernameInput.value = "";
          emailInput.value = "";
          passwordInput.value = "";


        } catch (error) {

          console.error(
            "Supabase Error:",
            error
          );


          let errorMessage =
            error?.message ||
            "یک خطای ناشناخته رخ داد.";


          /* ====================================
             پیام‌های دوستانه
          ==================================== */

          const lower =
            errorMessage.toLowerCase();


          if (
            lower.includes(
              "user already registered"
            )
          ) {

            errorMessage =
              "این ایمیل قبلاً ثبت شده است. ❌";

          }


          else if (
            lower.includes(
              "password"
            )
          ) {

            errorMessage =
              "رمز عبور مناسب نیست. 🔒";

          }


          else if (
            lower.includes(
              "invalid email"
            )
          ) {

            errorMessage =
              "ایمیل واردشده معتبر نیست. 📧";

          }


          else if (
            lower.includes(
              "rate limit"
            )
          ) {

            errorMessage =
              "تعداد درخواست‌ها زیاد شده. کمی بعد دوباره امتحان کن. ⏳";

          }


          showMessage(
            "❌ " + errorMessage,
            true
          );


          log(
            "❌ " + errorMessage
          );

        }


        finally {

          signupBtn.disabled = false;

          signupBtn.textContent =
            "ثبت نام ✨";

        }

      }
    );

  </script>

</body>
</html>
