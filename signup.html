<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,.2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c63ff, #3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }

    #debug {
      margin-top: 20px;
      padding: 12px;
      background: rgba(0,0,0,.5);
      border-radius: 10px;
      color: #7cff7c;
      font-size: 12px;
      direction: ltr;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 ثبت نام</h1>

  <p class="subtitle">
    به خانواده‌ی هدف خوش آمدی!
  </p>

  <div class="form-group">
    <label>👤 نام کاربری</label>
    <input
      type="text"
      id="username"
      placeholder="مثلاً: parsabravo"
      autocomplete="username">
  </div>

  <div class="form-group">
    <label>📧 ایمیل</label>
    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email">
  </div>

  <div class="form-group">
    <label>🔒 رمز عبور</label>
    <input
      type="password"
      id="password"
      placeholder="حداقل ۶ کاراکتر"
      autocomplete="new-password">
  </div>

  <button id="signupBtn">
    ثبت نام ✨
  </button>

  <div id="message"></div>

  <div class="login-link">
    قبلاً عضو شدی؟
    <a href="login.html">وارد شو</a>
  </div>

  <div id="debug">
    ⏳ آماده...
  </div>

</div>


<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==========================================
   🔐 تنظیمات Supabase
========================================== */

const SUPABASE_URL = "اhttps://jnmgncodjjilbxynhuyi.supabase.co/rest/v1/";

const SUPABASE_ANON_KEY = "اsb_publishable_aWMTLp8GZDjKSwBN9H65-w_5W8g_G-2";


/* ==========================================
   🚀 اتصال به Supabase
========================================== */

const { createClient } = window.supabase;

const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ==========================================
   🎯 عناصر صفحه
========================================== */

const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const signupBtn = document.getElementById("signupBtn");
const message = document.getElementById("message");


/* ==========================================
   💬 نمایش پیام
========================================== */

function showMessage(text, error = false) {

    message.style.display = "block";

    message.textContent = text;

    if (error) {

        message.style.background =
            "rgba(255,70,70,0.15)";

        message.style.color =
            "#ff6b6b";

    } else {

        message.style.background =
            "rgba(70,255,70,0.15)";

        message.style.color =
            "#6cff6c";

    }
}


/* ==========================================
   🚀 ثبت نام
========================================== */

signupBtn.addEventListener("click", async function () {

    const username =
        usernameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    /* بررسی اطلاعات */

    if (!username || !email || !password) {

        showMessage(
            "❌ لطفاً همه فیلدها را پر کن!",
            true
        );

        return;
    }


    if (username.length < 3) {

        showMessage(
            "❌ نام کاربری باید حداقل ۳ حرف باشد.",
            true
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
            true
        );

        return;
    }


    /* دکمه در حال پردازش */

    signupBtn.disabled = true;

    signupBtn.textContent =
        "⏳ در حال ثبت نام...";


    try {

        /* ======================================
           👤 ساخت حساب در Supabase Auth
        ====================================== */

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        username: username

                    }

                }

            });


        /* بررسی خطا */

        if (error) {

            throw error;

        }


        console.log(
            "Supabase User:",
            data
        );


        /* ======================================
           ✅ ثبت نام موفق
        ====================================== */

        showMessage(
            "✅ ثبت نام با موفقیت انجام شد! 🎉"
        );


        /* پاک کردن فرم */

        usernameInput.value = "";

        emailInput.value = "";

        passwordInput.value = "";


        /*
          اگر Email Confirmation فعال باشد،
          کاربر باید ایمیلش را تأیید کند.
        */

        if (
            data.user &&
            !data.session
        ) {

            showMessage(
                "✅ ثبت نام انجام شد! 📧\n" +
                "لطفاً ایمیلت را برای تأیید حساب بررسی کن."
            );

        }

    }


    catch (error) {

        console.error(
            "Supabase Error:",
            error
        );


        let text =
            error.message ||
            "یک خطای ناشناخته رخ داد.";


        /* پیام‌های دوستانه‌تر */

        if (
            text.toLowerCase().includes(
                "user already registered"
            )
        ) {

            text =
                "❌ این ایمیل قبلاً ثبت شده است.";

        }


        showMessage(
            text,
            true
        );

    }


    finally {

        signupBtn.disabled = false;

        signupBtn.textContent =
            "ثبت نام ✨";

    }

});
</script>

</body>
</html>
