<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت نام | هدف 🏹</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,.2);
    }

    input::placeholder {
      color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c63ff, #3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
    }

    .login-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .login-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }

    #debug {
      margin-top: 20px;
      padding: 12px;
      background: rgba(0,0,0,.5);
      border-radius: 10px;
      color: #7cff7c;
      font-size: 12px;
      direction: ltr;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚀 ثبت نام</h1>

  <p class="subtitle">
    به خانواده‌ی هدف خوش آمدی!
  </p>

  <div class="form-group">
    <label>👤 نام کاربری</label>
    <input
      type="text"
      id="username"
      placeholder="مثلاً: parsabravo"
      autocomplete="username">
  </div>

  <div class="form-group">
    <label>📧 ایمیل</label>
    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email">
  </div>

  <div class="form-group">
    <label>🔒 رمز عبور</label>
    <input
      type="password"
      id="password"
      placeholder="حداقل ۶ کاراکتر"
      autocomplete="new-password">
  </div>

  <button id="signupBtn">
    ثبت نام ✨
  </button>

  <div id="message"></div>

  <div class="login-link">
    قبلاً عضو شدی؟
    <a href="login.html">وارد شو</a>
  </div>

  <div id="debug">
    ⏳ آماده...
  </div>

</div>


<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

"use strict";

/* =====================================================
   تنظیمات
===================================================== */

/*
  ⚠️ کلید JSONBin را مستقیماً داخل سایت عمومی قرار نده.
  این مقدار را فقط برای تست قرار بده.
*/

const BIN_ID = "674f4e08ad19ca34f8d8d1d0";

const JSONBIN_KEY = "YOUR_JSONBIN_MASTER_KEY";


const EMAILJS_PUBLIC_KEY = "OIV0VJKImeRxTYHk8";

const EMAILJS_SERVICE_ID = "service_xeltni9";

const EMAILJS_TEMPLATE_ID = "template_k94e2cs";


/* =====================================================
   عناصر صفحه
===================================================== */

const debug = document.getElementById("debug");

const btn = document.getElementById("signupBtn");

const message = document.getElementById("message");


/* =====================================================
   دیباگ
===================================================== */

function log(text) {

  const time =
    new Date().toLocaleTimeString("fa-IR");

  debug.innerHTML +=
    `🟢 ${time} - ${text}<br>`;

  debug.scrollTop =
    debug.scrollHeight;
}


log("🚀 صفحه ثبت نام آماده شد");


/* =====================================================
   EmailJS
===================================================== */

try {

  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });

  log("✅ EmailJS آماده شد");

} catch (error) {

  log(
    "❌ خطا در EmailJS: " +
    error.message
  );

}


/* =====================================================
   نمایش پیام
===================================================== */

function showMessage(text, error = false) {

  message.style.display = "block";

  message.textContent = text;

  if (error) {

    message.style.background =
      "rgba(255,70,70,.15)";

    message.style.color =
      "#ff7777";

  } else {

    message.style.background =
      "rgba(70,255,70,.15)";

    message.style.color =
      "#7cff7c";

  }
}


/* =====================================================
   خواندن اطلاعات از JSONBin
===================================================== */

async function getUsers() {

  if (
    !JSONBIN_KEY ||
    JSONBIN_KEY === "YOUR_JSONBIN_MASTER_KEY"
  ) {

    throw new Error(
      "کلید JSONBin را وارد نکرده‌ای."
    );

  }


  const response = await fetch(

    `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,

    {
      method: "GET",

      headers: {
        "X-Master-Key": JSONBIN_KEY
      }
    }

  );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data?.message ||
      "خطا در خواندن JSONBin"
    );

  }


  const record =
    data?.record || {};


  if (!Array.isArray(record.users)) {

    record.users = [];

  }


  return record;

}


/* =====================================================
   ذخیره اطلاعات
===================================================== */

async function saveUsers(data) {

  const response = await fetch(

    `https://api.jsonbin.io/v3/b/${BIN_ID}`,

    {

      method: "PUT",

      headers: {

        "Content-Type":
          "application/json",

        "X-Master-Key":
          JSONBIN_KEY

      },

      body: JSON.stringify({

        users: data.users || []

      })

    }

  );


  const result =
    await response.json();


  if (!response.ok) {

    throw new Error(
      result?.message ||
      "ذخیره اطلاعات انجام نشد."
    );

  }


  return result;

}


/* =====================================================
   ارسال ایمیل تأیید
===================================================== */

async function sendVerificationEmail(
  email,
  username
) {

  log(
    "📧 در حال ارسال ایمیل..."
  );


  const verificationLink =
    "https://hadaf.site/verify.html?email=" +
    encodeURIComponent(email);


  const params = {

    to_email: email,

    to_name: username,

    verification_link:
      verificationLink

  };


  const result =
    await emailjs.send(

      EMAILJS_SERVICE_ID,

      EMAILJS_TEMPLATE_ID,

      params

    );


  log("✅ ایمیل ارسال شد");

  return result;

}


/* =====================================================
   ثبت نام
===================================================== */

btn.addEventListener(
  "click",
  async function () {

    log("👆 دکمه ثبت نام کلیک شد");

    const username =
      document
        .getElementById("username")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("password")
        .value;


    /* اعتبارسنجی */

    if (
      !username ||
      !email ||
      !password
    ) {

      showMessage(
        "❌ همه فیلدها را پر کن.",
        true
      );

      return;

    }


    if (username.length < 3) {

      showMessage(
        "❌ نام کاربری حداقل ۳ کاراکتر باشد.",
        true
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "❌ رمز عبور باید حداقل ۶ کاراکتر باشد.",
        true
      );

      return;

    }


    if (
      !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email)
    ) {

      showMessage(
        "❌ ایمیل معتبر نیست.",
        true
      );

      return;

    }


    btn.disabled = true;

    btn.textContent =
      "⏳ در حال ثبت نام...";


    try {

      /* خواندن کاربران */

      log(
        "📥 دریافت کاربران..."
      );

      const data =
        await getUsers();


      /* بررسی ایمیل */

      const emailExists =
        data.users.some(
          user =>
            String(user.email)
              .toLowerCase() === email
        );


      if (emailExists) {

        showMessage(
          "❌ این ایمیل قبلاً ثبت شده.",
          true
        );

        return;

      }


      /* بررسی نام کاربری */

      const usernameExists =
        data.users.some(
          user =>
            String(user.username)
              .toLowerCase() ===
            username.toLowerCase()
        );


      if (usernameExists) {

        showMessage(
          "❌ این نام کاربری قبلاً استفاده شده.",
          true
        );

        return;

      }


      /* ساخت کاربر */

      const newUser = {

        id:
          Date.now(),

        username:
          username,

        email:
          email,

        /*
          ⚠️ برای پروژه واقعی نباید
          رمز عبور خام ذخیره شود.
          فعلاً فقط برای تست.
        */

        password:
          password,

        verified:
          false,

        created_at:
          new Date().toISOString()

      };


      data.users.push(
        newUser
      );


      /* ذخیره */

      log(
        "💾 ذخیره کاربر..."
      );

      await saveUsers(
        data
      );


      log(
        "✅ کاربر ذخیره شد"
      );


      /* ایمیل */

      try {

        await sendVerificationEmail(
          email,
          username
        );

      } catch (emailError) {

        log(
          "⚠️ کاربر ذخیره شد ولی ایمیل ارسال نشد: " +
          emailError.message
        );

      }


      /* پاک کردن فرم */

      document
        .getElementById("username")
        .value = "";

      document
        .getElementById("email")
        .value = "";

      document
        .getElementById("password")
        .value = "";


      showMessage(
        "✅ ثبت نام با موفقیت انجام شد! 🎉",
        false
      );


    } catch (error) {

      console.error(error);

      log(
        "❌ " +
        error.message
      );

      showMessage(
        "❌ " +
        error.message,
        true
      );

    } finally {

      btn.disabled = false;

      btn.textContent =
        "ثبت نام ✨";

    }

  }
);

</script>

</body>
</html>
