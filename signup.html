
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0c29">
<title>ثبت نام | هدف 🏹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}
.card{width:100%;max-width:430px;padding:30px 24px;border:1px solid #ffffff25;border-radius:24px;background:#ffffff10;backdrop-filter:blur(16px);box-shadow:0 20px 60px #0004}
.logo{text-align:center;font-size:48px;margin-bottom:10px}
h1{text-align:center;font-size:26px;margin-bottom:10px}
.subtitle{text-align:center;color:#d6d2ee;font-size:13px;margin-bottom:25px}
label{display:block;margin:16px 0 8px;font-size:14px}
input{width:100%;padding:14px;border:1px solid #ffffff25;border-radius:12px;background:#ffffff10;color:#fff;font-size:15px;outline:none}
input:focus{border-color:#a78bfa}
input::placeholder{color:#bdb8d7}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.error{display:block;background:#ef444425;color:#fecaca}
.success{display:block;background:#22c55e25;color:#bbf7d0}
a{color:#c4b5fd;text-decoration:none}
.footer{text-align:center;margin-top:20px;font-size:13px;color:#ddd}
</style>
</head>
<body>
<main class="card">
<div class="logo">🏹</div>
<h1>ساخت حساب هدف</h1>
<p class="subtitle">حساب بساز و برای رسیدن به هدف‌هایت تلاش کن!</p>

<form id="signupForm">
<label for="username">نام کاربری</label>
<input id="username" name="username" type="text" minlength="3" maxlength="50" autocomplete="username" placeholder="نام کاربری" required>

<label for="email">ایمیل</label>
<input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="example@email.com" required>

<label for="password">رمز عبور</label>
<input id="password" name="password" type="password" minlength="6" autocomplete="new-password" placeholder="حداقل ۶ کاراکتر" required>

<label for="confirmPassword">تکرار رمز عبور</label>
<input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="رمز عبور را دوباره وارد کن" required>

<button id="signupBtn" type="submit">ثبت‌نام</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>

<p class="footer">قبلاً حساب ساخته‌ای؟ <a href="login.html">وارد شو</a></p>
</main>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbyYLVpP-NegJUJazhTr0PcukUBEiT0cb3joLPvbakKKkPND5z48gDcj7mcg6CnSb7RJ/exec";

const form = document.getElementById("signupForm");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const button = document.getElementById("signupBtn");
const message = document.getElementById("message");

function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
}

function getError(result) {
    return result?.message || result?.error || "ثبت‌نام انجام نشد.";
}

form.addEventListener("submit", async event => {
    event.preventDefault();

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (username.length < 3) {
        showMessage("نام کاربری باید حداقل ۳ کاراکتر باشد.");
        return;
    }

    if (password.length < 6) {
        showMessage("رمز عبور باید حداقل ۶ کاراکتر باشد.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage("رمز عبور و تکرار آن یکسان نیستند.");
        return;
    }

    button.disabled = true;
    button.textContent = "در حال ثبت‌نام...";
    message.className = "message";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {"Content-Type": "text/plain;charset=UTF-8"},
            body: JSON.stringify({
                action: "signup",
                operation: "signup",
                username,
                email,
                password
            }),
            cache: "no-store",
            redirect: "follow"
        });

        const text = await response.text();
        let result;

        try {
            result = JSON.parse(text);
        } catch {
            throw new Error("پاسخ API معتبر نیست. انتشار وب‌اپ را بررسی کن.");
        }

        if (!response.ok || result.success !== true) {
            throw new Error(getError(result));
        }

        const apiUser = result.user || result.data?.user || result.data || {};

        const user = {
            id: apiUser.id ?? "",
            user_id: apiUser.user_id ?? "",
            username: apiUser.username || username,
            email: String(apiUser.email || email).trim().toLowerCase(),
            score: Number(apiUser.score ?? 0)
        };

        localStorage.setItem("hadafUser", JSON.stringify(user));
        localStorage.removeItem("hadafAccessToken");

        showMessage("ثبت‌نام موفق بود! در حال رفتن به سایت...", "success");
        button.textContent = "ثبت‌نام موفق";

        setTimeout(() => location.href = "index.html", 800);

    } catch (error) {
        showMessage(error.message || "ارتباط با سرور برقرار نشد.");
        button.disabled = false;
        button.textContent = "ثبت‌نام";
    }
});
</script>
</body>
</html>
