<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>هدف من 🎯 | سایت هدف</title>

<meta
    name="description"
    content="هدف روزانه خودت را در سایت هدف بساز، هر روز انجامش بده و Streak خودت را ادامه بده."
>

<meta name="theme-color" content="#07090f">

<style>

:root{
    --bg:#07090f;
    --card:rgba(18,22,34,.97);
    --border:rgba(255,255,255,.075);
    --text:#f8fafc;
    --muted:#8f98a9;
    --primary:#6758ff;
    --primary2:#5146da;
    --orange:#ff7a32;
    --yellow:#facc15;
    --green:#22c55e;
    --red:#ef4444;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:16px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    padding-bottom:100px;
    font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;
    color:var(--text);
    background:
        radial-gradient(
            circle at 85% -5%,
            rgba(103,88,255,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 0% 35%,
            rgba(37,99,235,.07),
            transparent 28%
        ),
        var(--bg);
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
}

/* APP */

.app{
    width:min(720px,94%);
    margin:auto;
    padding:18px 0 50px;
}

/* TOPBAR */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:45px;
    height:45px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:rgba(103,88,255,.09);
    border:1px solid var(--border);
}

.brand-logo img{
    width:37px;
    height:37px;
    object-fit:contain;
}

.brand-text strong{
    display:block;
    font-size:17px;
}

.brand-text span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.back{
    width:42px;
    height:42px;
    border:1px solid var(--border);
    border-radius:14px;
    color:#c7cbd4;
    background:rgba(255,255,255,.035);
    font-size:20px;
    cursor:pointer;
}

/* HEADER */

.page-header{
    margin-bottom:20px;
}

.page-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 11px;
    margin-bottom:12px;
    border-radius:999px;
    color:#c7c0ff;
    background:rgba(103,88,255,.10);
    border:1px solid rgba(103,88,255,.20);
    font-size:11px;
}

.page-header h1{
    margin:0;
    font-size:clamp(29px,6vw,42px);
    line-height:1.45;
}

.page-header h1 span{
    color:#8b80ff;
}

.page-header p{
    margin:10px 0 0;
    color:var(--muted);
    line-height:1.9;
    font-size:13px;
}

/* STREAK */

.streak-card{
    position:relative;
    overflow:hidden;
    padding:24px;
    margin-bottom:18px;
    border-radius:var(--radius-xl);
    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(255,122,50,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 100%,
            rgba(103,88,255,.14),
            transparent 35%
        ),
        linear-gradient(
            150deg,
            rgba(20,24,36,.98),
            rgba(11,14,23,.98)
        );
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 22px 70px rgba(0,0,0,.34);
}

.streak-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.fire-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}

.fire{
    width:64px;
    height:64px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    font-size:34px;
    background:rgba(255,122,50,.09);
    border:1px solid rgba(255,122,50,.16);
    box-shadow:0 12px 35px rgba(255,122,50,.10);
}

.streak-info{
    min-width:0;
}

.streak{
    font-size:39px;
    font-weight:800;
    line-height:1;
}

.streak-label{
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
}

.best{
    flex-shrink:0;
    padding:10px 12px;
    border-radius:14px;
    text-align:center;
    color:var(--yellow);
    background:rgba(250,204,21,.06);
    border:1px solid rgba(250,204,21,.10);
    font-size:10px;
}

.best strong{
    display:block;
    margin-top:5px;
    color:#fff;
    font-size:18px;
}

/* CARD */

.card{
    margin-top:14px;
    padding:21px;
    border-radius:var(--radius-lg);
    background:
        linear-gradient(
            145deg,
            rgba(18,22,34,.97),
            rgba(12,15,23,.97)
        );
    border:1px solid var(--border);
    box-shadow:0 15px 45px rgba(0,0,0,.23);
}

.card-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
}

.card-title h2{
    margin:0;
    font-size:17px;
}

.card-title span{
    color:var(--muted);
    font-size:10px;
}

/* INPUT */

input{
    width:100%;
    min-height:54px;
    padding:14px 15px;
    border:1px solid rgba(255,255,255,.075);
    border-radius:var(--radius-md);
    outline:none;
    color:white;
    background:rgba(255,255,255,.035);
    font-size:14px;
}

input:focus{
    border-color:rgba(103,88,255,.50);
    box-shadow:0 0 0 4px rgba(103,88,255,.08);
}

input::placeholder{
    color:#667085;
}

/* BUTTON */

.main-button{
    width:100%;
    margin-top:12px;
    padding:15px;
    border:0;
    border-radius:var(--radius-md);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(
        100deg,
        #6657ff,
        #7868ff
    );
    box-shadow:0 12px 32px rgba(103,88,255,.20);
}

.main-button:disabled{
    opacity:.48;
    cursor:default;
}

.done{
    background:linear-gradient(
        100deg,
        #6758ff,
        #5146da
    );
}

/* GOAL */

.goal-name{
    padding:16px;
    margin-bottom:4px;
    border-radius:var(--radius-md);
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.055);
    font-size:18px;
    font-weight:800;
    line-height:1.8;
    text-align:center;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:14px;
}

.stat{
    padding:14px 9px;
    border-radius:16px;
    text-align:center;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.045);
    color:var(--muted);
    font-size:10px;
}

.stat strong{
    display:block;
    margin-top:6px;
    color:white;
    font-size:22px;
}

/* MESSAGE */

.message{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    color:#86efac;
    font-size:12px;
    font-weight:700;
}

.error{
    color:#fca5a5 !important;
}

/* DELETE */

.delete{
    width:100%;
    margin-top:17px;
    padding:12px;
    border:1px solid rgba(239,68,68,.13);
    border-radius:14px;
    color:#f87171;
    background:rgba(239,68,68,.045);
    font-size:12px;
    cursor:pointer;
}

/* GENERAL */

.hidden{
    display:none !important;
}

.loading{
    padding:31px;
    text-align:center;
    color:var(--muted);
}

.login-warning{
    text-align:center;
}

.login-warning p{
    color:var(--muted);
    line-height:1.9;
    font-size:12px;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:14px;
    left:50%;
    z-index:50;
    width:min(520px,calc(100% - 28px));
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:8px 7px;
    border-radius:22px;
    background:rgba(13,16,24,.93);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 16px 50px rgba(0,0,0,.45);
    backdrop-filter:blur(22px);
}

.nav-item{
    border:0;
    padding:7px 4px;
    border-radius:15px;
    color:#727b8c;
    background:transparent;
    cursor:pointer;
    font-size:10px;
}

.nav-item .nav-icon{
    display:block;
    margin-bottom:4px;
    font-size:19px;
}

.nav-item.active{
    color:#8a7fff;
    background:rgba(103,88,255,.10);
}

/* MOBILE */

@media(max-width:520px){

    .app{
        width:92%;
    }

    .streak-card{
        padding:18px;
    }

    .streak-main{
        align-items:flex-start;
    }

    .fire{
        width:56px;
        height:56px;
        font-size:30px;
    }

    .streak{
        font-size:34px;
    }

    .best{
        padding:8px 9px;
    }

    .card{
        padding:18px;
    }

    .goal-name{
        font-size:16px;
    }
}

@media(max-width:390px){

    .stats{
        grid-template-columns:1fr;
    }

    .best{
        display:none;
    }
}

</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

                src="logo.png"
                alt="لوگوی سایت هدف"
            >

        </div>

        <div class="brand-text">

            <strong>هدف 🏹</strong>

        </div>

    <button

<section class="page-header">

        class="nav-item"

    >
        <span class="nav-icon">🧮</span>
        ابزارها
    </button>

</nav>


<script>

/* =================================
   API
================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbw1TBun1WJbTehqUspDdQV1gQ4s34zhonvMgote3w-fVVYjqxxuSOeeMLAFKJNfsf0y/exec";


/* =================================
   STATE
================================= */

let currentGoal = null;
let currentGoals = [];
let busy = false;


/* =================================
   EMAIL
================================= */

function getEmail(){

    const keys = [
        "hadafUser",
        "user",
        "email",
        "hadaf_email",
        "userEmail"
    ];

    for(const key of keys){

        const value =
            localStorage.getItem(key);

        if(!value){
            continue;
        }

        try{

            const parsed =
                JSON.parse(value);

            if(
                parsed &&
                typeof parsed === "object" &&
                parsed.email
            ){

                return String(parsed.email)
                    .trim()
                    .toLowerCase();

            }

        }
        catch(e){}

        if(
            String(value).includes("@")
        ){

            return String(value)
                .trim()
                .toLowerCase();

        }

    }

    return "";
}


/* =================================
   CACHE
================================= */

function getGoalsCacheKey(email){

    return "hadaf_goals_" +
        String(email)
            .trim()
            .toLowerCase();

}


function saveGoalsCache(){

    const email =
        getEmail();

    if(!email){
        return;
    }

    try{

        localStorage.setItem(
            getGoalsCacheKey(email),
            JSON.stringify({
                goals:currentGoals,
                currentGoalId:
                    currentGoal
                        ? currentGoal.id
                        : null
            })
        );

    }
    catch(e){}

}


function getGoalsCache(){

    const email =
        getEmail();

    if(!email){
        return null;
    }

    try{

        const raw =
            localStorage.getItem(
                getGoalsCacheKey(email)
            );

        if(!raw){
            return null;
        }

        return JSON.parse(raw);

    }
    catch(e){

        return null;

    }

}


/* =================================
   TODAY
================================= */

function getTodayString(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =================================
   API CALL
================================= */

async function callAPI(payload){

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function(){

                controller.abort();

            },
            20000
        );

    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(payload),

                    cache:"no-store",

                    credentials:"omit",

                    redirect:"follow",

                    signal:
                        controller.signal
                }
            );

        if(!response.ok){

            throw new Error(
                "خطای سرور: " +
                response.status
            );

        }

        const text =
            await response.text();

        if(!text){

            throw new Error(
                "سرور پاسخ خالی فرستاد."
            );

        }

        let data;

        try{

            data =
                JSON.parse(text);

        }
        catch(e){

            throw new Error(
                "پاسخ سرور معتبر نیست."
            );

        }

        return data;

    }
    catch(error){

        if(
            error &&
            error.name === "AbortError"
        ){

            throw new Error(
                "زمان اتصال به سرور تمام شد. اینترنت را بررسی کن."
            );

        }

        throw error;

    }
    finally{

        clearTimeout(timeout);

    }

}


/* =================================
   LOAD GOAL
================================= */

async function loadGoal(){

    const email =
        getEmail();

    const loading =
        document.getElementById("loading");

    const loginWarning =
        document.getElementById("loginWarning");

    if(!email){

        loading.classList.add("hidden");

        loginWarning.classList.remove("hidden");

        render();

        return;

    }

    loginWarning.classList.add("hidden");

    loading.classList.remove("hidden");

    const cached =
        getGoalsCache();

    if(
        cached &&
        Array.isArray(cached.goals)
    ){

        currentGoals =
            cached.goals;

        currentGoal =
            currentGoals.find(
                function(goal){

                    return String(goal.id) ===
                        String(cached.currentGoalId);

                }
            ) ||
            currentGoals[0] ||
            null;

        render();

    }

    try{

        const data =
            await callAPI({
                action:"getGoal",
                email:email
            });

        if(!data.success){

            throw new Error(
                data.message ||
                "دریافت هدف ناموفق بود."
            );

        }

        let goals = [];

        if(
            Array.isArray(data.goals)
        ){

            goals =
                data.goals;

        }
        else if(
            data.goal
        ){

            goals = [
                data.goal
            ];

        }

        currentGoals =
            goals;

        /*
         * اگر هدف قبلی از کش انتخاب شده بود،
         * همان هدف را نگه می‌داریم.
         * در غیر این صورت اولین هدف انتخاب می‌شود.
         */

        const oldId =
            currentGoal
                ? currentGoal.id
                : null;

        currentGoal =
            currentGoals.find(
                function(goal){

                    return String(goal.id) ===
                        String(oldId);

                }
            ) ||
            currentGoals[0] ||
            null;

        saveGoalsCache();

        render();

    }
    catch(error){

        const message =
            document.getElementById("message");

        if(message && !currentGoal){

            message.textContent =
                "❌ " +
                (
                    error.message ||
                    "خطا در دریافت اطلاعات"
                );

            message.classList.add("error");

        }

    }
    finally{

        loading.classList.add("hidden");

    }

}


/* =================================
   CREATE GOAL
================================= */

async function createGoal(event){

    if(event){

        event.preventDefault();
        event.stopImmediatePropagation();

    }

    if(busy){
        return false;
    }

    const email =
        getEmail();

    const input =
        document.getElementById("goalInput");

    const button =
        document.getElementById("createButton");

    const message =
        document.getElementById("message");

    if(!email){

        location.href =
            "login.html";

        return false;

    }

    const goal =
        input.value.trim();

    if(!goal){

        input.focus();

        return false;

    }

    busy = true;

    button.disabled = true;

    button.textContent =
        "⏳ در حال ساخت...";

    message.textContent = "";

    message.classList.remove("error");

    try{

        const data =
            await callAPI({
                action:"createGoal",
                email:email,
                goal:goal
            });

        if(!data.success){

            throw new Error(
                data.message ||
                "ساخت هدف ناموفق بود."
            );

        }

        let newGoal =
            data.goal ||
            data.data ||
            null;

        if(!newGoal){

            newGoal = {

                id:Date.now(),

                goal:goal,

                streak:0,

                bestStreak:0,

                totalDays:0,

                lastCompleted:""

            };

        }

        currentGoals.push(
            newGoal
        );

        currentGoal =
            newGoal;

        input.value = "";

        saveGoalsCache();

        render();

        message.textContent =
            data.message ||
            "هدف با موفقیت ساخته شد.";

    }
    catch(error){

        message.textContent =
            "❌ " +
            (
                error.message ||
                "خطا در ساخت هدف"
            );

        message.classList.add("error");

    }
    finally{

        busy = false;

        button.disabled = false;

        button.textContent =
            "ساختن هدف 🚀";

    }

    return false;

}


/* =================================
   COMPLETE GOAL
================================= */

async function completeGoal(event){

    if(event){

        event.preventDefault();
        event.stopImmediatePropagation();

    }

    if(busy){
        return false;
    }

    const email =
        getEmail();

    if(
        !email ||
        !currentGoal
    ){

        return false;

    }

    const button =
        document.getElementById("doneButton");

    const message =
        document.getElementById("message");

    const today =
        getTodayString();

    if(
        currentGoal.lastCompleted &&
        String(
            currentGoal.lastCompleted
        ).slice(0,10) === today
    ){

        render();

        return false;

    }

    busy = true;

    button.disabled = true;

    button.textContent =
        "⏳ در حال ثبت...";

    message.textContent = "";

    message.classList.remove("error");

    /*
     * اطلاعات قبلی را نگه می‌داریم تا اگر پاسخ API
     * ناقص بود، صفحه خراب نشود.
     */

    const previousGoal = {
        ...currentGoal
    };

    try{

        const data =
            await callAPI({

                action:"completeGoal",

                email:email,

                goalId:currentGoal.id

            });

        if(!data.success){

            throw new Error(
                data.message ||
                "ثبت انجام هدف ناموفق بود."
            );

        }

        if(data.goal){

            currentGoal = {
                ...currentGoal,
                ...data.goal
            };

        }
        else{

            currentGoal.lastCompleted =
                today;

            currentGoal.streak =
                Number(
                    currentGoal.streak || 0
                ) + 1;

            currentGoal.totalDays =
                Number(
                    currentGoal.totalDays || 0
                ) + 1;

            currentGoal.bestStreak =
                Math.max(
                    Number(
                        currentGoal.bestStreak || 0
                    ),
                    Number(
                        currentGoal.streak || 0
                    )
                );

        }

        /*
         * اگر API تاریخ را با فرمت متفاوت فرستاد،
         * برای امروز همچنان وضعیت دکمه درست می‌ماند.
         */

        if(
            !currentGoal.lastCompleted
        ){

            currentGoal.lastCompleted =
                today;

        }

        const index =
            currentGoals.findIndex(
                function(goal){

                    return String(goal.id) ===
                        String(currentGoal.id);

                }
            );

        if(index !== -1){

            currentGoals[index] = {
                ...currentGoals[index],
                ...currentGoal
            };

        }

        saveGoalsCache();

        render();

        message.textContent =
            data.message ||
            "🔥 امروز هم ثبت شد.";

        message.classList.remove("error");

        celebrate();

    }
    catch(error){

        /*
         * مهم:
         * در صورت خطا، صفحه رفرش نمی‌شود
         * و اطلاعات قبلی برمی‌گردد.
         */

        currentGoal = previousGoal;

        const index =
            currentGoals.findIndex(
                function(goal){

                    return String(goal.id) ===
                        String(previousGoal.id);

                }
            );

        if(index !== -1){

            currentGoals[index] =
                previousGoal;

        }

        message.textContent =
            "❌ " +
            (
                error.message ||
                "خطایی رخ داد."
            );

        message.classList.add("error");

        button.disabled = false;

        button.textContent =
            "امروز انجامش دادم 🔥";

    }
    finally{

        busy = false;

    }

    return false;

}


/* =================================
   DELETE
================================= */

async function deleteGoal(event){

    if(event){

        event.preventDefault();
        event.stopImmediatePropagation();

    }

    if(busy){
        return false;
    }

    const email =
        getEmail();

    if(
        !email ||
        !currentGoal
    ){

        return false;

    }

    const confirmed =
        window.confirm(
            "مطمئنی می‌خواهی این هدف و Streak آن را حذف کنی؟"
        );

    if(!confirmed){

        return false;

    }

    busy = true;

    try{

        const data =
            await callAPI({

                action:"deleteGoal",

                email:email,

                goalId:currentGoal.id

            });

        if(!data.success){

            throw new Error(
                data.message ||
                "حذف هدف ناموفق بود."
            );

        }

        currentGoals =
            currentGoals.filter(
                function(goal){

                    return String(goal.id) !==
                        String(currentGoal.id);

                }
            );

        currentGoal =
            currentGoals[0] ||
            null;

        saveGoalsCache();

        render();

    }
    catch(error){

        window.alert(
            "❌ " +
            (
                error.message ||
                "خطا در حذف هدف"
            )
        );

    }
    finally{

        busy = false;

    }

    return false;

}


/* =================================
   SELECT GOAL
================================= */

function selectGoal(id){

    const found =
        currentGoals.find(
            function(goal){

                return String(goal.id) ===
                    String(id);

            }
        );

    if(!found){
        return;
    }

    currentGoal =
        found;

    saveGoalsCache();

    render();

}


/* =================================
   GOAL LIST
================================= */

function renderGoalList(){

    let list =
        document.getElementById(
            "multiGoalList"
        );

    const goalBox =
        document.getElementById(
            "goalBox"
        );

    if(!goalBox){
        return;
    }

    if(!list){

        list =
            document.createElement("div");

        list.id =
            "multiGoalList";

        list.style.marginBottom =
            "14px";

        list.style.display =
            "grid";

        list.style.gap =
            "8px";

        goalBox.parentNode.insertBefore(
            list,
            goalBox
        );

    }

    if(currentGoals.length <= 1){

        list.innerHTML = "";

        list.classList.add("hidden");

        return;

    }

    list.classList.remove("hidden");

    list.innerHTML =
        currentGoals
            .map(
                function(goal,index){

                    const active =
                        currentGoal &&
                        String(currentGoal.id) ===
                        String(goal.id);

                    const safeId =
                        String(goal.id)
                            .replace(
                                /\\/g,
                                "\\\\"
                            )
                            .replace(
                                /'/g,
                                "\\'"
                            );

                    return `

                        <button
                            type="button"
                            onclick="selectGoal('${safeId}')"
                            style="
                                width:100%;
                                padding:13px 15px;
                                border-radius:16px;
                                border:1px solid ${
                                    active
                                        ? "rgba(103,88,255,.45)"
                                        : "rgba(255,255,255,.075)"
                                };
                                background:${
                                    active
                                        ? "rgba(103,88,255,.12)"
                                        : "rgba(255,255,255,.035)"
                                };
                                color:#fff;
                                text-align:right;
                                cursor:pointer;
                                font-family:inherit;
                                font-size:13px;
                            "
                        >

                            🎯 ${
                                escapeHTML(
                                    goal.goal ||
                                    ("هدف " + (index + 1))
                                )
                            }

                            <span
                                style="
                                    display:block;
                                    color:#8f98a9;
                                    font-size:10px;
                                    margin-top:4px;
                                "
                            >
                                🔥 ${
                                    Number(
                                        goal.streak || 0
                                    )
                                } روز
                            </span>

                        </button>

                    `;

                }
            )
            .join("");

}


/* =================================
   RENDER
================================= */

function render(){

    const createBox =
        document.getElementById("createBox");

    const goalBox =
        document.getElementById("goalBox");

    const message =
        document.getElementById("message");

    if(!createBox || !goalBox){
        return;
    }

    message.classList.remove("error");

    renderGoalList();

    if(!currentGoal){

        createBox.classList.remove("hidden");

        goalBox.classList.add("hidden");

        document
            .getElementById("streak")
            .textContent = "0";

        document
            .getElementById("bestStreak")
            .textContent = "0";

        document
            .getElementById("record")
            .textContent = "0";

        document
            .getElementById("totalDays")
            .textContent = "0";

        return;

    }

    createBox.classList.remove("hidden");

    goalBox.classList.remove("hidden");

    document
        .getElementById("goalName")
        .textContent =
        currentGoal.goal || "";

    document
        .getElementById("streak")
        .textContent =
        Number(
            currentGoal.streak || 0
        );

    document
        .getElementById("bestStreak")
        .textContent =
        Number(
            currentGoal.bestStreak || 0
        );

    document
        .getElementById("record")
        .textContent =
        Number(
            currentGoal.bestStreak || 0
        );

    document
        .getElementById("totalDays")
        .textContent =
        Number(
            currentGoal.totalDays || 0
        );

    const button =
        document.getElementById(
            "doneButton"
        );

    if(
        currentGoal.lastCompleted &&
        String(
            currentGoal.lastCompleted
        ).slice(0,10) ===
        getTodayString()
    ){

        button.disabled = true;

        button.textContent =
            "امروز انجام شد ✓";

        message.textContent =
            "🔥 امروز ثبت شده.";

    }
    else{

        /*
         * اگر در حال ارسال درخواست هستیم،
         * دکمه را دوباره فعال نکن.
         */

        if(!busy){

            button.disabled = false;

            button.textContent =
                "امروز انجامش دادم 🔥";

        }

        message.textContent = "";

    }

}


/* =================================
   CELEBRATE
================================= */

function celebrate(){

    const fire =
        document.querySelector(".fire");

    if(!fire){
        return;
    }

    if(
        typeof fire.animate ===
        "function"
    ){

        fire.animate(
            [
                {
                    transform:"scale(1)"
                },
                {
                    transform:
                        "scale(1.28) rotate(-7deg)"
                },
                {
                    transform:
                        "scale(1.12) rotate(6deg)"
                },
                {
                    transform:"scale(1)"
                }
            ],
            {
                duration:620,
                easing:"ease"
            }
        );

    }

}


/* =================================
   SAFE TEXT
================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


/* =================================
   BACK
================================= */

function goBack(){

    if(
        history.length > 1
    ){

        history.back();

    }
    else{

        location.href =
            "index.html";

    }

}


/* =================================
   NAVIGATION
================================= */

function navigate(url){

    if(
        !url
    ){
        return;
    }

    window.location.assign(url);

}


/* =================================
   GLOBAL CLICK PROTECTION
================================= */

/*
 * این قسمت اضافه شده تا هیچ کلیک روی دکمه
 * باعث submit یا رفرش ناخواسته صفحه نشود.
 */

document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest("button");

        if(!button){
            return;
        }

        if(
            button.id === "doneButton" ||
            button.id === "createButton" ||
            button.id === "deleteButton"
        ){

            event.preventDefault();

        }

    },
    true
);


/* =================================
   PREVENT FORM SUBMIT
================================= */

document.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

    },
    true
);


/* =================================
   EVENTS
================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const goalInput =
            document.getElementById(
                "goalInput"
            );

        const createButton =
            document.getElementById(
                "createButton"
            );

        const doneButton =
            document.getElementById(
                "doneButton"
            );

        const deleteButton =
            document.getElementById(
                "deleteButton"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );


        /* دکمه‌ها همیشه button هستند */

        createButton.type =
            "button";

        doneButton.type =
            "button";

        deleteButton.type =
            "button";


        /* ساخت هدف */

        createButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();
                event.stopImmediatePropagation();

                createGoal(event);

            }
        );


        /* انجام هدف */

        doneButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();
                event.stopImmediatePropagation();

                completeGoal(event);

            }
        );


        /* حذف هدف */

        deleteButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();
                event.stopImmediatePropagation();

                deleteGoal(event);

            }
        );


        /* Enter داخل ورودی */

        goalInput.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Enter"
                ){

                    event.preventDefault();
                    event.stopImmediatePropagation();

                    createGoal(event);

                }

            }
        );


        /* بازگشت */

        backButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                goBack();

            }
        );


        /* ورود */

        loginButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                location.href =
                    "login.html";

            }
        );


        /* منوی پایین */

        document
            .querySelectorAll(
                ".nav-item[data-url]"
            )
            .forEach(
                function(item){

                    item.addEventListener(
                        "click",
                        function(event){

                            event.preventDefault();

                            navigate(
                                item.dataset.url
                            );

                        }
                    );

                }
            );


        /* شروع */

        loadGoal();

    }
);

</script>
