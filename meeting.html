
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a12">
<title>جلسه آنلاین | Hadaf Meet</title>

<style>
:root {
    --bg:#080a12;
    --panel:#121624;
    --border:rgba(255,255,255,.09);
    --purple:#6758ff;
    --text:#f8fafc;
    --muted:#929bad;
    --red:#ef4444;
    --green:#22c55e;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body {
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

button,input {font-family:inherit}
button {cursor:pointer}

.app {
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header {
    min-height:65px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
    background:#0c0f19;
}

.brand {
    display:flex;
    align-items:center;
    gap:10px;
}

.logo {
    width:38px;
    height:38px;
    border-radius:12px;
    background:rgba(103,88,255,.15);
    display:grid;
    place-items:center;
    overflow:hidden;
}

.logo img {
    width:32px;
    height:32px;
    object-fit:contain;
}

.brand strong {font-size:14px}

.room-info {
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--muted);
    font-size:10px;
}

.live-dot {
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
}

.copy-room {
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.04);
    color:white;
    font-size:10px;
}

.main {
    flex:1;
    width:min(1200px,96%);
    margin:auto;
    padding:20px 0 115px;
}

.meeting-title {
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.meeting-title h1 {
    font-size:18px;
    margin:0;
}

.meeting-title p {
    margin:6px 0 0;
    color:var(--muted);
    font-size:10px;
}

.participant-count {
    padding:10px 13px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    color:#c5c0ff;
    font-size:11px;
}

.video-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.video-card {
    position:relative;
    overflow:hidden;
    min-height:220px;
    aspect-ratio:16/9;
    border-radius:20px;
    background:
        radial-gradient(circle at center,rgba(103,88,255,.14),transparent 55%),
        #141827;
    border:1px solid var(--border);
}

.video-card video {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:#10131e;
}

.video-placeholder {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    color:var(--muted);
}

.avatar {
    width:75px;
    height:75px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:white;
    background:linear-gradient(140deg,#6758ff,#30257d);
    font-size:30px;
}

.video-placeholder small {font-size:11px}

.video-name {
    position:absolute;
    bottom:12px;
    right:12px;
    z-index:2;
    padding:8px 11px;
    border-radius:10px;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:10px;
}

.video-status {
    position:absolute;
    top:12px;
    left:12px;
    z-index:2;
    padding:7px 9px;
    border-radius:9px;
    background:rgba(0,0,0,.55);
    color:#ddd;
    font-size:9px;
}

.video-status.off {color:#fca5a5}

.panels {
    display:grid;
    grid-template-columns:1fr 300px;
    gap:13px;
    margin-top:15px;
}

.panel {
    min-height:170px;
    padding:17px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
}

.panel h3 {
    margin:0 0 13px;
    font-size:13px;
}

.panel-description {
    color:var(--muted);
    font-size:10px;
    line-height:2;
}

.chat-messages {
    height:160px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.chat-message {
    padding:9px 11px;
    max-width:90%;
    border-radius:12px;
    background:rgba(103,88,255,.12);
    font-size:11px;
    line-height:1.8;
    align-self:flex-start;
    overflow-wrap:anywhere;
}

.chat-message.me {
    align-self:flex-end;
    background:rgba(255,255,255,.07);
}

.chat-message strong {
    display:block;
    color:#c5c0ff;
    font-size:9px;
}

.chat-form {
    display:flex;
    gap:7px;
    margin-top:12px;
}

.chat-form input {
    min-width:0;
    flex:1;
    padding:11px;
    color:white;
    background:#090c15;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    font-size:11px;
}

.chat-form button {
    width:43px;
    border:0;
    border-radius:11px;
    color:white;
    background:var(--purple);
}

.toolbar-wrap {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:10;
    padding:12px 10px max(12px,env(safe-area-inset-bottom));
    background:rgba(8,10,18,.95);
    border-top:1px solid var(--border);
    backdrop-filter:blur(15px);
}

.toolbar {
    width:min(650px,100%);
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.control {
    min-width:58px;
    height:58px;
    padding:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#171c2b;
    color:white;
    font-size:19px;
}

.control small {
    font-size:8px;
    color:#c5cada;
}

.control.active {
    background:rgba(103,88,255,.2);
    border-color:rgba(103,88,255,.4);
}

.control.danger {
    background:#b91c1c;
    border-color:#dc2626;
}

.control.disabled {
    background:#4b171e;
    border-color:#7f1d1d;
}

.notice {
    margin-top:15px;
    padding:13px;
    border-radius:13px;
    color:#c7c3ff;
    background:rgba(103,88,255,.08);
    border:1px solid rgba(103,88,255,.15);
    font-size:10px;
    line-height:2;
    overflow-wrap:anywhere;
}

@media(max-width:700px) {
    .panels {grid-template-columns:1fr}
    .video-grid {grid-template-columns:1fr}
    .video-card {min-height:190px}
    .toolbar {gap:6px}
    .control {
        min-width:0;
        flex:1;
        height:56px;
        border-radius:13px;
    }
    .header {padding:0 12px}
    .room-info {font-size:9px}
}

@media(max-width:370px) {
    .control {font-size:16px}
    .control small {font-size:7px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="brand">
        <div class="logo">
            <img src="logo.png" alt="هدف">
        </div>
        <strong>Hadaf Meet</strong>
    </div>

    <div class="room-info">
        <span class="live-dot"></span>
        <span id="connectionStatus">در حال اتصال...</span>
        <button class="copy-room" onclick="copyInvite()">🔗 دعوت</button>
    </div>
</header>

<main class="main">

    <div class="meeting-title">
        <div>
            <h1>جلسه آنلاین</h1>
            <p id="roomLabel">شناسه جلسه: در حال دریافت...</p>
        </div>

        <div class="participant-count">
            👥 <span id="participantCount">1</span> نفر
        </div>
    </div>

    <section class="video-grid">

        <div class="video-card">
            <video id="localVideo" autoplay muted playsinline></video>

            <div class="video-placeholder" id="localPlaceholder">
                <div class="avatar">👤</div>
                <small>تصویر دوربین شما</small>
            </div>

            <div class="video-name">شما</div>
            <div class="video-status" id="cameraStatus">دوربین خاموش</div>
        </div>

        <div id="remoteVideos" style="display:contents"></div>

    </section>

    <section class="panels">

        <div class="panel">
            <h3>💬 گفت‌وگوی جلسه</h3>

            <div class="chat-messages" id="chatMessages">
                <div class="chat-message">
                    به جلسه هدف خوش آمدید!
                </div>
            </div>

            <form class="chat-form" id="chatForm">
                <input
                    id="chatInput"
                    placeholder="پیامت را بنویس..."
                    maxlength="500"
                    autocomplete="off"
                >
                <button type="submit">➤</button>
            </form>
        </div>

        <div class="panel">
            <h3>👥 شرکت‌کنندگان</h3>
            <div class="panel-description" id="participantsList">
                در حال دریافت فهرست اعضا...
            </div>
        </div>

    </section>

    <div class="notice" id="notice">
        در حال اتصال به سرور ارتباطی هدف...
    </div>

</main>

<div class="toolbar-wrap">
    <div class="toolbar">

        <button class="control disabled" id="micButton" onclick="toggleMic()">
            🎙️
            <small>میکروفون خاموش</small>
        </button>

        <button class="control" id="cameraButton" onclick="toggleCamera()">
            📷
            <small>دوربین خاموش</small>
        </button>

        <button class="control" id="screenButton" onclick="toggleScreen()">
            🖥️
            <small>اشتراک صفحه</small>
        </button>

        <button class="control" onclick="copyInvite()">
            🔗
            <small>دعوت</small>
        </button>

        <button class="control danger" onclick="leaveMeeting()">
            📞
            <small>خروج</small>
        </button>

    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="meet-config.js"></script>

<script>
const room = new URLSearchParams(location.search).get("room");

const localVideo = document.getElementById("localVideo");
const localPlaceholder = document.getElementById("localPlaceholder");
const cameraStatus = document.getElementById("cameraStatus");

const micButton = document.getElementById("micButton");
const cameraButton = document.getElementById("cameraButton");
const screenButton = document.getElementById("screenButton");

const remoteVideos = document.getElementById("remoteVideos");
const participantsList = document.getElementById("participantsList");
const participantCount = document.getElementById("participantCount");

const socketId = crypto.randomUUID();

let channel = null;
let localStream = null;
let screenStream = null;

let cameraTrack = null;
let micTrack = null;

let cameraOn = false;
let micOn = false;
let screenOn = false;
let joined = false;

const peers = new Map();
const pendingIce = new Map();

const peerConfig = {
    iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
    ]
};

function showNotice(message) {
    document.getElementById("notice").textContent = message;
}

function setConnectionStatus(message) {
    document.getElementById("connectionStatus").textContent = message;
}

function updateParticipantList() {
    const ids = [...peers.keys()];
    participantCount.textContent = ids.length + 1;

    participantsList.replaceChildren();

    const me = document.createElement("p");
    me.textContent = "👤 شما";
    participantsList.appendChild(me);

    ids.forEach(id => {
        const item = document.createElement("p");
        item.textContent = "👤 شرکت‌کننده " + id.slice(0, 5);
        participantsList.appendChild(item);
    });
}

async function sendSignal(event, payload) {
    if (!channel || !joined) return;

    try {
        const result = await channel.send({
            type: "broadcast",
            event,
            payload: {
                from: socketId,
                room,
                ...payload
            }
        });

        if (result !== "ok") {
            showNotice("ارسال اطلاعات ارتباطی با مشکل مواجه شد.");
        }
    } catch (error) {
        console.error("Signal error:", error);
    }
}

async function connectRoom() {
    if (!room) {
        showNotice("شناسه جلسه پیدا نشد. از صفحه جلسات هدف یک جلسه بساز.");
        return;
    }

    if (!window.supabaseClient) {
        showNotice("اتصال Supabase پیدا نشد. فایل meet-config.js را بررسی کن.");
        setConnectionStatus("خطای تنظیمات");
        return;
    }

    channel = window.supabaseClient.channel("hadaf-meet-" + room, {
        config: {
            broadcast: { self: false },
            presence: { key: socketId }
        }
    });

    channel
        .on("broadcast", { event: "peer-joined" }, async ({ payload }) => {
            if (!payload || payload.from === socketId) return;
            await createOffer(payload.from);
        })
        .on("broadcast", { event: "offer" }, async ({ payload }) => {
            if (!payload || payload.to !== socketId) return;
            await receiveOffer(payload.from, payload.description);
        })
        .on("broadcast", { event: "answer" }, async ({ payload }) => {
            if (!payload || payload.to !== socketId) return;
            await receiveAnswer(payload.from, payload.description);
        })
        .on("broadcast", { event: "ice" }, async ({ payload }) => {
            if (!payload || payload.to !== socketId) return;
            await receiveIce(payload.from, payload.candidate);
        })
        .on("broadcast", { event: "chat" }, ({ payload }) => {
            if (!payload || payload.from === socketId) return;
            addChatMessage(payload.text, "شرکت‌کننده", false);
        })
        .on("presence", { event: "sync" }, () => {
            updateParticipantList();
        })
        .on("presence", { event: "join" }, () => {
            updateParticipantList();
        })
        .on("presence", { event: "leave" }, () => {
            updateParticipantList();
        });

    channel.subscribe(async status => {
        if (status === "SUBSCRIBED") {
            joined = true;

            await channel.track({
                userId: socketId,
                joinedAt: new Date().toISOString()
            });

            setConnectionStatus("متصل");
            showNotice("به سرور ارتباطی هدف وصل شدی.");

            await sendSignal("peer-joined", {});
            updateParticipantList();
        }

        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            setConnectionStatus("قطع ارتباط");
            showNotice("اتصال به Supabase برقرار نشد. دوباره تلاش کن.");
        }
    });
}

function createRemoteCard(id) {
    let card = document.getElementById("remote-" + id);

    if (card) return card;

    card = document.createElement("div");
    card.className = "video-card";
    card.id = "remote-" + id;

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;

    const placeholder = document.createElement("div");
    placeholder.className = "video-placeholder";
    placeholder.innerHTML =
        '<div class="avatar">👤</div><small>در انتظار تصویر...</small>';

    const name = document.createElement("div");
    name.className = "video-name";
    name.textContent = "شرکت‌کننده";

    card.append(video, placeholder, name);
    remoteVideos.appendChild(card);

    return card;
}

function getActiveVideoTrack() {
    if (screenOn && screenStream) {
        return screenStream.getVideoTracks()[0] || null;
    }

    return cameraTrack;
}

function getVideoSender(pc) {
    const transceiver = pc.getTransceivers().find(t =>
        t.receiver?.track?.kind === "video" ||
        t.sender?.track?.kind === "video"
    );

    return transceiver ? transceiver.sender : null;
}

async function setPeerVideoTrack(pc, track, stream) {
    let sender = getVideoSender(pc);

    if (sender) {
        await sender.replaceTrack(track || null);
    } else if (track && stream) {
        pc.addTrack(track, stream);
    }
}

function getPeer(id) {
    if (peers.has(id)) return peers.get(id);

    const pc = new RTCPeerConnection(peerConfig);

    peers.set(id, pc);
    createRemoteCard(id);

    if (localStream) {
        localStream.getAudioTracks().forEach(track => {
            pc.addTrack(track, localStream);
        });
    }

    const activeVideo = getActiveVideoTrack();

    if (activeVideo) {
        const stream = screenOn ? screenStream : localStream;
        pc.addTrack(activeVideo, stream);
    }

    pc.onicecandidate = event => {
        if (event.candidate) {
            sendSignal("ice", {
                to: id,
                candidate: event.candidate
            });
        }
    };

    pc.ontrack = event => {
        const card = createRemoteCard(id);
        const video = card.querySelector("video");
        const placeholder = card.querySelector(".video-placeholder");

        if (event.streams[0]) {
            video.srcObject = event.streams[0];
            video.play().catch(() => {});
            placeholder.style.display = "none";
        }
    };

    pc.onconnectionstatechange = () => {
        if (
            pc.connectionState === "failed" ||
            pc.connectionState === "closed"
        ) {
            removePeer(id);
        }
    };

    pc.onnegotiationneeded = async () => {
        if (pc.signalingState !== "stable") return;

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            await sendSignal("offer", {
                to: id,
                description: pc.localDescription
            });
        } catch (error) {
            console.error("Negotiation error:", error);
        }
    };

    updateParticipantList();
    return pc;
}

async function createOffer(id) {
    const pc = getPeer(id);

    if (pc.signalingState !== "stable") return;

    try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await sendSignal("offer", {
            to: id,
            description: pc.localDescription
        });
    } catch (error) {
        console.error("Create offer error:", error);
    }
}

async function receiveOffer(id, description) {
    const pc = getPeer(id);

    try {
        await pc.setRemoteDescription(description);

        const queued = pendingIce.get(id) || [];

        for (const candidate of queued) {
            await pc.addIceCandidate(candidate);
        }

        pendingIce.delete(id);

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await sendSignal("answer", {
            to: id,
            description: pc.localDescription
        });
    } catch (error) {
        console.error("Offer error:", error);
    }
}

async function receiveAnswer(id, description) {
    const pc = peers.get(id);
    if (!pc) return;

    try {
        await pc.setRemoteDescription(description);

        const queued = pendingIce.get(id) || [];

        for (const candidate of queued) {
            await pc.addIceCandidate(candidate);
        }

        pendingIce.delete(id);
    } catch (error) {
        console.error("Answer error:", error);
    }
}

async function receiveIce(id, candidate) {
    if (!candidate) return;

    const pc = peers.get(id);

    if (!pc || !pc.remoteDescription) {
        if (!pendingIce.has(id)) pendingIce.set(id, []);
        pendingIce.get(id).push(candidate);
        return;
    }

    try {
        await pc.addIceCandidate(candidate);
    } catch (error) {
        console.error("ICE error:", error);
    }
}

function removePeer(id) {
    const pc = peers.get(id);

    if (pc) {
        pc.close();
        peers.delete(id);
    }

    pendingIce.delete(id);

    const card = document.getElementById("remote-" + id);
    if (card) card.remove();

    updateParticipantList();
}

async function startMedia() {
    if (localStream) return true;

    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        });

        cameraTrack = localStream.getVideoTracks()[0] || null;
        micTrack = localStream.getAudioTracks()[0] || null;

        if (cameraTrack) cameraTrack.enabled = cameraOn;
        if (micTrack) micTrack.enabled = micOn;

        localVideo.srcObject = localStream;

        for (const pc of peers.values()) {
            localStream.getAudioTracks().forEach(track => {
                const exists = pc.getSenders().some(s =>
                    s.track === track
                );

                if (!exists) pc.addTrack(track, localStream);
            });

            if (!screenOn && cameraTrack) {
                const sender = getVideoSender(pc);

                if (sender) {
                    await sender.replaceTrack(cameraTrack);
                } else {
                    pc.addTrack(cameraTrack, localStream);
                }
            }
        }

        updateCamera();
        updateMic();

        return true;

    } catch (error) {
        console.error("Media error:", error);
        showNotice("دسترسی دوربین یا میکروفون داده نشد: " + error.message);
        return false;
    }
}

async function toggleCamera() {
    if (!localStream && !(await startMedia())) return;
    if (!cameraTrack) return;

    cameraOn = !cameraOn;
    cameraTrack.enabled = cameraOn;

    updateCamera();
}

function updateCamera() {
    const displayingScreen = screenOn;

    localPlaceholder.style.display =
        cameraOn || displayingScreen ? "none" : "flex";

    cameraStatus.textContent = displayingScreen
        ? "اشتراک صفحه فعال"
        : cameraOn ? "دوربین روشن" : "دوربین خاموش";

    cameraStatus.classList.toggle(
        "off",
        !cameraOn && !displayingScreen
    );

    cameraButton.classList.toggle("active", cameraOn);

    cameraButton.querySelector("small").textContent =
        cameraOn ? "دوربین روشن" : "دوربین خاموش";
}

async function toggleMic() {
    if (!localStream && !(await startMedia())) return;
    if (!micTrack) return;

    micOn = !micOn;
    micTrack.enabled = micOn;

    updateMic();
}

function updateMic() {
    micButton.classList.toggle("disabled", !micOn);
    micButton.classList.toggle("active", micOn);

    micButton.querySelector("small").textContent =
        micOn ? "میکروفون روشن" : "میکروفون خاموش";
}

async function toggleScreen() {
    if (screenOn) {
        await stopScreen();
        return;
    }

    if (!window.isSecureContext) {
        showNotice("اشتراک‌گذاری صفحه فقط در اتصال امن HTTPS امکان‌پذیر است.");
        return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia) {
        showNotice("مرورگر شما از اشتراک‌گذاری صفحه پشتیبانی نمی‌کند. مرورگر Chrome به‌روز را امتحان کن.");
        return;
    }

    try {
        showNotice("در حال باز کردن پنجره انتخاب صفحه...");

        const newScreenStream =
            await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: false
            });

        const screenTrack = newScreenStream.getVideoTracks()[0];

        if (!screenTrack) {
            newScreenStream.getTracks().forEach(t => t.stop());
            throw new Error("ترک تصویر صفحه پیدا نشد.");
        }

        screenStream = newScreenStream;
        screenOn = true;

        localVideo.srcObject = screenStream;
        localPlaceholder.style.display = "none";

        for (const pc of peers.values()) {
            await setPeerVideoTrack(pc, screenTrack, screenStream);
        }

        screenButton.classList.add("active");
        screenButton.querySelector("small").textContent = "توقف اشتراک";

        updateCamera();
        showNotice("اشتراک‌گذاری صفحه شروع شد.");

        screenTrack.onended = () => {
            stopScreen();
        };

    } catch (error) {
        console.error("Screen sharing error:", error);

        if (screenStream) {
            screenStream.getTracks().forEach(track => {
                track.onended = null;
                track.stop();
            });
        }

        screenStream = null;
        screenOn = false;

        screenButton.classList.remove("active");
        screenButton.querySelector("small").textContent = "اشتراک صفحه";

        if (error.name === "NotAllowedError") {
            showNotice("اشتراک‌گذاری لغو شد یا اجازه دسترسی داده نشد.");
        } else if (error.name === "NotFoundError") {
            showNotice("هیچ صفحه یا پنجره‌ای برای اشتراک‌گذاری پیدا نشد.");
        } else if (error.name === "NotReadableError") {
            showNotice("مرورگر نتوانست صفحه را بخواند.");
        } else if (error.name === "InvalidStateError") {
            showNotice("برای اشتراک‌گذاری باید صفحه جلسه فعال و در پیش‌زمینه باشد.");
        } else {
            showNotice(
                "خطای اشتراک‌گذاری: " +
                (error.name || "Error") +
                " - " +
                (error.message || "خطای نامشخص")
            );
        }
    }
}

async function stopScreen() {
    if (!screenOn && !screenStream) return;

    const oldStream = screenStream;

    screenOn = false;
    screenStream = null;

    if (oldStream) {
        oldStream.getTracks().forEach(track => {
            track.onended = null;
            track.stop();
        });
    }

    for (const pc of peers.values()) {
        try {
            await setPeerVideoTrack(
                pc,
                cameraTrack,
                localStream
            );
        } catch (error) {
            console.error("Restore camera error:", error);
        }
    }

    localVideo.srcObject = localStream;

    screenButton.classList.remove("active");
    screenButton.querySelector("small").textContent = "اشتراک صفحه";

    updateCamera();

    showNotice("اشتراک‌گذاری صفحه متوقف شد.");
}

function addChatMessage(text, name, mine) {
    const item = document.createElement("div");
    item.className = "chat-message" + (mine ? " me" : "");

    const author = document.createElement("strong");
    author.textContent = name;

    const content = document.createElement("span");
    content.textContent = text;

    item.append(author, content);

    const messages = document.getElementById("chatMessages");
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("chatForm").addEventListener("submit", async event => {
    event.preventDefault();

    const input = document.getElementById("chatInput");
    const message = input.value.trim();

    if (!message) return;

    if (!joined) {
        showNotice("هنوز به جلسه وصل نشده‌ای.");
        return;
    }

    addChatMessage(message, "شما", true);

    await sendSignal("chat", {
        text: message.slice(0, 500)
    });

    input.value = "";
});

async function copyInvite() {
    try {
        await navigator.clipboard.writeText(location.href);
        showNotice("لینک دعوت کپی شد.");
    } catch (error) {
        showNotice("لینک را از نوار آدرس مرورگر کپی کن.");
    }
}

async function leaveMeeting() {
    joined = false;

    if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
    }

    if (channel) {
        try {
            await channel.untrack();
            await window.supabaseClient.removeChannel(channel);
        } catch (error) {
            console.error(error);
        }

        channel = null;
    }

    peers.forEach(pc => pc.close());
    peers.clear();
    pendingIce.clear();

    if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
    }

    location.href = "meet.html";
}

document.getElementById("roomLabel").textContent =
    room ? "شناسه جلسه: " + room : "شناسه جلسه نامشخص";

connectRoom();
</script>
