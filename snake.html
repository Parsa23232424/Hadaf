<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مار 🐍</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
}

h1 {
    margin: 15px;
}

canvas {
    background: #222;
    border: 3px solid #00ff88;
    max-width: 90vw;
}

button {
    padding: 12px 25px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🐍 بازی مار</h1>
<p>امتیاز: <span id="score">0</span></p>

<canvas id="game" width="400" height="400"></canvas>

<br>
<button onclick="restart()">شروع دوباره 🔄</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;

function restart() {
    snake = [
        {x: 200, y: 200},
        {x: 180, y: 200},
        {x: 160, y: 200}
    ];

    dx = size;
    dy = 0;

    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = score;

    createFood();
}

function createFood() {
    food = {
        x: Math.floor(Math.random() * 20) * size,
        y: Math.floor(Math.random() * 20) * size
    };
}

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowUp" && dy === 0) {
        dx = 0;
        dy = -size;
    }

    if (e.key === "ArrowDown" && dy === 0) {
        dx = 0;
        dy = size;
    }

    if (e.key === "ArrowLeft" && dx === 0) {
        dx = -size;
        dy = 0;
    }

    if (e.key === "ArrowRight" && dx === 0) {
        dx = size;
        dy = 0;
    }
});

function draw() {

    if (gameOver) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // برخورد با دیوار
    if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
    ) {
        endGame();
        return;
    }

    // برخورد با خودش
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    // خوردن غذا
    if (head.x === food.x && head.y === food.y) {

        score++;

        document.getElementById("score").textContent = score;

        createFood();

    } else {
        snake.pop();
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // غذا
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, size, size);

    // مار
    ctx.fillStyle = "#00ff88";

    for (let part of snake) {
        ctx.fillRect(part.x, part.y, size - 2, size - 2);
    }
}

function endGame() {
    gameOver = true;

    setTimeout(() => {
        alert("💥 باختی!\nامتیاز: " + score);
    }, 50);
}

restart();

setInterval(draw, 120);
</script>

</body>
</html>
