<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چالش هوش هدف 🤖 | پیکو</title>

<meta name="description"
content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند.">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Tahoma,Arial,sans-serif;
    color:white;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(99,102,241,.35),
        transparent 30%
    ),
    radial-gradient(
        circle at 90% 20%,
        rgba(168,85,247,.25),
        transparent 30%
    ),
    radial-gradient(
        circle at 50% 100%,
        rgba(16,185,129,.20),
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #050816,
        #0f172a,
        #111827
    );

    background-attachment:fixed;
}

.container{
    width:min(720px,94%);
    margin:40px auto;
    padding-bottom:40px;
}

.card{
    position:relative;

    padding:30px;

    border-radius:32px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.035)
    );

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
    0 30px 80px rgba(0,0,0,.45),
    0 10px 30px rgba(99,102,241,.12),
    inset 0 1px 0 rgba(255,255,255,.15);

    overflow:hidden;

    animation:cardIn .7s ease;
}

.card::before{
    content:"";

    position:absolute;

    top:-120px;
    left:50%;

    width:350px;
    height:250px;

    transform:translateX(-50%);

    background:rgba(99,102,241,.22);

    filter:blur(80px);

    pointer-events:none;
}

.pico-box{
    position:relative;

    text-align:center;

    margin-bottom:15px;
}

.pico-image{
    width:190px;
    max-width:65%;

    display:block;

    margin:0 auto 15px;

    filter:
    drop-shadow(
        0 15px 25px rgba(99,102,241,.35)
    );

    animation:floatPico 3s ease-in-out infinite;
}

.robot-fallback{
    font-size:90px;

    animation:floatPico 3s ease-in-out infinite;
}

h1{
    position:relative;

    text-align:center;

    margin:10px 0 25px;

    font-size:30px;

    background:
    linear-gradient(
        90deg,
        #a5b4fc,
        #c084fc,
        #67e8f9
    );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.message{
    padding:20px;

    margin-bottom:20px;

    line-height:2;

    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(99,102,241,.18),
        rgba(139,92,246,.08)
    );

    border:1px solid rgba(129,140,248,.25);

    box-shadow:
    0 12px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.08);

    white-space:pre-wrap;
}

.score{
    padding:15px;

    margin-bottom:20px;

    text-align:center;

    border-radius:18px;

    color:#fde68a;

    background:
    linear-gradient(
        135deg,
        rgba(250,204,21,.16),
        rgba(245,158,11,.06)
    );

    border:1px solid rgba(250,204,21,.25);

    box-shadow:
    0 10px 30px rgba(250,204,21,.08),
    inset 0 1px 0 rgba(255,255,255,.08);

    font-size:19px;
    font-weight:bold;
}

.challenge{
    position:relative;

    min-height:130px;

    padding:23px;

    line-height:2;

    font-size:18px;

    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(249,115,22,.16),
        rgba(234,88,12,.06)
    );

    border:1px solid rgba(251,146,60,.3);

    box-shadow:
    0 15px 40px rgba(249,115,22,.08),
    inset 0 1px 0 rgba(255,255,255,.08);

    white-space:pre-wrap;

    transition:.3s;
}

.challenge:hover{
    transform:translateY(-2px);

    box-shadow:
    0 20px 45px rgba(249,115,22,.14),
    inset 0 1px 0 rgba(255,255,255,.1);
}

textarea{
    width:100%;

    min-height:120px;

    margin-top:18px;

    padding:17px;

    resize:vertical;

    outline:none;

    color:white;

    font-family:Tahoma,Arial,sans-serif;

    font-size:16px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.06);

    box-shadow:
    inset 0 2px 10px rgba(0,0,0,.18),
    0 8px 25px rgba(0,0,0,.12);

    transition:.3s;
}

textarea:focus{
    border-color:rgba(129,140,248,.7);

    background:rgba(255,255,255,.09);

    box-shadow:
    0 0 0 4px rgba(99,102,241,.12),
    0 15px 35px rgba(0,0,0,.2),
    inset 0 2px 10px rgba(0,0,0,.15);
}

textarea::placeholder{
    color:#94a3b8;
}

button{
    position:relative;

    width:100%;

    padding:16px;

    margin-top:13px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:18px;

    color:white;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    overflow:hidden;

    transition:
    transform .2s,
    box-shadow .2s,
    filter .2s;

    box-shadow:
    0 10px 25px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.15);
}

button:hover{
    transform:translateY(-3px);

    filter:brightness(1.12);

    box-shadow:
    0 16px 35px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.2);
}

button:active{
    transform:scale(.97);
}

button:disabled{
    opacity:.45;

    cursor:not-allowed;

    transform:none;
}

#checkButton{
    background:
    linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );

    box-shadow:
    0 10px 30px rgba(99,102,241,.3);
}

.new-button{
    background:
    linear-gradient(
        135deg,
        #10b981,
        #059669
    );

    box-shadow:
    0 10px 30px rgba(16,185,129,.25);
}

.hint-button{
    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #ea580c
    );

    box-shadow:
    0 10px 30px rgba(245,158,11,.22);
}

.back{
    background:rgba(255,255,255,.07);

    box-shadow:
    0 8px 25px rgba(0,0,0,.18);
}

.loading{
    display:none;

    padding:20px;

    margin-top:18px;

    text-align:center;

    border-radius:20px;

    background:rgba(99,102,241,.1);

    border:1px solid rgba(129,140,248,.2);

    box-shadow:
    0 10px 30px rgba(99,102,241,.08);
}

.result,
.hint,
.error{
    display:none;

    margin-top:18px;

    padding:18px;

    border-radius:20px;

    line-height:2;

    white-space:pre-wrap;

    box-shadow:
    0 12px 30px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.result{
    background:rgba(16,185,129,.12);

    border:1px solid rgba(52,211,153,.3);
}

.hint{
    background:rgba(245,158,11,.12);

    border:1px solid rgba(251,191,36,.3);
}

.error{
    background:rgba(239,68,68,.12);

    border:1px solid rgba(248,113,113,.3);

    color:#fecaca;
}

.footer{
    text-align:center;

    margin-top:25px;

    color:#64748b;

    font-size:13px;
}

@keyframes floatPico{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

@media(max-width:500px){

    .container{
        width:94%;
        margin:20px auto;
    }

    .card{
        padding:18px;
        border-radius:25px;
    }

    h1{
        font-size:24px;
    }

    .p
