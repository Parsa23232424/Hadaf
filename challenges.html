<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>پیکو | چالش هوش هدف 🤖</title>

<meta name="description"
content="چالش هوش هدف با پیکو">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:white;

    background:

    radial-gradient(
        circle at 10% 10%,
        rgba(99,102,241,.35),
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 20%,
        rgba(168,85,247,.25),
        transparent 30%
    ),

    radial-gradient(
        circle at 50% 100%,
        rgba(16,185,129,.20),
        transparent 35%
    ),

    linear-gradient(
        135deg,
        #050816,
        #0f172a,
        #111827
    );

    background-attachment:fixed;

}

.container{

    width:min(720px,94%);

    margin:30px auto;

    padding-bottom:40px;

}

.card{

    position:relative;

    padding:30px;

    border-radius:32px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.035)
    );

    border:
    1px solid
    rgba(255,255,255,.16);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    box-shadow:

    0 30px 80px
    rgba(0,0,0,.45),

    0 10px 30px
    rgba(99,102,241,.12),

    inset 0 1px 0
    rgba(255,255,255,.15);

}

.pico-box{

    text-align:center;

    margin-bottom:10px;

}

.pico-image{

    width:190px;

    max-width:65%;

    display:block;

    margin:auto;

    filter:
    drop-shadow(
        0 15px 25px
        rgba(99,102,241,.35)
    );

    animation:
    floatPico 3s ease-in-out infinite;

}

.robot-fallback{

    font-size:90px;

    animation:
    floatPico 3s ease-in-out infinite;

}

h1{

    text-align:center;

    font-size:30px;

    margin:
    10px 0 25px;

    background:
    linear-gradient(
        90deg,
        #a5b4fc,
        #c084fc,
        #67e8f9
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.message{

    padding:20px;

    margin-bottom:20px;

    line-height:2;

    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(99,102,241,.18),
        rgba(139,92,246,.08)
    );

    border:
    1px solid
    rgba(129,140,248,.25);

    white-space:pre-wrap;

}

.score{

    padding:15px;

    margin-bottom:20px;

    text-align:center;

    border-radius:18px;

    color:#fde68a;

    background:
    rgba(250,204,21,.12);

    border:
    1px solid
    rgba(250,204,21,.25);

    font-size:19px;

    font-weight:bold;

}

.challenge{

    min-height:130px;

    padding:23px;

    line-height:2;

    font-size:18px;

    border-radius:22px;

    background:
    rgba(249,115,22,.12);

    border:
    1px solid
    rgba(251,146,60,.3);

    white-space:pre-wrap;

}

textarea{

    width:100%;

    min-height:120px;

    margin-top:18px;

    padding:17px;

    resize:vertical;

    outline:none;

    color:white;

    font-family:inherit;

    font-size:16px;

    border-radius:20px;

    border:
    1px solid
    rgba(255,255,255,.12);

    background:
    rgba(255,255,255,.06);

}

textarea:focus{

    border-color:
    rgba(129,140,248,.7);

    box-shadow:
    0 0 0 4px
    rgba(99,102,241,.12);

}

textarea::placeholder{

    color:#94a3b8;

}

button{

    width:100%;

    padding:16px;

    margin-top:13px;

    border:
    1px solid
    rgba(255,255,255,.12);

    border-radius:18px;

    color:white;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}

button:hover{

    transform:translateY(-2px);

    filter:brightness(1.1);

}

button:active{

    transform:scale(.97);

}

button:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;

}

#checkButton{

    background:
    linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );

}

.new-button{

    background:
    linear-gradient(
        135deg,
        #10b981,
        #059669
    );

}

.hint-button{

    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #ea580c
    );
