<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>چالش هوش هدف 🤖 | پیکو</title>

<meta name="description"
      content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند.">


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    background:

    radial-gradient(
        circle at 10% 10%,
        rgba(99,102,241,.35),
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 90%,
        rgba(16,185,129,.25),
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #09091a,
        #15152d,
        #24243e
    );

    color:white;

    min-height:100vh;
}


.container{

    width:min(700px,94%);

    margin:25px auto;

    padding-bottom:40px;
}


.card{

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.12);

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);

    backdrop-filter:blur(15px);
}


.pico-box{

    text-align:center;

    margin-bottom:10px;
}


.pico-image{

    width:180px;

    max-width:60%;

    height:auto;

    display:block;

    margin:0 auto 10px;
}


.robot-fallback{

    font-size:85px;

    display:none;
}


h1{

    text-align:center;

    margin:10px 0 20px;

    font-size:28px;
}


.message{

    background:
    rgba(99,102,241,.18);

    border-radius:20px;

    padding:18px;

    line-height:2;

    margin-bottom:20px;

    font-size:16px;

    white-space:pre-wrap;
}


.score{

    text-align:center;

    background:
    rgba(250,204,21,.14);

    border:
    1px solid rgba(250,204,21,.2);

    border-radius:15px;

    padding:12px;

    font-size:19px;

    font-weight:bold;

    margin-bottom:18px;

    color:#fde68a;
}


.challenge{

    background:
    rgba(249,115,22,.12);

    border:
    2px solid rgba(251,146,60,.35);

    border-radius:20px;

    padding:20px;

    min-height:120px;

    line-height:2;

    font-size:18px;

    white-space:pre-wrap;
}


textarea{

    width:100%;

    min-height:110px;

    margin-top:15px;

    padding:15px;

    border:
    2px solid rgba(255,255,255,.15);

    border-radius:16px;

    font-family:inherit;

    font-size:16px;

    resize:vertical;

    outline:none;

    background:
    rgba(255,255,255,.08);

    color:white;
}


textarea::placeholder{

    color:#cbd5e1;
}


textarea:focus{

    border-color:#818cf8;
}


button{

    width:100%;

    border:0;

    border-radius:16px;

    padding:15px;

    margin-top:12px;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    color:white;

    background:#6366f1;

    transition:.2s;
}


button:hover{

    filter:brightness(1.1);

    transform:translateY(-1px);
}


button:active{

    transform:scale(.98);
}


button:disabled{

    opacity:.5;

    cursor:not-allowed;

    transform:none;
}


.new-button{

    background:#10b981;
}


.hint-button{

    background:#f59e0b;
}


.back{

    background:
    rgba(255,255,255,.1);

    border:
    1px solid rgba(255,255,255,.12);
}


.loading{

    display:none;

    text-align:center;

    padding:18px;

    font-size:17px;
}


.result,
.hint,
.error{

    display:none;

    margin-top:15px;

    border-radius:16px;

    padding:16px;

    line-height:2;

    white-space:pre-wrap;
}


.result{

    background:
    rgba(16,185,129,.12);

    border:
    2px solid rgba(52,211,153,.35);
}


.hint{

    background:
    rgba(245,158,11,.12);

    border:
    2px solid rgba(251,191,36,.35);
}


.error{

    background:
    rgba(239,68,68,.12);

    border:
    2px solid rgba(248,113,113,.35);

    color:#fecaca;
}


.footer{

    text-align:center;

    margin-top:20px;

    color:#94a3b8;

    font-size:13px;
}


@media(max-width:500px){

    .card{

        padding:18px;
    }

    h1{

        font-size:24px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="card">


<!-- =========================
     🤖 پیکو
========================= -->

<div class="pico-box">

<img
    id="picoImage"
    class="pico-image"
    src="pico.png"
    alt="پیکو - شخصیت هوش مصنوعی هدف"
    onerror="showRobotFallback()"
>

<div
    id="robotFallback"
    class="robot-fallback">

🤖

</div>

</div>


<h1>

🧠 چالش هوش هدف

</h1>


<!-- =========================
     ⭐ امتیاز
========================= -->

<div
    id="score"
    class="score">

⭐ امتیاز: 0

</div>


<!-- =========================
     🤖 پیام پیکو
========================= -->

<div
    id="picoMessage"
    class="message">

🤖 پیکو:

سلام
