<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>چالش هوش هدف 🤖 | پیکو</title>

  <meta name="description"
    content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند با کمک هوش مصنوعی.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      color: #172033;
    }

    .container {
      width: min(700px, 94%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, .12);
    }

    .pico-box {
      text-align: center;
      margin-bottom: 10px;
    }

    .pico-image {
      width: 180px;
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    .robot-fallback {
      font-size: 85px;
      display: none;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .message {
      background: #eef2ff;
      border-radius: 20px;
      padding: 18px;
      line-height: 2;
      margin-bottom: 20px;
      font-size: 16px;
      white-space: pre-wrap;
    }

    .score {
      text-align: center;
      background: #fef3c7;
      border-radius: 15px;
      padding: 12px;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .challenge {
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 20px;
      padding: 20px;
      min-height: 120px;
      line-height: 2;
      font-size: 18px;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      margin-top: 15px;
      padding: 15px;
      border: 2px solid #dbe2ea;
      border-radius: 16px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #6366f1;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .new-button {
      background: #10b981;
    }

    .hint-button {
      background: #f59e0b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px;
      font-size: 17px;
    }

    .result,
    .hint,
    .error {
      display: none;
      margin-top: 15px;
      border-radius: 16px;
      padding: 16px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .result {
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
    }

    .hint {
      background: #fffbeb;
      border: 2px solid #fde68a;
    }

    .error {
      background: #fef2f2;
      border: 2px solid #fecaca;
      color: #991b1b;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="pico-box">

        <img
          id="picoImage"
          class="pico-image"
          src="pico.png"
          alt="پیکو - شخصیت هوش مصنوعی هدف"
          onerror="showRobotFallback()">

        <div id="robotFallback" class="robot-fallback">
          🤖
        </div>

      </div>

      <h1>🧠 چالش هوش هدف</h1>

      <div id="score" class="score">
        ⭐ امتیاز: 0
      </div>

      <div id="picoMessage" class="message">
        🤖 پیکو:
        سلام! من پیکو هستم!
        آماده‌ای یک چالش باحال حل کنی؟ 😎
      </div>

      <div id="challenge" class="challenge">
        برای شروع روی
        «🧩 چالش جدید»
        بزن!
      </div>

      <textarea
        id="answer"
        placeholder="✍️ جوابت رو اینجا بنویس..."></textarea>

      <button
        id="checkButton"
        onclick="checkAnswer()"
        disabled>
        ✅ بررسی جواب
      </button>

      <button
        id="newButton"
        class="new-button"
        onclick="newChallenge()">
        🧩 چالش جدید
      </button>

      <button
        id="hintButton"
        class="hint-button"
        onclick="getHint()">
        💡 راهنمایی
      </button>

      <div id="loading" class="loading">
        🤖 پیکو داره فکر می‌کنه...
        <br>
        ⏳ یک لحظه صبر کن
      </div>

      <div id="result" class="result"></div>

      <div id="hint" class="hint"></div>

      <div id="error" class="error"></div>

      <div class="footer">
        🏹 چالش هوش هدف
      </div>

    </div>
  </div>

<script>

/* =====================================================
   🤖 تنظیمات پیکو
===================================================== */

const API_KEY = "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";

const MODEL = "openrouter/free";

const API_URL =
  "https://openrouter.ai/api/v1/chat/completions";


/* =====================================================
   🎯 وضعیت بازی
===================================================== */

let currentChallenge = "";
let score = 0;


/* =====================================================
   🔧 عناصر
===================================================== */

const challengeBox =
  document.getElementById("challenge");

const answerBox =
  document.getElementById("answer");

const checkButton =
  document.getElementById("checkButton");

const newButton =
  document.getElementById("newButton");

const hintButton =
  document.getElementById("hintButton");

const loadingBox =
  document.getElementById("loading");

const resultBox =
  document.getElementById("result");

const hintBox =
  document.getElementById("hint");

const errorBox =
  document.getElementById("error");

const picoMessage =
  document.getElementById("picoMessage");

const scoreBox =
  document.getElementById("score");


/* =====================================================
   🤖 درخواست به OpenRouter
===================================================== */

async function askAI(prompt) {

  if (
    !API_KEY ||
    API_KEY === "YOUR_OPENROUTER_KEY"
  ) {

    throw new Error(
      "کلید OpenRouter تنظیم نشده است."
    );

  }


  const response =
    await fetch(API_URL, {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json",

        "Authorization":
          "Bearer " + API_KEY,

        "HTTP-Referer":
          window.location.origin,

        "X-Title":
          "Hadaf AI Challenge"

      },

      body: JSON.stringify({

        model: MODEL,

        messages: [

          {
            role: "system",

            content: `
تو «پیکو» هستی؛
شخصیت هوش مصنوعی سایت هدف.

همیشه فارسی، دوستانه و بانمک صحبت کن.

چالش‌ها باید:
- مناسب کودکان و نوجوانان باشند
- امن باشند
- جواب مشخص داشته باشند
- کوتاه و قابل فهم باشند

اگر کاربر جواب نداده است،
جواب نهایی چالش را لو نده.
`
          },

          {
            role: "user",
            content: prompt
          }

        ],

        temperature: 0.8,

        max_tokens: 500

      })

    });


  let data;

  try {

    data = await response.json();

  } catch {

    throw new Error(
      "پاسخ OpenRouter قابل خواندن نبود."
    );

  }


  if (!response.ok) {

    console.error(
      "OpenRouter:",
      data
    );

    throw new Error(
      data?.error?.message ||
      "خطای OpenRouter: " +
      response.status
    );

  }


  const text =
    data?.choices?.[0]?.message?.content;


  if (
    !text ||
    typeof text !== "string"
  ) {

    throw new Error(
      "OpenRouter پاسخی برنگرداند."
    );

  }


  return text.trim();

}


/* =====================================================
   🧩 چالش جدید
===================================================== */

async function newChallenge() {

  hideMessages();

  setLoading(true);

  answerBox.value = "";

  checkButton.disabled = true;

  newButton.disabled = true;

  hintButton.disabled = true;


  challengeBox.innerText =
    "🤖 پیکو داره یک چالش جدید می‌سازه...";


  picoMessage.innerText =
    "🤖 پیکو: صبر کن ببینم چه چالشی برات بسازم! 😎";


  try {

    const result =
      await askAI(`

یک چالش هوش جدید بساز.

یکی از این نوع‌ها را انتخاب کن:

ریاضی،
منطقی،
کلمه‌ای،
معمایی،
دقت و تمرکز.

قوانین:

- کوتاه باشد.
- جذاب باشد.
- مناسب کودک و نوجوان باشد.
- جواب مشخص داشته باشد.
- جواب را نگو.
- فقط متن خود چالش را بنویس.

`);


    currentChallenge = result;

    challengeBox.innerText =
      currentChallenge;

    picoMessage.innerText =
      "🤖 پیکو: اینم چالش جدیدت! خوب فکر کن... 🧠";

    checkButton.disabled = false;

  }

  catch (error) {

    showError(error);

    challengeBox.innerText =
      "❌ ساخت چالش انجام نشد.";

  }

  finally {

    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

  }

}


/* =====================================================
   ✅ بررسی جواب
===================================================== */

async function checkAnswer() {

  const answer =
    answerBox.value.trim();


  if (!answer) {

    showError(
      "اول جوابت رو بنویس! 😄"
    );

    return;

  }


  if (!currentChallenge) {

    showError(
      "اول یک چالش جدید بساز!"
    );

    return;

  }


  hideMessages();

  setLoading(true);

  checkButton.disabled = true;

  newButton.disabled = true;

  hintButton.disabled = true;


  try {

    const result =
      await askAI(`

چالش:

${currentChallenge}


جواب کاربر:

${answer}


جواب کاربر را بررسی کن.

اگر کاملاً درست بود:

اول بنویس:
آفرین! جواب درست بود 🎉

بعد یک توضیح کوتاه بده.

اگر غلط بود:

بگو:
جوابت درست نیست.

اما جواب صحیح را نگو.
یک راهنمایی کوچک بده.

اگر تقریباً درست بود:

بگو که به جواب نزدیک است
و یک راهنمایی بده.

پاسخ فارسی و دوستانه باشد.

`);


    showResult(
      "🤖 پیکو:\n" + result
    );


    const normalized =
      result
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .toLowerCase();


    const correct =
      normalized.includes("جواب درست بود") ||
      normalized.includes("پاسخ درست بود") ||
      normalized.includes("کاملاً درست");


    if (correct) {

      score += 10;

      updateScore();

    }

  }

  catch (error) {

    showError(error);

  }

  finally {

    setLoading(false);

    checkButton.disabled =
      !currentChallenge;

    newButton.disabled = false;

    hintButton.disabled = false;

  }

}


/* =====================================================
   💡 راهنمایی
===================================================== */

async function getHint() {

  if (!currentChallenge) {

    showError(
      "اول یک چالش بساز! 😄"
    );

    return;

  }


  hideMessages();

  setLoading(true);

  hintButton.disabled = true;

  newButton.disabled = true;

  checkButton.disabled = true;


  try {

    const result =
      await askAI(`

برای این چالش یک راهنمایی بده:

${currentChallenge}

قوانین:

- جواب نهایی را نگو.
- راهنمایی کوتاه باشد.
- واقعاً به حل چالش کمک کند.
- فارسی و دوستانه باشد.

`);


    hintBox.style.display =
      "block";

    hintBox.innerText =
      "💡 راهنمای پیکو:\n" +
      result;

  }

  catch (error) {

    showError(error);

  }

  finally {

    setLoading(false);

    hintButton.disabled = false;

    newButton.disabled = false;

    checkButton.disabled =
      !currentChallenge;

  }

}


/* =====================================================
   ⭐ امتیاز
===================================================== */

function updateScore() {

  scoreBox.innerText =
    "⭐ امتیاز: " + score;

}


/* =====================================================
   ⏳ Loading
===================================================== */

function setLoading(value) {

  loadingBox.style.display =
    value ? "block" : "none";

}


/* =====================================================
   ❌ خطا
===================================================== */

function showError(error) {

  errorBox.style.display =
    "block";

  errorBox.innerText =
    "❌ " +
    (
      error?.message ||
      error ||
      "خطای ناشناخته"
    );

  console.error(
    "Pico Error:",
    error
  );

}


/* =====================================================
   🎉 نتیجه
===================================================== */

function showResult(text) {

  resultBox.style.display =
    "block";

  resultBox.innerText =
    text;

}


/* =====================================================
   🧹 مخفی کردن پیام‌ها
===================================================== */

function hideMessages() {

  resultBox.style.display =
    "none";

  hintBox.style.display =
    "none";

  errorBox.style.display =
    "none";

}


/* =====================================================
   🤖 عکس پیکو
===================================================== */

function showRobotFallback() {

  const image =
    document.getElementById("picoImage");

  const fallback =
    document.getElementById("robotFallback");


  image.style.display =
    "none";

  fallback.style.display =
    "block";

}


/* =====================================================
   🚀 شروع
===================================================== */

updateScore();

console.log(
  "🤖 پیکو آماده است!"
);

</script>

</body>
</html>
