<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>چالش هوش هدف 🤖 | پیکو</title>

  <meta name="description"
        content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند با کمک هوش مصنوعی.">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      color: #172033;
    }

    .container {
      width: min(700px, 94%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
    }

    /* شخصیت پیکو */

    .pico-box {
      text-align: center;
      margin-bottom: 10px;
    }

    .pico-image {
      width: 180px;
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    .robot-fallback {
      font-size: 85px;
      display: none;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .message {
      background: #eef2ff;
      border-radius: 20px;
      padding: 18px;
      line-height: 2;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .score {
      text-align: center;
      background: #fef3c7;
      border-radius: 15px;
      padding: 12px;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .challenge {
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 20px;
      padding: 20px;
      min-height: 120px;
      line-height: 2;
      font-size: 18px;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      margin-top: 15px;
      padding: 15px;
      border: 2px solid #dbe2ea;
      border-radius: 16px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #6366f1;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .new-button {
      background: #10b981;
    }

    .hint-button {
      background: #f59e0b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px;
      font-size: 17px;
    }

    .result,
    .hint,
    .error {
      display: none;
      margin-top: 15px;
      border-radius: 16px;
      padding: 16px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .result {
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
    }

    .hint {
      background: #fffbeb;
      border: 2px solid #fde68a;
    }

    .error {
      background: #fef2f2;
      border: 2px solid #fecaca;
      color: #991b1b;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <!-- شخصیت پیکو -->

      <div class="pico-box">

        <!--
          فایل شخصیت را با نام pico.png
          در کنار index.html داخل GitHub قرار بده.
        -->

        <img
          id="picoImage"
          class="pico-image"
          src="pico.png"
          alt="پیکو - شخصیت هوش مصنوعی هدف"
          onerror="showRobotFallback()"
        >

        <div id="robotFallback"
             class="robot-fallback">
          🤖
        </div>

      </div>


      <h1>
        🧠 چالش هوش هدف
      </h1>


      <!-- پیام پیکو -->

      <div id="picoMessage"
           class="message">

        🤖 پیکو:
        سلام! من پیکو هستم!
        آماده‌ای یک چالش باحال حل کنی؟ 😎

      </div>


      <!-- امتیاز -->

      <div class="score">

        ⭐ امتیاز:
        <span id="score">
          0
        </span>

      </div>


      <!-- چالش -->

      <div id="challenge"
           class="challenge">

        برای شروع روی
        «🧩 چالش جدید»
        بزن!

      </div>


      <!-- جواب -->

      <textarea
        id="answer"
        placeholder="✍️ جوابت رو اینجا بنویس..."
      ></textarea>


      <!-- بررسی -->

      <button
        id="checkButton"
        onclick="checkAnswer()"
        disabled>

        ✅ بررسی جواب

      </button>


      <!-- چالش جدید -->

      <button
        class="new-button"
        onclick="newChallenge()">

        🧩 چالش جدید

      </button>


      <!-- راهنمایی -->

      <button
        class="hint-button"
        onclick="getHint()">

        💡 راهنمایی

      </button>


      <!-- Loading -->

      <div id="loading"
           class="loading">

        🤖 پیکو داره فکر می‌کنه...
        <br>
        ⏳ یک لحظه صبر کن

      </div>


      <!-- نتیجه -->

      <div id="result"
           class="result">
      </div>


      <!-- راهنمایی -->

      <div id="hint"
           class="hint">
      </div>


      <!-- خطا -->

      <div id="error"
           class="error">
      </div>


      <div class="footer">

        🏹 چالش هوش هدف

      </div>

    </div>

  </div>


<script>


/* =====================================================
   🔐 API KEY
   =====================================================

   کلید DeepSeek خودت را اینجا قرار بده.

   مثال:

   const API_KEY = "sk-47da8bcabeb749ba87d1bbeb5f7320cd";

   ⚠️ این روش برای تست است.
   برای سایت عمومی امن نیست.
===================================================== */


const API_KEY = "sk-47da8bcabeb749ba87d1bbeb5f7320cd";


/* آدرس API */

const API_URL =
  "https://api.deepseek.com/chat/completions";


/* مدل فعلی DeepSeek */

const MODEL =
  "deepseek-v4-flash";


/* متغیرهای بازی */

let currentChallenge = "";

let score = 0;


/* =====================================================
   ارسال درخواست به DeepSeek
===================================================== */

async function askDeepSeek(prompt) {

  if (
    !API_KEY ||
    API_KEY === "sk-e467848910f04d90acccecb11ff58dbb"
  ) {

    throw new Error(
      "API Key را داخل کد وارد نکرده‌ای."
    );

  }


  const response = await fetch(
    API_URL,
    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json",

        "Authorization":
          "Bearer " + API_KEY

      },

      body: JSON.stringify({

        model: MODEL,

        thinking: {
          type: "disabled"
        },

        messages: [

          {
            role: "system",

            content:
              `
تو «پیکو» هستی؛
شخصیت کارتونی هوش مصنوعی سایت هدف.

وظیفه تو ساختن و بررسی چالش‌های هوش است.

قوانین:

1. همیشه فارسی صحبت کن.
2. دوستانه و بانمک باش.
3. چالش‌ها مناسب کودکان و نوجوانان باشند.
4. از محتوای خطرناک استفاده نکن.
5. چالش‌ها می‌توانند ریاضی، منطقی،
   کلمه‌ای، معمایی یا دقت و تمرکز باشند.
6. جواب را وقتی کاربر هنوز جواب نداده، لو نده.
7. پاسخ‌ها خیلی طولانی نباشند.
              `
          },

          {
            role: "user",

            content: prompt
          }

        ],

        stream: false,

        max_tokens: 500

      })

    }
  );


  /* دریافت پاسخ */

  let data;

  try {

    data = await response.json();

  }

  catch {

    throw new Error(
      "پاسخ DeepSeek قابل خواندن نبود."
    );

  }


  /* بررسی خطا */

  if (!response.ok) {

    console.error(
      "DeepSeek API Error:",
      data
    );


    const message =
      data?.error?.message ||
      `خطای DeepSeek: ${response.status}`;


    throw new Error(message);

  }


  /* بررسی وجود جواب */

  if (
    !data.choices ||
    !data.choices[0] ||
    !data.choices[0].message
  ) {

    throw new Error(
      "DeepSeek پاسخ معتبری برنگرداند."
    );

  }


  return data.choices[0].message.content;

}


/* =====================================================
   🧩 ساخت چالش جدید
===================================================== */

async function newChallenge() {

  hideMessages();

  setLoading(true);


  document.getElementById(
    "answer"
  ).value = "";


  document.getElementById(
    "checkButton"
  ).disabled = true;


  try {

    const result =
      await askDeepSeek(

        `
یک چالش هوش جدید بساز.

نوع چالش را خودت انتخاب کن:
ریاضی، منطقی، کلمه‌ای،
معمایی یا دقت.

چالش:
- کوتاه باشد.
- جذاب باشد.
- جواب مشخص داشته باشد.
- جواب را در این پیام نگو.

فقط متن چالش را بنویس.
        `

      );


    currentChallenge = result;


    document.getElementById(
      "challenge"
    ).innerText = result;


    document.getElementById(
      "picoMessage"
    ).innerText =

      "🤖 پیکو: " +
      "اینم چالش جدیدت! خوب فکر کن... 🧠";


    document.getElementById(
      "checkButton"
    ).disabled = false;


  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   ✅ بررسی جواب
===================================================== */

async function checkAnswer() {

  const answer =
    document.getElementById(
      "answer"
    ).value.trim();


  if (!answer) {

    showError(
      "اول جوابت رو بنویس! 😄"
    );

    return;

  }


  if (!currentChallenge) {

    showError(
      "اول یک چالش جدید بساز!"
    );

    return;

  }


  hideMessages();

  setLoading(true);


  try {

    const result =
      await askDeepSeek(

        `
این چالش را بررسی کن:

--------------------

${currentChallenge}

--------------------

جواب کاربر:

${answer}

--------------------

اگر جواب درست است:

- بگو «آفرین! جواب درست بود 🎉»
- یک توضیح کوتاه بده.
- بگو 10 امتیاز گرفته است.

اگر جواب غلط است:

- بگو جواب درست نیست.
- جواب صحیح را فعلاً نگو.
- یک راهنمایی کوچک بده.

اگر جواب تقریباً درست است،
کاربر را راهنمایی کن.

پاسخ فارسی و دوستانه باشد.
        `

      );


    showResult(
      "🤖 پیکو:\n" + result
    );


    /* تشخیص تقریبی پاسخ درست */

    const lower =
      result.toLowerCase();


    if (

      lower.includes("جواب درست بود") ||

      lower.includes("آفرین") ||

      lower.includes("درست است") ||

      lower.includes("صحیح است")

    ) {

      score += 10;


      document.getElementById(
        "score"
      ).innerText = score;

    }


  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   💡 راهنمایی
===================================================== */

async function getHint() {

  if (!currentChallenge) {

    showError(
      "اول یک چالش بساز! 😄"
    );

    return;

  }


  hideMessages();

  setLoading(true);


  try {

    const result =
      await askDeepSeek(

        `
برای این چالش یک راهنمایی کوچک بده:

${currentChallenge}

قوانین:

- جواب نهایی را نگو.
- راهنمایی کوتاه باشد.
- راهنمایی واقعاً به حل چالش کمک کند.
- فارسی و دوستانه باشد.
        `

      );


    const hint =
      document.getElementById(
        "hint"
      );


    hint.style.display =
      "block";


    hint.innerText =
      "💡 راهنمای پیکو:\n" +
      result;

  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   ⏳ Loading
===================================================== */

function setLoading(value) {

  document.getElementById(
    "loading"
  ).style.display =
    value ? "block" : "none";

}


/* =====================================================
   ❌ نمایش خطا
===================================================== */

function showError(error) {

  const box =
    document.getElementById(
      "error"
    );


  box.style.display =
    "block";


  box.innerText =
    "❌ " +
    (error.message || error);


  console.error(
    error
  );

}


/* =====================================================
   🎉 نمایش نتیجه
===================================================== */

function showResult(text) {

  const box =
    document.getElementById(
      "result"
    );


  box.style.display =
    "block";


  box.innerText =
    text;

}


/* =====================================================
   مخفی کردن پیام‌ها
===================================================== */

function hideMessages() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "hint"
  ).style.display =
    "none";


  document.getElementById(
    "error"
  ).style.display =
    "none";

}


/* =====================================================
   🤖 اگر عکس پیکو پیدا نشد
===================================================== */

function showRobotFallback() {

  document.getElementById(
    "picoImage"
  ).style.display =
    "none";


  document.getElementById(
    "robotFallback"
  ).style.display =
    "block";

}


</script>

</body>
</html>
