body{

/* =================================
   🤖 API
================================= */

async function askAI(prompt){

    const response =
    await fetch(
        API_URL,
        {

            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
            JSON.stringify({
                prompt:prompt
            })

        }
    );


    const raw =
    await response.text();


    console.log(
        "API RAW:",
        raw
    );


    if(!response.ok){

        throw new Error(
            "خطای HTTP: " +
            response.status
        );

    }


    let data;


    try{

        data =
        JSON.parse(raw);

    }

    catch(e){

        /*
         اگر API مستقیماً متن بدهد
        */

        if(raw.trim()){

            return raw.trim();

        }

        throw new Error(
            "API پاسخ متنی یا JSON معتبر نداد."
        );

    }


    console.log(
        "API JSON:",
        data
    );


    /*
      API جدید:
      {
        success:true,
        text:"..."
      }
    */

    if(
        data.success === true &&
        typeof data.text === "string"
    ){

        return data.text.trim();

    }


    /*
      حالت‌های جایگزین
    */

    if(
        typeof data.text === "string"
    ){

        return data.text.trim();

    }


    if(
        typeof data.challenge === "string"
    ){

        return data.challenge.trim();

    }


    if(
        typeof data.response === "string"
    ){

        return data.response.trim();

    }


    if(
        typeof data.message === "string"
    ){

        return data.message.trim();

    }


    if(data.success === false){

        throw new Error(
            data.error ||
            "API خطا برگرداند."
        );

    }


    throw new Error(
        "پاسخ API قابل تشخیص نیست."
    );

}
