<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>چالش هوش هدف 🤖 | پیکو</title>

<meta name="description"
content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند.">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    color:white;

    background:
    radial-gradient(circle at 10% 10%,rgba(99,102,241,.35),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(168,85,247,.25),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(16,185,129,.20),transparent 35%),
    linear-gradient(135deg,#050816,#0f172a,#111827);

    background-attachment:fixed;
}

.container{
    width:min(720px,94%);
    margin:40px auto;
    padding-bottom:40px;
}

.card{
    position:relative;
    padding:30px;
    border-radius:32px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.035)
    );

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
    0 30px 80px rgba(0,0,0,.45),
    0 10px 30px rgba(99,102,241,.12),
    inset 0 1px 0 rgba(255,255,255,.15);

    overflow:hidden;

    animation:cardIn .7s ease;
}

.card::before{
    content:"";
    position:absolute;
    top:-120px;
    left:50%;
    width:350px;
    height:250px;
    transform:translateX(-50%);
    background:rgba(99,102,241,.22);
    filter:blur(80px);
    pointer-events:none;
}

.pico-box{
    position:relative;
    text-align:center;
    margin-bottom:15px;
}

.pico-image{
    width:190px;
    max-width:65%;
    display:block;
    margin:0 auto 15px;

    filter:drop-shadow(
        0 15px 25px rgba(99,102,241,.35)
    );

    animation:floatPico 3s ease-in-out infinite;
}

.robot-fallback{
    font-size:90px;
    animation:floatPico 3s ease-in-out infinite;
}

h1{
    position:relative;
    text-align:center;
    margin:10px 0 25px;
    font-size:30px;

    background:
    linear-gradient(
        90deg,
        #a5b4fc,
        #c084fc,
        #67e8f9
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.message{
    padding:20px;
    margin-bottom:20px;
    line-height:2;
    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(99,102,241,.18),
        rgba(139,92,246,.08)
    );

    border:1px solid rgba(129,140,248,.25);

    box-shadow:
    0 12px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.08);

    white-space:pre-wrap;
}

.score{
    padding:15px;
    margin-bottom:20px;
    text-align:center;
    border-radius:18px;
    color:#fde68a;

    background:
    linear-gradient(
        135deg,
        rgba(250,204,21,.16),
        rgba(245,158,11,.06)
    );

    border:1px solid rgba(250,204,21,.25);

    font-size:19px;
    font-weight:bold;
}

.challenge{
    position:relative;
    min-height:130px;
    padding:23px;
    line-height:2;
    font-size:18px;
    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        rgba(249,115,22,.16),
        rgba(234,88,12,.06)
    );

    border:1px solid rgba(251,146,60,.3);

    box-shadow:
    0 15px 40px rgba(249,115,22,.08),
    inset 0 1px 0 rgba(255,255,255,.08);

    white-space:pre-wrap;
    transition:.3s;
}

.challenge:hover{
    transform:translateY(-2px);
}

textarea{
    width:100%;
    min-height:120px;
    margin-top:18px;
    padding:17px;
    resize:vertical;
    outline:none;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
    font-size:16px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);

    box-shadow:
    inset 0 2px 10px rgba(0,0,0,.18),
    0 8px 25px rgba(0,0,0,.12);

    transition:.3s;
}

textarea:focus{
    border-color:rgba(129,140,248,.7);

    box-shadow:
    0 0 0 4px rgba(99,102,241,.12),
    0 15px 35px rgba(0,0,0,.2);
}

textarea::placeholder{
    color:#94a3b8;
}

button{
    position:relative;
    width:100%;
    padding:16px;
    margin-top:13px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;

    color:white;
    font-family:inherit;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;
    overflow:hidden;

    transition:
    transform .2s,
    box-shadow .2s,
    filter .2s;

    box-shadow:
    0 10px 25px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.15);
}

button:hover{
    transform:translateY(-3px);
    filter:brightness(1.12);
}

button:active{
    transform:scale(.97);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

#checkButton{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.new-button{
    background:linear-gradient(135deg,#10b981,#059669);
}

.hint-button{
    background:linear-gradient(135deg,#f59e0b,#ea580c);
}

.voice-button{
    background:linear-gradient(135deg,#ec4899,#8b5cf6);
}

.voice-button.listening{
    background:linear-gradient(135deg,#ef4444,#dc2626);
    animation:voicePulse 1s infinite;
}

.stop-button{
    background:rgba(255,255,255,.07);
}

.back{
    background:rgba(255,255,255,.07);
}

.loading{
    display:none;
    padding:20px;
    margin-top:18px;
    text-align:center;
    border-radius:20px;
    background:rgba(99,102,241,.1);
    border:1px solid rgba(129,140,248,.2);
}

.result,
.hint,
.error{
    display:none;
    margin-top:18px;
    padding:18px;
    border-radius:20px;
    line-height:2;
    white-space:pre-wrap;
}

.result{
    background:rgba(16,185,129,.12);
    border:1px solid rgba(52,211,153,.3);
}

.hint{
    background:rgba(245,158,11,.12);
    border:1px solid rgba(251,191,36,.3);
}

.error{
    background:rgba(239,68,68,.12);
    border:1px solid rgba(248,113,113,.3);
    color:#fecaca;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#64748b;
    font-size:13px;
}

@keyframes floatPico{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes voicePulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }
}

@media(max-width:500px){

    .container{
        width:94%;
        margin:20px auto;
    }

    .card{
        padding:18px;
        border-radius:25px;
    }

    h1{
        font-size:24px;
    }

    .pico-image{
        width:160px;
    }

    .challenge{
        font-size:16px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="pico-box">

<img
    id="picoImage"
    class="pico-image"
    src="pico.png"
    alt="پیکو"
    onerror="showRobotFallback()"
>

<div
    id="robotFallback"
    class="robot-fallback"
    style="display:none">

🤖

</div>

</div>

<h1>
🧠 چالش هوش هدف
</h1>

<div
    id="score"
    class="score">

⭐ امتیاز: 0

</div>

<div
    id="picoMessage"
    class="message">

🤖 پیکو:

سلام! من پیکو هستم!

آماده‌ای یک چالش باحال حل کنی؟ 😎

</div>

<div
    id="challenge"
    class="challenge">

برای شروع روی
«🧩 چالش جدید»
بزن!

</div>

<textarea
    id="answer"
    placeholder="✍️ جوابت رو اینجا بنویس یا با صدا بگو..."
></textarea>

<button
    id="voiceButton"
    class="voice-button">

🎙️ صحبت با پیکو

</button>

<button
    id="stopVoiceButton"
    class="stop-button">

🔇 قطع صدای پیکو

</button>

<button
    id="checkButton"
    disabled>

✅ بررسی جواب

</button>

<button
    id="newButton"
    class="new-button">

🧩 چالش جدید

</button>

<button
    id="hintButton"
    class="hint-button">

💡 راهنمایی

</button>

<button
    class="back"
    onclick="location.href='index.html'">

🏹 بازگشت به هدف

</button>

<div
    id="loading"
    class="loading">

🤖 پیکو داره فکر می‌کنه...

<br>

⏳ یک لحظه صبر کن...

</div>

<div
    id="result"
    class="result">
</div>

<div
    id="hint"
    class="hint">
</div>

<div
    id="error"
    class="error">
</div>

<div class="footer">

🏹 Hadaf © 2026

</div>

</div>

</div>

<script>

/* =========================================
   تنظیمات
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbz3hPsy7Q3DzTENVKoIkhq8e8LWfiNd_BS28cX1FoS7ewL9f9fKtZOnMvwBKcuWHbEC/exec";


let currentChallenge = "";

let score = 0;

let busy = false;


/* =========================================
   عناصر صفحه
========================================= */

const challengeBox =
document.getElementById("challenge");

const answerBox =
document.getElementById("answer");

const checkButton =
document.getElementById("checkButton");

const newButton =
document.getElementById("newButton");

const hintButton =
document.getElementById("hintButton");

const voiceButton =
document.getElementById("voiceButton");

const stopVoiceButton =
document.getElementById("stopVoiceButton");

const loadingBox =
document.getElementById("loading");

const resultBox =
document.getElementById("result");

const hintBox =
document.getElementById("hint");

const errorBox =
document.getElementById("error");

const picoMessage =
document.getElementById("picoMessage");

const scoreBox =
document.getElementById("score");


/* =========================================
   🤖 ارتباط با API
========================================= */

async function askAI(prompt){

    const response =
    await fetch(
        API_URL,
        {
            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify({
                prompt:prompt
            })
        }
    );


    const rawText =
    await response.text();


    console.log(
        "پاسخ خام API:",
        rawText
    );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status +
            " از API دریافت شد."
        );

    }


    let data;


    try{

        data =
        JSON.parse(rawText);

    }

    catch(error){

        /*
         اگر API مستقیماً متن برگرداند،
         همان متن را استفاده می‌کنیم.
        */

        if(rawText.trim()){

            return rawText.trim();

        }


        throw new Error(
            "API پاسخ خالی یا غیرقابل خواندن فرستاد."
        );

    }


    console.log(
        "داده API:",
        data
    );


    /*
       چند حالت مختلف خروجی API
       را پشتیبانی می‌کنیم.
    */

    if(typeof data === "string"){

        return data.trim();

    }


    if(
        data.challenge &&
        typeof data.challenge === "string"
    ){

        return data.challenge.trim();

    }


    if(
        data.text &&
        typeof data.text === "string"
    ){

        return data.text.trim();

    }


    if(
        data.answer &&
        typeof data.answer === "string"
    ){

        return data.answer.trim();

    }


    if(
        data.response &&
        typeof data.response === "string"
    ){

        return data.response.trim();

    }


    if(
        data.message &&
        typeof data.message === "string"
    ){

        return data.message.trim();

    }


    if(
        data.output &&
        typeof data.output === "string"
    ){

        return data.output.trim();

    }


    if(data.success === false){

        throw new Error(
            data.error ||
            data.message ||
            "API خطا برگرداند."
        );

    }


    throw new Error(
        "ساختار پاسخ API شناخته نشد."
    );

}


/* =========================================
   🧩 چالش جدید
========================================= */

async function newChallenge(){

    if(busy){
        return;
    }


    busy = true;

    hideMessages();

    setLoading(true);

    answerBox.value = "";

    updateCheckButton();


    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    challengeBox.innerText =
    "🤖 پیکو داره یک چالش خفن می‌سازه...";


    picoMessage.innerText =
    "🤖 پیکو: صبر کن ببینم چه چالشی برات بسازم! 😎";


    try{

        const result =
        await askAI(`

یک چالش هوش جدید برای بازی «هدف» بساز.

یکی از این نوع‌ها را انتخاب کن:

ریاضی
منطقی
معمایی
کلمه‌ای
دقت و تمرکز

قوانین:

- مناسب کودک و نوجوان باشد.
- جذاب و سرگرم‌کننده باشد.
- کوتاه باشد.
- جواب مشخص داشته باشد.
- جواب را ننویس.
- فقط متن چالش را بنویس.
- فارسی بنویس.

`);


        currentChallenge =
        result;


        challengeBox.innerText =
        currentChallenge;


        picoMessage.innerText =
        "🤖 پیکو: اینم چالش جدیدت! 🧠🔥";


        picoSpeak(
            "اینم چالش جدیدت!"
        );

    }

    catch(error){

        showError(error);

        challengeBox.innerText =
        "❌ ساخت چالش انجام نشد.";

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =========================================
   ✅ بررسی جواب
========================================= */

async function checkAnswer(){

    if(busy){
        return;
    }


    const answer =
    answerBox.value.trim();


    if(!answer){

        showError(
            "✍️ اول جوابت رو بنویس یا بگو!"
        );

        return;

    }


    if(!currentChallenge){

        showError(
            "🧩 اول یک چالش جدید بساز!"
        );

        return;

    }


    busy = true;

    hideMessages();

    setLoading(true);


    checkButton.disabled = true;

    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    try{

        const result =
        await askAI(`

تو داور بازی هوش «هدف» هستی.

چالش:

${currentChallenge}

جواب کاربر:

${answer}

جواب کاربر را بررسی کن.

در اولین خط دقیقاً یکی از این سه عبارت را بنویس:

STATUS: CORRECT

یا

STATUS: WRONG

یا

STATUS: CLOSE

در خط بعد توضیح کوتاه فارسی بده.

اگر CORRECT بود:
آفرین بگو.
بگو جواب درست است.
یک توضیح کوتاه بده.

اگر WRONG بود:
بگو جواب اشتباه است.
جواب صحیح را نگو.
یک راهنمایی کوچک بده.

اگر CLOSE بود:
بگو جواب خیلی نزدیک است.
یک راهنمایی بده.

`);


        const match =
        result.match(
            /STATUS\s*:\s*(CORRECT|WRONG|CLOSE)/i
        );


        const status =
        match
        ? match[1].toUpperCase()
        : "WRONG";


        showResult(
            "🤖 پیکو:\n\n" +
            result
        );


        picoSpeak(
            result
        );


        if(status === "CORRECT"){

            score += 10;

            updateScore();

            saveScore();


            picoMessage.innerText =
            "🤖 پیکو: عااالی! 🎉 +۱۰ امتیاز گرفتی!";

        }

        else if(status === "CLOSE"){

            picoMessage.innerText =
            "🤖 پیکو: خیلی نزدیک بودی! 👀🧠";

        }

        else{

            picoMessage.innerText =
            "🤖 پیکو: دوباره فکر کن! 🧠";

        }

    }

    catch(error){

        showError(error);

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =========================================
   💡 راهنمایی
========================================= */

async function getHint(){

    if(busy){
        return;
    }


    if(!currentChallenge){

        showError(
            "🧩 اول یک چالش بساز!"
        );

        return;

    }


    busy = true;

    hideMessages();

    setLoading(true);


    checkButton.disabled = true;

    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    try{

        const result =
        await askAI(`

برای این چالش یک راهنمایی بده:

${currentChallenge}

قوانین:

- جواب نهایی را نگو.
- راهنمایی کوتاه باشد.
- واقعاً به حل چالش کمک کند.
- فارسی و دوستانه باشد.

`);


        hintBox.style.display =
        "block";


        hintBox.innerText =
        "💡 راهنمای پیکو:\n\n" +
        result;


        picoSpeak(
            result
        );

    }

    catch(error){

        showError(error);

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =========================================
   ⭐ امتیاز
========================================= */

function updateScore(){

    scoreBox.innerText =
    "⭐ امتیاز: " +
    score;

}


function saveScore(){

    try{

        localStorage.setItem(
            "picoScore",
            String(score)
        );

    }

    catch(error){

        console.error(error);

    }

}


function loadScore(){

    try{

        const saved =
        Number(
            localStorage.getItem(
                "picoScore"
            )
        );


        if(
            Number.isFinite(saved) &&
            saved >= 0
        ){

            score = saved;

        }

    }

    catch(error){

        score = 0;

    }


    updateScore();

}


/* =========================================
   ⏳ لودینگ
========================================= */

function setLoading(value){

    loadingBox.style.display =
    value
    ? "block"
    : "none";

}


/* =========================================
   ❌ خطا
========================================= */

function showError(error){

    errorBox.style.display =
    "block";


    const message =
    error?.message ||
    String(error) ||
    "خطای ناشناخته";


    errorBox.innerText =
    "❌ " +
    message;


    console.error(
        "Pico Error:",
        error
    );

}


/* =========================================
   📢 نتیجه
========================================= */

function showResult(text){

    resultBox.style.display =
    "block";

    resultBox.innerText =
    text;

}


/* =========================================
   🧹 مخفی کردن پیام‌ها
========================================= */

function hideMessages(){

    resultBox.style.display =
    "none";

    hintBox.style.display =
    "none";

    errorBox.style.display =
    "none";

}


/* =========================================
   🤖 تصویر پیکو
========================================= */

function showRobotFallback(){

    document.getElementById(
        "picoImage"
    ).style.display =
    "none";


    document.getElementById(
        "robotFallback"
    ).style.display =
    "block";

}


/* =========================================
   🔘 وضعیت بررسی
========================================= */

function updateCheckButton(){

    checkButton.disabled =
    busy ||
    !currentChallenge ||
    !answerBox.value.trim();

}


/* =========================================
   ✍️ تایپ جواب
========================================= */

answerBox.addEventListener(
    "input",
    updateCheckButton
);


/* =========================================
   🎙️ تشخیص صدا
========================================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if(SpeechRecognition){

    recognition =
    new SpeechRecognition();


    recognition.lang =
    "fa-IR";


    recognition.continuous =
    false;


    recognition.interimResults =
    false;


    recognition.onstart =
    function(){

        isListening = true;


        voiceButton.classList.add(
            "listening"
        );


        voiceButton.innerText =
        "🔴 دارم گوش می‌دم...";


        picoMessage.innerText =
        "🤖 پیکو: بگو ببینم چی می‌خوای! 👂";

    };


    recognition.onresult =
    async function(event){

        const text =
        event
        .results[0][0]
        .transcript
        .trim();


        answerBox.value =
        text;


        updateCheckButton();


        picoMessage.innerText =
        "🤖 پیکو: صدات رو شنیدم! 🧠";


        /*
         اگر چالش وجود دارد،
         جواب صوتی را بررسی کن.
        */

        if(
            currentChallenge &&
            text
        ){

            await checkAnswer();

        }

    };


    recognition.onerror =
    function(event){

        console.error(
            "SpeechRecognition:",
            event.error
        );


        if(
            event.error !==
            "aborted"
        ){

            showError(
                "🎙️ خطا در تشخیص صدا: " +
                event.error
            );

        }

    };


    recognition.onend =
    function(){

        isListening = false;


        voiceButton.classList.remove(
            "listening"
        );


        voiceButton.innerText =
        "🎙️ صحبت با پیکو";

    };

}


/* =========================================
   🎙️ دکمه صحبت
========================================= */

voiceButton.addEventListener(
    "click",
    function(){

        if(!recognition){

            showError(
                "❌ مرورگر شما قابلیت تشخیص صدا را ندارد."
            );

            return;

        }


        if(isListening){

            recognition.stop();

            return;

        }


        try{

            recognition.start();

        }

        catch(error){

            console.error(
                error
            );

        }

    }
);


/* =========================================
   🔊 صحبت کردن پیکو
========================================= */

function picoSpeak(text){

    if(
        !("speechSynthesis" in window)
    ){

        console.warn(
            "Speech Synthesis پشتیبانی نمی‌شود."
        );

        return;

    }


    speechSynthesis.cancel();


    /*
      وضعیت API را برای صدا حذف می‌کنیم.
    */

    const cleanText =
    String(text)
    .replace(
        /STATUS\s*:\s*(CORRECT|WRONG|CLOSE)/gi,
        ""
    )
    .trim();


    if(!cleanText){
        return;
    }


    const speech =
    new SpeechSynthesisUtterance(
        cleanText
    );


    speech.lang =
    "fa-IR";


    speech.rate =
    0.95;


    speech.pitch =
    1.05;


    speech.volume =
    1;


    speechSynthesis.speak(
        speech
    );

}


/* =========================================
   🔇 قطع صدا
========================================= */

stopVoiceButton.addEventListener(
    "click",
    function(){

        if(
            "speechSynthesis" in window
        ){

            speechSynthesis.cancel();

        }


        if(
            recognition &&
            isListening
        ){

            recognition.stop();

        }

    }
);


/* =========================================
   🎮 دکمه‌ها
========================================= */

newButton.addEventListener(
    "click",
    newChallenge
);


checkButton.addEventListener(
    "click",
    checkAnswer
);


hintButton.addEventListener(
    "click",
    getHint
);


/* =========================================
   🚀 شروع
========================================= */

loadScore();

</script>
