<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>چالش هوش هدف 🤖 | پیکو</title>

  <meta name="description"
    content="چالش هوش هدف با پیکو؛ معما و چالش‌های هوشمند با کمک هوش مصنوعی.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #eef2ff);
      color: #172033;
    }

    .container {
      width: min(700px, 94%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
    }

    .pico-box {
      text-align: center;
      margin-bottom: 10px;
    }

    .pico-image {
      width: 180px;
      max-width: 60%;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }

    .robot-fallback {
      font-size: 85px;
      display: none;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      font-size: 28px;
    }

    .message {
      background: #eef2ff;
      border-radius: 20px;
      padding: 18px;
      line-height: 2;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .score {
      text-align: center;
      background: #fef3c7;
      border-radius: 15px;
      padding: 12px;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .challenge {
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 20px;
      padding: 20px;
      min-height: 120px;
      line-height: 2;
      font-size: 18px;
      white-space: pre-wrap;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      margin-top: 15px;
      padding: 15px;
      border: 2px solid #dbe2ea;
      border-radius: 16px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      margin-top: 12px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #6366f1;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .new-button {
      background: #10b981;
    }

    .hint-button {
      background: #f59e0b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px;
      font-size: 17px;
    }

    .result,
    .hint,
    .error {
      display: none;
      margin-top: 15px;
      border-radius: 16px;
      padding: 16px;
      line-height: 2;
      white-space: pre-wrap;
    }

    .result {
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
    }

    .hint {
      background: #fffbeb;
      border: 2px solid #fde68a;
    }

    .error {
      background: #fef2f2;
      border: 2px solid #fecaca;
      color: #991b1b;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="pico-box">

        <img
          id="picoImage"
          class="pico-image"
          src="pico.png"
          alt="پیکو - شخصیت هوش مصنوعی هدف"
          onerror="showRobotFallback()"
        >

        <div id="robotFallback" class="robot-fallback">
          🤖
        </div>

      </div>

      <h1>🧠 چالش هوش هدف</h1>

      <div id="picoMessage" class="message">
        🤖 پیکو:
        سلام! من پیکو هستم!
        آماده‌ای یک چالش باحال حل کنی؟ 😎
      </div>

      <div class="score">
        ⭐ امتیاز:
        <span id="score">0</span>
      </div>

      <div id="challenge" class="challenge">
        برای شروع روی
        «🧩 چالش جدید»
        بزن!
      </div>

      <textarea
        id="answer"
        placeholder="✍️ جوابت رو اینجا بنویس..."
      ></textarea>

      <button
        id="checkButton"
        onclick="checkAnswer()"
        disabled>
        ✅ بررسی جواب
      </button>

      <button
        class="new-button"
        onclick="newChallenge()">
        🧩 چالش جدید
      </button>

      <button
        class="hint-button"
        onclick="getHint()">
        💡 راهنمایی
      </button>

      <div id="loading" class="loading">
        🤖 پیکو داره فکر می‌کنه...
        <br>
        ⏳ یک لحظه صبر کن
      </div>

      <div id="result" class="result"></div>

      <div id="hint" class="hint"></div>

      <div id="error" class="error"></div>

      <div class="footer">
        🏹 چالش هوش هدف
      </div>

    </div>
  </div>


<script>

/* =====================================================
   🔐 OPENROUTER API KEY
===================================================== */

const API_KEY = "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";


/* =====================================================
   🤖 مدل
===================================================== */

const MODEL = "openai/gpt-5-chat";


/* =====================================================
   🌐 آدرس OpenRouter
===================================================== */

const API_URL =
  "https://openrouter.ai/api/v1/chat/completions";


/* =====================================================
   متغیرهای بازی
===================================================== */

let currentChallenge = "";
let score = 0;


/* =====================================================
   🤖 درخواست به OpenRouter
===================================================== */

async function askAI(prompt) {

  if (
    !API_KEY ||
    API_KEY === "YOUR_APIKEY"
  ) {
    throw new Error(
      "اول API Key مربوط به OpenRouter را وارد کن."
    );
  }


  const response = await fetch(
    API_URL,
    {
      method: "POST",

headers: {
  "Content-Type": "application/json",
  "Authorization": "Bearer " + API_KEY,
  "HTTP-Referer": "https://hadaf.site",
  "X-Title": "Hadaf AI Challenge"
},

      body: JSON.stringify({

        const MODEL = "openai/gpt-4o-mini";

        messages: [

          {
            role: "system",

            content: `
تو «پیکو» هستی؛
شخصیت کارتونی سایت چالش هوش هدف.

همیشه فارسی، دوستانه و بانمک صحبت کن.

چالش‌های مناسب کودکان و نوجوانان بساز.

چالش‌ها می‌توانند:
ریاضی، منطقی، کلمه‌ای،
معمایی یا دقت و تمرکز باشند.

چالش‌ها باید امن و مناسب باشند.

وقتی کاربر هنوز جواب نداده،
جواب چالش را لو نده.

پاسخ‌ها کوتاه و قابل فهم باشند.
`
          },

          {
            role: "user",
            content: prompt
          }

        ],

        temperature: 0.8,

        max_tokens: 500

      })
    }
  );


  let data;

  try {

    data = await response.json();

  } catch {

    throw new Error(
      "پاسخ OpenRouter قابل خواندن نبود."
    );

  }


  if (!response.ok) {

    console.error(
      "OpenRouter Error:",
      data
    );

    throw new Error(
      data?.error?.message ||
      `خطای OpenRouter: ${response.status}`
    );

  }


  const text =
    data?.choices?.[0]?.message?.content;


  if (!text) {

    throw new Error(
      "OpenRouter پاسخ متنی نداد."
    );

  }


  return text;

}


/* =====================================================
   🧩 چالش جدید
===================================================== */

async function newChallenge() {

  hideMessages();

  setLoading(true);


  document.getElementById(
    "answer"
  ).value = "";


  document.getElementById(
    "checkButton"
  ).disabled = true;


  try {

    const result =
      await askAI(`

یک چالش هوش جدید بساز.

نوع چالش را خودت انتخاب کن:

ریاضی،
منطقی،
کلمه‌ای،
معمایی،
یا دقت و تمرکز.

قوانین:

- کوتاه باشد.
- جذاب باشد.
- جواب مشخص داشته باشد.
- مناسب کودکان و نوجوانان باشد.
- جواب را نگو.

فقط متن چالش را بنویس.

`);


    currentChallenge = result;


    document.getElementById(
      "challenge"
    ).innerText = result;


    document.getElementById(
      "picoMessage"
    ).innerText =
      "🤖 پیکو: اینم چالش جدیدت! خوب فکر کن... 🧠";


    document.getElementById(
      "checkButton"
    ).disabled = false;

  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   ✅ بررسی جواب
===================================================== */

async function checkAnswer() {

  const answer =
    document.getElementById(
      "answer"
    ).value.trim();


  if (!answer) {

    showError(
      "اول جوابت رو بنویس! 😄"
    );

    return;
  }


  if (!currentChallenge) {

    showError(
      "اول یک چالش جدید بساز!"
    );

    return;
  }


  hideMessages();

  setLoading(true);


  try {

    const result =
      await askAI(`

این چالش را بررسی کن:

--------------------

${currentChallenge}

--------------------

جواب کاربر:

${answer}

--------------------

اگر جواب درست است:

- بگو «آفرین! جواب درست بود 🎉»
- یک توضیح کوتاه بده.
- بگو 10 امتیاز گرفته است.

اگر جواب غلط است:

- بگو جواب درست نیست.
- جواب صحیح را فعلاً نگو.
- یک راهنمایی کوچک بده.

اگر جواب تقریباً درست است،
کاربر را راهنمایی کن.

پاسخ فارسی و دوستانه باشد.

`);


    showResult(
      "🤖 پیکو:\n" + result
    );


    const lower =
      result.toLowerCase();


    if (
      lower.includes("جواب درست بود") ||
      lower.includes("آفرین") ||
      lower.includes("درست است") ||
      lower.includes("صحیح است")
    ) {

      score += 10;


      document.getElementById(
        "score"
      ).innerText = score;

    }

  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   💡 راهنمایی
===================================================== */

async function getHint() {

  if (!currentChallenge) {

    showError(
      "اول یک چالش بساز! 😄"
    );

    return;
  }


  hideMessages();

  setLoading(true);


  try {

    const result =
      await askAI(`

برای این چالش یک راهنمایی کوچک بده:

${currentChallenge}

قوانین:

- جواب نهایی را نگو.
- راهنمایی کوتاه باشد.
- واقعاً به حل چالش کمک کند.
- فارسی و دوستانه باشد.

`);


    const hint =
      document.getElementById(
        "hint"
      );


    hint.style.display = "block";


    hint.innerText =
      "💡 راهنمای پیکو:\n" +
      result;

  }

  catch (error) {

    showError(error);

  }


  setLoading(false);

}


/* =====================================================
   ⏳ Loading
===================================================== */

function setLoading(value) {

  document.getElementById(
    "loading"
  ).style.display =
    value ? "block" : "none";

}


/* =====================================================
   ❌ خطا
===================================================== */

function showError(error) {

  const box =
    document.getElementById(
      "error"
    );


  box.style.display = "block";


  box.innerText =
    "❌ " +
    (error.message || error);


  console.error(error);

}


/* =====================================================
   🎉 نتیجه
===================================================== */

function showResult(text) {

  const box =
    document.getElementById(
      "result"
    );


  box.style.display = "block";


  box.innerText = text;

}


/* =====================================================
   مخفی کردن پیام‌ها
===================================================== */

function hideMessages() {

  document.getElementById(
    "result"
  ).style.display = "none";


  document.getElementById(
    "hint"
  ).style.display = "none";


  document.getElementById(
    "error"
  ).style.display = "none";

}


/* =====================================================
   🤖 عکس پیکو
===================================================== */

function showRobotFallback() {

  document.getElementById(
    "picoImage"
  ).style.display = "none";


  document.getElementById(
    "robotFallback"
  ).style.display = "block";

}

</script>

</body>
</html>
