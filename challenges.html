<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:white;

    background:

    radial-gradient(
        circle at 10% 10%,

        transparent 30%
    ),

    radial-gradient(
        circle at 90% 20%,
        rgba(168,85,247,.25),

    radial-gradient(
        circle at 50% 100%,

        transparent 35%

    linear-gradient(
        135deg,
        #050816,

}

.container{

    width:min(720px,94%);

    margin:30px auto;

    padding-bottom:40px;

}

.card{

    position:relative;

    padding:30px;

    border-radius:32px;

    background:
    linear-gradient(

        rgba(255,255,255,.12),
        rgba(255,255,255,.035)
    );

    1px solid

}

}

}

.challenge{

    min-height:130px;

    padding:23px;

    line-height:2;

}

textarea{

    min-height:120px;

}

textarea:focus{

    rgba(129,140,248,.7);

}

}

button{

    width:100%;

    padding:16px;

    margin-top:13px;

    border:
    1px solid
    rgba(255,255,255,.12);

    border-radius:18px;

    color:white;

    font-family:inherit;

}

button:hover{

    transform:translateY(-2px);

    filter:brightness(1.1);

}

button:active{

    transform:scale(.97);

}

button:disabled{

    opacity:.45;

    cursor:not-allowed;

}

#checkButton{

    background:
    linear-gradient(
        135deg,
        #6366f1,
        #8b5cf6
    );

}

.new-button{

    background:
    linear-gradient(
        135deg,
        #10b981,
        #059669
    );

}

.hint-button{

    background:
    linear-gradient(
        135deg,
        #f59e0b,
        #ea580c
    );

}

.voice-button{

    background:
    linear-gradient(

        #ec4899,

    );

}

.voice-button.listening{

    background:
    linear-gradient(
        135deg,
        #ef4444,

    );

}

.stop-button{

    background:
    rgba(255,255,255,.07);

}

.back{

    background:
    rgba(255,255,255,.07);

}

.loading{

    display:none;

    padding:20px;

    margin-top:18px;

    text-align:center;

    border-radius:20px;

    background:
    rgba(99,102,241,.1);

}

.result,
.hint,
.error{

    display:none;

    margin-top:18px;

    padding:18px;

    border-radius:20px;

    line-height:2;

    white-space:pre-wrap;

}

.result{

    background:
    rgba(16,185,129,.12);

    border:
    1px solid
    rgba(52,211,153,.3);

}

.hint{

    background:
    rgba(245,158,11,.12);

    border:
    1px solid
    rgba(251,191,36,.3);

}

.error{

    background:
    rgba(239,68,68,.12);

    border:
    1px solid
    rgba(248,113,113,.3);

}

.footer{

}

<div

id="picoMessage"

<script>


/* =================================
   🔗 آدرس API جدید پیکو
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzfSuHA7s9ZT_3-nVV_690nK_HuewlTBeVuoCXCjsQUWNszjdAU8_v8l3B_KY40eCP7sQ/exec";


/* =================================
   متغیرها
================================= */

let currentChallenge = "";

let score = 0;

let busy = false;


/* =================================
   عناصر
================================= */

const challengeBox =
document.getElementById("challenge");

const answerBox =
document.getElementById("answer");

const checkButton =
document.getElementById("checkButton");

const newButton =
document.getElementById("newButton");

const hintButton =
document.getElementById("hintButton");

const voiceButton =
document.getElementById("voiceButton");

const stopVoiceButton =
document.getElementById("stopVoiceButton");

const loadingBox =
document.getElementById("loading");

const resultBox =
document.getElementById("result");

const hintBox =
document.getElementById("hint");

const errorBox =
document.getElementById("error");

const picoMessage =
document.getElementById("picoMessage");

const scoreBox =
document.getElementById("score");


/* =================================
   🤖 API
================================= */

async function askAI(prompt){

    const response =
    await fetch(
        API_URL,
        {

            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
            JSON.stringify({
                prompt:prompt
            })

        }
    );


    const raw =
    await response.text();


    console.log(
        "Pico API RAW:",
        raw
    );


    if(!response.ok){

        throw new Error(
            "خطای HTTP: " +
            response.status
        );

    }


    let data;


    try{

        data =
        JSON.parse(raw);

    }

    catch(e){

        console.error(
            "JSON Parse Error:",
            e
        );

        throw new Error(
            "پیکو پاسخ JSON معتبر دریافت نکرد."
        );

    }


    console.log(
        "Pico API JSON:",
        data
    );


    if(
        data.success === false
    ){

        throw new Error(
            data.error ||
            "پیکو نتونست پاسخ بده."
        );

    }


    if(
        data.success === true &&
        typeof data.text === "string"
    ){

        return data.text.trim();

    }


    if(
        typeof data.text === "string"
    ){

        return data.text.trim();

    }


    if(
        typeof data.challenge === "string"
    ){

        return data.challenge.trim();

    }


    if(
        typeof data.response === "string"
    ){

        return data.response.trim();

    }


    if(
        typeof data.message === "string"
    ){

        return data.message.trim();

    }


    throw new Error(
        "پاسخ API قابل تشخیص نیست."
    );

}


/* =================================
   🧩 چالش جدید
================================= */

async function newChallenge(){

    if(busy){
        return;
    }


    busy = true;

    hideMessages();

    setLoading(true);

    answerBox.value = "";

    updateCheckButton();


    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    challengeBox.innerText =
    "🤖 پیکو داره چالش می‌سازه...";


    picoMessage.innerText =
    "🤖 پیکو: صبر کن ببینم چه چالشی برات بسازم! 😎";


    try{

        const result =
        await askAI(`

یک چالش هوش جدید برای بازی «هدف» بساز.

یکی از این نوع‌ها را انتخاب کن:

ریاضی
منطقی
معمایی
کلمه‌ای
دقت و تمرکز

قوانین:

- مناسب کودک و نوجوان باشد.
- جذاب باشد.
- کوتاه باشد.
- جواب مشخص داشته باشد.
- جواب را ننویس.
- فقط متن چالش را بنویس.
- فارسی بنویس.

`);


        currentChallenge =
        result;


        challengeBox.innerText =
        currentChallenge;


        picoMessage.innerText =
        "🤖 پیکو: اینم چالش جدیدت! 🧠🔥";


        picoSpeak(
            "اینم چالش جدیدت!"
        );

    }

    catch(error){

        console.error(error);

        showError(error);

        challengeBox.innerText =
        "❌ ساخت چالش انجام نشد.";

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =================================
   ✅ بررسی جواب
================================= */

async function checkAnswer(){

    if(busy){
        return;
    }


    const answer =
    answerBox.value.trim();


    if(!answer){

        showError(
            "✍️ اول جوابت رو بنویس یا بگو!"
        );

        return;

    }


    if(!currentChallenge){

        showError(
            "🧩 اول یک چالش بساز!"
        );

        return;

    }


    busy = true;

    hideMessages();

    setLoading(true);


    checkButton.disabled = true;

    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    try{

        const result =
        await askAI(`

تو داور بازی هوش «هدف» هستی.

چالش:

${currentChallenge}

جواب کاربر:

${answer}

جواب را بررسی کن.

در اولین خط دقیقاً یکی از این‌ها را بنویس:

STATUS: CORRECT

یا

STATUS: WRONG

یا

STATUS: CLOSE

بعد از آن یک توضیح کوتاه فارسی بده.

اگر CORRECT بود:
آفرین بگو و توضیح کوتاه بده.

اگر WRONG بود:
بگو اشتباه است و جواب صحیح را نگو.

اگر CLOSE بود:
بگو خیلی نزدیک است و یک راهنمایی بده.

`);


        const match =
        result.match(
            /STATUS\s*:\s*(CORRECT|WRONG|CLOSE)/i
        );


        const status =
        match
        ? match[1].toUpperCase()
        : "WRONG";


        showResult(
            "🤖 پیکو:\n\n" +
            result
        );


        picoSpeak(result);


        if(status === "CORRECT"){

            score += 10;

            updateScore();

            saveScore();


            picoMessage.innerText =
            "🤖 پیکو: عااالی! 🎉 +۱۰ امتیاز!";

        }

        else if(status === "CLOSE"){

            picoMessage.innerText =
            "🤖 پیکو: خیلی نزدیک بودی! 👀";

        }

        else{

            picoMessage.innerText =
            "🤖 پیکو: دوباره فکر کن! 🧠";

        }

    }

    catch(error){

        showError(error);

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =================================
   💡 راهنمایی
================================= */

async function getHint(){

    if(busy){
        return;
    }


    if(!currentChallenge){

        showError(
            "🧩 اول یک چالش بساز!"
        );

        return;

    }


    busy = true;

    hideMessages();

    setLoading(true);


    checkButton.disabled = true;

    newButton.disabled = true;

    hintButton.disabled = true;

    voiceButton.disabled = true;


    try{

        const result =
        await askAI(`

برای این چالش یک راهنمایی کوتاه بده:

${currentChallenge}

قوانین:

- جواب نهایی را نگو.
- فارسی باشد.
- دوستانه باشد.
- واقعاً کمک کند.

`);


        hintBox.style.display =
        "block";


        hintBox.innerText =
        "💡 راهنمای پیکو:\n\n" +
        result;


        picoSpeak(result);

    }

    catch(error){

        showError(error);

    }


    setLoading(false);

    newButton.disabled = false;

    hintButton.disabled = false;

    voiceButton.disabled = false;

    busy = false;

    updateCheckButton();

}


/* =================================
   ⭐ امتیاز
================================= */

function updateScore(){

    scoreBox.innerText =
    "⭐ امتیاز: " +
    score;

}


function saveScore(){

    try{

        localStorage.setItem(
            "picoScore",
            String(score)
        );

    }

    catch(e){

        console.error(e);

    }

}


function loadScore(){

    try{

        const saved =
        Number(
            localStorage.getItem(
                "picoScore"
            )
        );


        if(
            Number.isFinite(saved) &&
            saved >= 0
        ){

            score = saved;

        }

    }

    catch(e){

        score = 0;

    }


    updateScore();

}


/* =================================
   ⏳ Loading
================================= */

function setLoading(value){

    loadingBox.style.display =
    value
    ? "block"
    : "none";

}


/* =================================
   ❌ Error
================================= */

function showError(error){

    errorBox.style.display =
    "block";


    const message =
    error?.message ||
    String(error) ||
    "خطای ناشناخته";


    errorBox.innerText =
    "❌ " +
    message;


    console.error(
        "Pico Error:",
        error
    );

}


/* =================================
   نتیجه
================================= */

function showResult(text){

    resultBox.style.display =
    "block";

    resultBox.innerText =
    text;

}


/* =================================
   مخفی کردن
================================= */

function hideMessages(){

    resultBox.style.display =
    "none";

    hintBox.style.display =
    "none";

    errorBox.style.display =
    "none";

}


/* =================================
   تصویر
================================= */

function showRobotFallback(){

    document.getElementById(
        "picoImage"
    ).style.display =
    "none";


    document.getElementById(
        "robotFallback"
    ).style.display =
    "block";

}


/* =================================
   دکمه بررسی
================================= */

function updateCheckButton(){

    checkButton.disabled =
    busy ||
    !currentChallenge ||
    !answerBox.value.trim();

}


/* =================================
   Textarea
================================= */

answerBox.addEventListener(
    "input",
    updateCheckButton
);


/* =================================
   🎙️ Speech Recognition
================================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if(SpeechRecognition){

    recognition =
    new SpeechRecognition();


    recognition.lang =
    "fa-IR";


    recognition.continuous =
    false;


    recognition.interimResults =
    false;


    recognition.onstart =
    function(){

        isListening = true;


        voiceButton.classList.add(
            "listening"
        );


        voiceButton.innerText =
        "🔴 دارم گوش می‌دم...";


        picoMessage.innerText =
        "🤖 پیکو: بگو! 👂";

    };


    recognition.onresult =
    async function(event){

        const text =
        event
        .results[0][0]
        .transcript
        .trim();


        answerBox.value =
        text;


        updateCheckButton();


        picoMessage.innerText =
        "🤖 پیکو: شنیدم! 🧠";


        if(
            currentChallenge &&
            text
        ){

            await checkAnswer();

        }

    };


    recognition.onerror =
    function(event){

        console.error(
            "Speech error:",
            event.error
        );


        if(
            event.error !==
            "aborted"
        ){

            showError(
                "🎙️ خطای تشخیص صدا: " +
                event.error
            );

        }

    };


    recognition.onend =
    function(){

        isListening = false;


        voiceButton.classList.remove(
            "listening"
        );


        voiceButton.innerText =
        "🎙️ صحبت با پیکو";

    };

}


/* =================================
   🎙️ شروع صحبت
================================= */

voiceButton.addEventListener(
    "click",
    function(){

        if(!recognition){

            showError(
                "❌ این مرورگر تشخیص صدا را پشتیبانی نمی‌کند."
            );

            return;

        }


        if(isListening){

            recognition.stop();

            return;

        }


        try{

            recognition.start();

        }

        catch(error){

            console.error(error);

        }

    }
);


/* =================================
   🔊 صدای Pico
================================= */

function picoSpeak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const cleanText =
    String(text)
    .replace(
        /STATUS\s*:\s*(CORRECT|WRONG|CLOSE)/gi,
        ""
    )
    .trim();


    if(!cleanText){
        return;
    }


    const speech =
    new SpeechSynthesisUtterance(
        cleanText
    );


    speech.lang =
    "fa-IR";


    speech.rate =
    0.95;


    speech.pitch =
    1.05;


    speech.volume =
    1;


    speechSynthesis.speak(
        speech
    );

}


/* =================================
   🔇 توقف صدا
================================= */

stopVoiceButton.addEventListener(
    "click",
    function(){

        if(
            "speechSynthesis" in window
        ){

            speechSynthesis.cancel();

        }


        if(
            recognition &&
            isListening
        ){

            recognition.stop();

        }

    }
);


/* =================================
