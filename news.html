<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hadaf Tech 🧠 News 🎯</title>
<link rel="icon" href="logo.ico">

<style>
body {
    margin: 0;
    background: #f2f2f2;
    font-family: Tahoma, sans-serif;
}

.header {
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
}

#news {
    max-width: 900px;
    margin: auto;
}

.card {
    background: white;
    margin: 15px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.content {
    padding: 15px;
}

.content h2 {
    margin: 0 0 10px 0;
}

.content p {
    line-height: 1.8;
    white-space: pre-line;
}

.error {
    text-align: center;
    color: red;
    margin: 20px;
}

.donate {
    display: inline-block;
    background: white;
    color: black;
    text-decoration: none;
    margin: 15px;
    padding: 10px 20px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="header">🧠 Hadaf Tech News 🎯</div>

<div id="news"></div>

<a href="https://daramet.com/parsa2323" class="donate">
    حمایت
</a>

<script>
const newsContainer = document.getElementById("news");

fetch("data.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("فایل data.json پیدا نشد یا قابل خواندن نیست");
        }

        return response.json();
    })
    .then(data => {
        if (!Array.isArray(data)) {
            throw new Error("محتوای data.json باید آرایه باشد");
        }

        let html = "";

        data.forEach(item => {
            if (!item.title && !item.text && !item.image) return;

            html += `
                <div class="card">
                    <img src="${item.image || 'image1.jpg'}" alt="${item.title || 'خبر'}">
                    <div class="content">
                        <h2>${item.title || ''}</h2>
                        <p>${item.text || ''}</p>
                    </div>
                </div>
            `;
        });

        newsContainer.innerHTML = html;
    })
    .catch(error => {
        console.error(error);

        newsContainer.innerHTML = `
            <div class="error">
                خطا در خواندن اطلاعات از data.json
                <br>
                ${error.message}
            </div>
        `;
    });
</script>

</body>
</html>
