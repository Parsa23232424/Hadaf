<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود | هدف 🏹</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #ddd;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,.2);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg,#6c63ff,#3f3d9e);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.8;
    }

    .signup-link {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }

    .signup-link a {
      color: #8b83ff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 ورود</h1>

    <p class="subtitle">
      به حساب هدف خوش آمدی!
    </p>

    <div class="form-group">

      <label>
        📧 ایمیل
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email">

    </div>


    <div class="form-group">

      <label>
        🔒 رمز عبور
      </label>

      <input
        id="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password">

    </div>


    <button id="loginBtn">
      ورود 🚀
    </button>


    <div id="message"></div>


    <div class="signup-link">

      حساب نداری؟

      <a href="signup.html">
        ثبت نام کن
      </a>

    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycby8bXQ7qf_Ld20bN03W4afb7mLfAXoTkL9Bzq8AFXI1Bz6HjE6MyVUisL3hAjQn-k2o/exec";


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, error = false) {

      message.style.display = "block";

      message.textContent = text;

      message.style.background =
        error
          ? "rgba(255,70,70,.15)"
          : "rgba(70,255,70,.15)";

      message.style.color =
        error
          ? "#ff6b6b"
          : "#6cff6c";

    }


    async function login() {

      const mail =
        email.value.trim();

      const pass =
        password.value;


      if (!mail || !pass) {

        showMessage(
          "❌ ایمیل و رمز عبور را وارد کن.",
          true
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "⏳ در حال ورود...";


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "login",

              email: mail,

              password: pass

            })

          });


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            "ورود ناموفق بود."
          );

        }


        /*
          ذخیره اطلاعات غیرحساس کاربر
        */

        localStorage.setItem(
          "hadaf_user",
          JSON.stringify({

            username:
              result.username,

            email:
              result.email

          })
        );


        showMessage(
          "🎉 ورود با موفقیت انجام شد!"
        );


        setTimeout(() => {

          location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        showMessage(
          "❌ " + error.message,
          true
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "ورود 🚀";

      }

    }


    button.addEventListener(
      "click",
      login
    );


    password.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          login();
        }

      }
    );

  </script>

</body>
</html>
