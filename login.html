<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | هدف 🏹</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Tahoma,"Segoe UI",sans-serif;
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)
}
.container{
width:100%;max-width:420px;padding:35px;border-radius:24px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 20px 60px rgba(0,0,0,.5);
backdrop-filter:blur(12px)
}
h1{color:white;text-align:center;margin-bottom:10px}
.subtitle{color:#aaa;text-align:center;margin-bottom:30px}
.form-group{margin-bottom:18px}
label{display:block;color:#ddd;margin-bottom:7px;font-size:14px}
input{
width:100%;padding:14px;border-radius:12px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.07);
color:white;font-size:16px;outline:none
}
input::placeholder{color:#888}
input:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.2)}
button{
width:100%;padding:14px;border:0;border-radius:12px;
background:linear-gradient(135deg,#6c63ff,#3f3d9e);
color:white;font-size:18px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#message{
display:none;margin-top:16px;padding:13px;border-radius:10px;
text-align:center;line-height:1.8;white-space:pre-line;overflow-wrap:anywhere
}
.register-link{text-align:center;color:#aaa;margin-top:20px}
.register-link a{color:#8b83ff;text-decoration:none;font-weight:bold}
</style>
</head>

<body>
<div class="container">
<h1>🔐 ورود</h1>
<p class="subtitle">به حساب هدف خوش آمدی!</p>

<div class="form-group">
<label for="email">📧 ایمیل</label>
<input id="email" type="email" placeholder="example@gmail.com"
autocomplete="email" inputmode="email">
</div>

<div class="form-group">
<label for="password">🔒 رمز عبور</label>
<input id="password" type="password" placeholder="رمز عبور"
autocomplete="current-password">
</div>

<button id="loginBtn" type="button">ورود 🚀</button>
<div id="message" role="status" aria-live="polite"></div>

<div class="register-link">
حساب نداری؟ <a href="signup.html">ثبت نام کن</a>
</div>
</div>

<script>
const API_URL = "https://hadafparsa.atwebpages.com/api.php";

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, error = false) {
  message.style.display = "block";
  message.textContent = text;
  message.style.background = error
    ? "rgba(255,70,70,.15)"
    : "rgba(70,255,70,.15)";
  message.style.color = error ? "#ff6b6b" : "#6cff6c";
}

async function login() {
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!email) {
    showMessage("❌ ایمیل را وارد کن.", true);
    emailInput.focus();
    return;
  }

  if (!password) {
    showMessage("❌ رمز عبور را وارد کن.", true);
    passwordInput.focus();
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "⏳ در حال ورود...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "login",
        email: email,
        password: password
      })
    });

    const text = await response.text();
    let result;

    try {
      result = JSON.parse(text);
    } catch {
      throw new Error("پاسخ API معتبر نیست. فایل api.php را بررسی کن.");
    }

    if (!response.ok) {
      throw new Error("خطای سرور: " + response.status);
    }

    if (result.success !== true) {
      throw new Error(result.message || "ایمیل یا رمز عبور اشتباه است.");
    }

    const apiUser = result.user || {};

    const user = {
      id: String(result.id || apiUser.id || ""),
      username: result.username || apiUser.username || "کاربر هدف",
      email: String(result.email || apiUser.email || email).toLowerCase(),
      score: Number(result.score ?? apiUser.score ?? 0)
    };

    if (!user.id) {
      throw new Error("شناسه کاربر در پاسخ API وجود ندارد.");
    }

    localStorage.setItem("hadafUser", JSON.stringify(user));

    showMessage(
      "🎉 ورود با موفقیت انجام شد!\n\n" +
      "👤 " + user.username +
      "\n⭐ امتیاز: " + user.score
    );

    setTimeout(() => {
      location.href = "index.html";
    }, 1000);

  } catch (error) {
    console.error("Login Error:", error);
    showMessage(
      "❌ " + (error.message || "ارتباط با سرور برقرار نشد."),
      true
    );
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ورود 🚀";
  }
}

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    login();
  }
});

emailInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    passwordInput.focus();
  }
});
</script>
</body>
</html>
