<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود | هدف 🏹</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,"Segoe UI",sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
}

.container{
width:100%;
max-width:420px;
padding:35px;
border-radius:24px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 20px 60px rgba(0,0,0,.5);
backdrop-filter:blur(12px);
}

h1{
color:white;
text-align:center;
margin-bottom:10px;
}

.subtitle{
color:#aaa;
text-align:center;
margin-bottom:30px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
color:#ddd;
margin-bottom:7px;
font-size:14px;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.07);
color:white;
font-size:16px;
outline:none;
}

input::placeholder{
color:#888;
}

input:focus{
border-color:#6c63ff;
box-shadow:0 0 0 3px rgba(108,99,255,.2);
}

button{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#6c63ff,#3f3d9e);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-1px);
}

button:disabled{
opacity:.5;
cursor:not-allowed;
transform:none;
}

#message{
display:none;
margin-top:16px;
padding:13px;
border-radius:10px;
text-align:center;
line-height:1.8;
white-space:pre-line;
}

.register-link{
text-align:center;
color:#aaa;
margin-top:20px;
}

.register-link a{
color:#8b83ff;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🔐 ورود</h1>

<p class="subtitle">
به حساب هدف خوش آمدی!
</p>

<div class="form-group">

<label for="email">📧 ایمیل</label>

<input
id="email"
type="email"
placeholder="example@gmail.com"
autocomplete="email"
inputmode="email">

</div>

<div class="form-group">

<label for="password">🔒 رمز عبور</label>

<input
id="password"
type="password"
placeholder="رمز عبور"
autocomplete="current-password">

</div>

<button id="loginBtn" type="button">
ورود 🚀
</button>

<div id="message"></div>

<div class="register-link">

حساب نداری؟

<a href="signup.html">
ثبت نام کن
</a>

</div>

</div>

<script>

/* =====================================================
   🌐 API ورود
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxl-HoRhHpLryR63qcvMvaSU0S_vXqaRQQ-g-O-vZOxAn3nL_xZdyGV__UkAQmg7YZy/exec";


/* =====================================================
   🎯 عناصر صفحه
===================================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* =====================================================
   💬 نمایش پیام
===================================================== */

function showMessage(text, error = false){

message.style.display = "block";

message.textContent = text;

if(error){

message.style.background =
"rgba(255,70,70,.15)";

message.style.color =
"#ff6b6b";

}else{

message.style.background =
"rgba(70,255,70,.15)";

message.style.color =
"#6cff6c";

}

}


/* =====================================================
   🔐 ورود
===================================================== */

async function login(){

const mail =
emailInput.value.trim().toLowerCase();

const pass =
passwordInput.value;


/* بررسی ایمیل */

if(!mail){

showMessage(
"❌ ایمیل را وارد کن.",
true
);

emailInput.focus();

return;

}


/* بررسی رمز */

if(!pass){

showMessage(
"❌ رمز عبور را وارد کن.",
true
);

passwordInput.focus();

return;

}


/* شروع ورود */

loginBtn.disabled = true;

loginBtn.textContent =
"⏳ در حال ورود...";


try{

/* ارسال درخواست به Apps Script */

const response = await fetch(
API_URL,
{
method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"login",

email:mail,

password:pass

})

}
);


/* دریافت پاسخ */

const text =
await response.text();

console.log(
"📡 کد پاسخ:",
response.status
);

console.log(
"📥 پاسخ API:",
text
);


/* بررسی HTTP */

if(!response.ok){

throw new Error(
"سرور پاسخ نامعتبر داد. کد: " +
response.status
);

}


/* بررسی پاسخ خالی */

if(!text || !text.trim()){

throw new Error(
"API پاسخ خالی فرستاد."
);

}


/* تبدیل JSON */

let result;

try{

result =
JSON.parse(text.trim());

}catch(error){

console.error(
"JSON نامعتبر:",
text
);

throw new Error(
"پاسخ API قابل خواندن نیست."
);

}


/* بررسی موفقیت */

if(result.success !== true){

throw new Error(
result.message ||
"ایمیل یا رمز عبور اشتباه است."
);

}


/* اطلاعات کاربر */

const apiUser =
result.user || {};

const user = {

username:
result.username ||
apiUser.username ||
"کاربر هدف",

email:
result.email ||
apiUser.email ||
mail,

score:
Number(
result.score ??
apiUser.score ??
0
)

};


/* ذخیره کاربر */

localStorage.setItem(
"hadafUser",
JSON.stringify(user)
);


/* پیام موفقیت */

showMessage(
"🎉 ورود با موفقیت انجام شد!\n\n" +
"👤 " +
user.username +
"\n⭐ امتیاز: " +
user.score
);


/* رفتن به صفحه اصلی */

setTimeout(function(){

location.href =
"index.html";

},1000);


}catch(error){

console.error(
"❌ خطای ورود:",
error
);

showMessage(
"❌ " +
(
error.message ||
"خطای ناشناخته"
),
true
);

}finally{

loginBtn.disabled = false;

loginBtn.textContent =
"ورود 🚀";

}

}


/* =====================================================
   🚀 دکمه ورود
===================================================== */

loginBtn.addEventListener(
"click",
login
);


/* =====================================================
   ⌨️ Enter در رمز
===================================================== */

passwordInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

login();

}

});


/* =====================================================
   ⌨️ Enter در ایمیل
===================================================== */

emailInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

event.preventDefault();

passwordInput.focus();

}

});

</script>

</body>
</html>
