
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171438">
<title>ورود | هدف 🏹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)}
.container{width:100%;max-width:420px;padding:35px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
h1{color:white;text-align:center;margin-bottom:10px}
.subtitle{color:#aaa;text-align:center;margin-bottom:30px;line-height:1.8}
.form-group{margin-bottom:18px}
label{display:block;color:#ddd;margin-bottom:7px;font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:white;font-size:16px;outline:none}
input::placeholder{color:#aaa}
input:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.2)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6c63ff,#3f3d9e);color:white;font-size:18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#message{display:none;margin-top:16px;padding:13px;border-radius:10px;text-align:center;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere;font-size:14px}
.register-link{text-align:center;color:#aaa;margin-top:20px;line-height:2}
.register-link a{color:#8b83ff;text-decoration:none;font-weight:bold}
@media(max-width:400px){.container{padding:25px 20px}}
</style>
</head>
<body>
<div class="container">
<h1>🔐 ورود</h1>
<p class="subtitle">به حساب هدف خوش آمدی!</p>

<form id="loginForm">
<div class="form-group">
<label for="email">📧 ایمیل</label>
<input id="email" name="email" type="email" placeholder="example@email.com" autocomplete="username" inputmode="email" maxlength="254" required>
</div>

<div class="form-group">
<label for="password">🔒 رمز عبور</label>
<input id="password" name="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
</div>

<button id="loginBtn" type="submit">ورود 🚀</button>
</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="register-link">
حساب نداری؟ <a href="signup.html">ثبت‌نام کن</a>
</div>
</div>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbyYLVpP-NegJUJazhTr0PcukUBEiT0cb3joLPvbakKKkPND5z48gDcj7mcg6CnSb7RJ/exec";

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const button = document.getElementById("loginBtn");
const message = document.getElementById("message");

let submitting = false;

function showMessage(text, error = false) {
    message.style.display = "block";
    message.textContent = text;
    message.style.background = error
        ? "rgba(255,70,70,.15)"
        : "rgba(70,255,70,.15)";
    message.style.color = error ? "#ff8585" : "#8aff8a";
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    if (submitting) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    submitting = true;
    button.disabled = true;
    button.textContent = "در حال ورود...";
    message.style.display = "none";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=UTF-8",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                action: "login",
                operation: "login",
                email,
                password
            }),
            cache: "no-store",
            redirect: "follow"
        });

        const text = await response.text();
        let result;

        try {
            result = JSON.parse(text);
        } catch {
            throw new Error("پاسخ API معتبر نیست. انتشار وب‌اپ را بررسی کن.");
        }

        if (!response.ok || result.success !== true) {
            throw new Error(result.message || result.error || "ایمیل یا رمز عبور اشتباه است.");
        }

        const apiUser = result.user || result.data?.user || result.data || {};

        const userEmail = String(apiUser.email || result.email || email)
            .trim().toLowerCase();

        const user = {
            id: apiUser.id ?? result.id ?? "",
            user_id: apiUser.user_id ?? result.user_id ?? "",
            username: apiUser.username || result.username || "کاربر هدف",
            email: userEmail,
            score: Number(apiUser.score ?? result.score ?? 0)
        };

        if (!user.email) {
            throw new Error("ایمیل کاربر در پاسخ API وجود ندارد.");
        }

        localStorage.setItem("hadafUser", JSON.stringify(user));
        localStorage.removeItem("hadafAccessToken");

        const token = result.access_token || result.accessToken ||
                      result.session?.access_token;

        if (token) localStorage.setItem("hadafAccessToken", token);

        showMessage("ورود موفق بود! در حال رفتن به سایت...");
        button.textContent = "ورود موفق";

        setTimeout(() => location.href = "index.html", 800);

    } catch (error) {
        showMessage(error.message || "ارتباط با سرور برقرار نشد.", true);
        button.disabled = false;
        button.textContent = "ورود 🚀";
    } finally {
        submitting = false;
    }
});
</script>
</body>
</html>
