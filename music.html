<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پارسا موزیک - جستجوی آهنگ ایرانی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #121212;
            color: #ffffff;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #282828;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1db954;
        }
        .logo span { color: #fff; font-weight: 300; }
        .search-section {
            background: #181818;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }
        .search-section input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border-radius: 30px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-section input:focus { border-color: #1db954; }
        .search-section input::placeholder { color: #888; }
        .search-section button {
            background: #1db954;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-section button:hover { background: #1ed760; }
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .track-card {
            background: #181818;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }
        .track-card:hover {
            background: #282828;
            transform: translateY(-4px);
        }
        .track-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            background: #333;
        }
        .track-card .track-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.4rem;
        }
        .track-card .track-artists {
            font-size: 0.85rem;
            color: #b3b3b3;
            margin-bottom: 0.6rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-card .play-btn {
            background: #1db954;
            border: none;
            color: #fff;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .track-card .play-btn:hover { background: #1ed760; }
        .message-box {
            background: #1f0f0f;
            border: 1px solid #6b2a2a;
            color: #ff8a8a;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
        }
        .message-box.show { display: block; }
        .message-box.loading {
            background: #0f1f0f;
            border-color: #2a6b2a;
            color: #8aff8a;
        }
        .message-box.info {
            background: #1f1f0f;
            border-color: #6b6b2a;
            color: #ffff8a;
        }

        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 1rem 2rem;
            display: none;
            align-items: center;
            gap: 1.5rem;
            z-index: 1000;
            flex-wrap: wrap;
        }
        .player-container.active { display: flex; }
        .player-container .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 200px;
        }
        .player-container .player-info img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .player-container .player-info .details .title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .player-container .player-info .details .artist {
            color: #b3b3b3;
            font-size: 0.85rem;
        }
        .player-container .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .player-container .player-controls button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }
        .player-container .player-controls button:hover { color: #1db954; }
        .player-container .player-controls .play-pause { font-size: 2.5rem; }
        .player-container .progress-container {
            flex: 2;
            min-width: 150px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .player-container .progress-container input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #404040;
            border-radius: 2px;
            outline: none;
        }
        .player-container .progress-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #1db954;
            border-radius: 50%;
            cursor: pointer;
        }
        .player-container .progress-container .time {
            font-size: 0.8rem;
            color: #b3b3b3;
            min-width: 40px;
        }
        @media (max-width: 600px) {
            .player-container {
                padding: 0.8rem;
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* استایل دکمه‌های صفحه‌بندی */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            margin-bottom: 5rem;
        }
        .pagination button {
            background: #282828;
            border: none;
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) {
            background: #3a3a3a;
            transform: scale(1.02);
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵 پارسا <span>موزیک</span></div>
            <div style="font-size:0.9rem;color:#888;">
                <span id="now-playing" style="color:#1db954;">آماده پخش</span>
            </div>
        </header>

        <div class="search-section">
            <input type="text" id="search-input" placeholder="نام خواننده یا آهنگ را جستجو کن..." />
            <button id="search-btn">🔍 جستجو</button>
        </div>

        <div id="message-box" class="message-box"></div>
        <div id="results-grid"></div>
        
        <div class="pagination">
            <button id="prev-btn" disabled>قبلی</button>
            <button id="next-btn" disabled>بعدی</button>
        </div>
    </div>

    <!-- پلیر -->
    <div id="player-container" class="player-container">
        <div class="player-info">
            <img id="player-img" src="" alt="آلبوم">
            <div class="details">
                <div class="title" id="player-title">نام آهنگ</div>
                <div class="artist" id="player-artist">نام خواننده</div>
            </div>
        </div>
        <div class="player-controls">
            <button id="player-prev">⏮</button>
            <button id="player-play" class="play-pause">▶</button>
            <button id="player-next">⏭</button>
        </div>
        <div class="progress-container">
            <span class="time" id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span class="time" id="total-time">0:00</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  جستجو با استفاده از یک کتابخانه آفلاین (بدون نیاز به API)
        //  این روش کاملاً مستقل از سایت‌های خارجی است
        // ============================================================

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsGrid = document.getElementById('results-grid');
        const messageBox = document.getElementById('message-box');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playerContainer = document.getElementById('player-container');
        const playerImg = document.getElementById('player-img');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const playerPlay = document.getElementById('player-play');
        const playerPrev = document.getElementById('player-prev');
        const playerNext = document.getElementById('player-next');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');
        const nowPlaying = document.getElementById('now-playing');

        let allTracks = [];
        let filteredTracks = [];
        let currentIndex = 0;
        let audioPlayer = null;
        let isPlaying = false;
        let currentPage = 0;
        const ITEMS_PER_PAGE = 12;

        // ============================================================
        //  کتابخانه آهنگ‌های معروف ایرانی (آفلاین)
        //  این لیست رو می‌تونی با آهنگ‌های بیشتر تکمیل کنی
        // ============================================================

        const PERSIAN_SONGS = [
            // شادمهر عقیلی
            { title: 'تولدت مبارک', artist: 'شادمهر عقیلی', cover: 'https://picsum.photos/seed/shademahr1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
            { title: 'حس خوب', artist: 'شادمهر عقیلی', cover: 'https://picsum.photos/seed/shademahr2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
            { title: 'عاشقانه', artist: 'شادمهر عقیلی', cover: 'https://picsum.photos/seed/shademahr3/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
            { title: 'دلم تنگه', artist: 'شادمهر عقیلی', cover: 'https://picsum.photos/seed/shademahr4/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
            
            // محسن چاوشی
            { title: 'منو ببخش', artist: 'محسن چاوشی', cover: 'https://picsum.photos/seed/chavoshi1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
            { title: 'عاشق که میشی', artist: 'محسن چاوشی', cover: 'https://picsum.photos/seed/chavoshi2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' },
            { title: 'منو یادت', artist: 'محسن چاوشی', cover: 'https://picsum.photos/seed/chavoshi3/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' },
            
            // همایون شجریان
            { title: 'بی‌تو', artist: 'همایون شجریان', cover: 'https://picsum.photos/seed/homayoun1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' },
            { title: 'آهنگ عاشقانه', artist: 'همایون شجریان', cover: 'https://picsum.photos/seed/homayoun2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3' },
            
            // علیرضا قربانی
            { title: 'خون خدا', artist: 'علیرضا قربانی', cover: 'https://picsum.photos/seed/ghorbani1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3' },
            { title: 'دلشوره', artist: 'علیرضا قربانی', cover: 'https://picsum.photos/seed/ghorbani2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
            
            // محمدرضا شجریان
            { title: 'مرغ سحر', artist: 'محمدرضا شجریان', cover: 'https://picsum.photos/seed/shajarian1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
            { title: 'ایران ای سرای امید', artist: 'محمدرضا شجریان', cover: 'https://picsum.photos/seed/shajarian2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
            
            // ابی
            { title: 'خونه', artist: 'ابی', cover: 'https://picsum.photos/seed/ebi1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
            { title: 'ناخدا', artist: 'ابی', cover: 'https://picsum.photos/seed/ebi2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
            
            // امیر تتلو
            { title: 'آهو', artist: 'امیر تتلو', cover: 'https://picsum.photos/seed/tataloo1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' },
            { title: 'حس خوب', artist: 'امیر تتلو', cover: 'https://picsum.photos/seed/tataloo2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3' },
            
            // سیروان خسروی
            { title: 'تو', artist: 'سیروان خسروی', cover: 'https://picsum.photos/seed/sirvan1/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3' },
            { title: 'دوست دارم', artist: 'سیروان خسروی', cover: 'https://picsum.photos/seed/sirvan2/300/300', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3' },
        ];

        // ============================================================
        //  جستجو در کتابخانه داخلی
        // ============================================================

        function searchMusic(query) {
            try {
                showMessage('در حال جستجو در بانک موسیقی ایرانی...', 'loading');
                resultsGrid.innerHTML = '';

                const queryLower = query.toLowerCase().trim();
                
                // فیلتر کردن آهنگ‌ها بر اساس جستجو
                const results = PERSIAN_SONGS.filter(song => 
                    song.title.toLowerCase().includes(queryLower) || 
                    song.artist.toLowerCase().includes(queryLower)
                );

                if (results.length === 0) {
                    showMessage('هیچ آهنگی با این عبارت پیدا نشد. لطفاً با عبارت دیگری جستجو کنید.', 'info');
                    return;
                }

                allTracks = PERSIAN_SONGS;
                filteredTracks = results;
                currentPage = 0;
                hideMessage();
                renderPage(0);

            } catch (error) {
                console.error('خطا:', error);
                showMessage(`خطا در جستجو: ${error.message}`, 'error');
            }
        }

        // ============================================================
        //  صفحه‌بندی
        // ============================================================

        function renderPage(page) {
            const start = page * ITEMS_PER_PAGE;
            const end = Math.min(start + ITEMS_PER_PAGE, filteredTracks.length);
            const pageTracks = filteredTracks.slice(start, end);
            
            renderTracks(pageTracks);
            
            // بروزرسانی دکمه‌های صفحه‌بندی
            prevBtn.disabled = page === 0;
            nextBtn.disabled = end >= filteredTracks.length;
            currentPage = page;
        }

        function goToPrevPage() {
            if (currentPage > 0) {
                renderPage(currentPage - 1);
            }
        }

        function goToNextPage() {
            const maxPage = Math.ceil(filteredTracks.length / ITEMS_PER_PAGE) - 1;
            if (currentPage < maxPage) {
                renderPage(currentPage + 1);
            }
        }

        // ============================================================
        //  نمایش آهنگ‌ها
        // ============================================================

        function renderTracks(tracks) {
            resultsGrid.innerHTML = '';

            if (!tracks || tracks.length === 0) {
                resultsGrid.innerHTML = '<p style="text-align:center;color:#888;grid-column:1/-1;">هیچ آهنگی پیدا نشد.</p>';
                return;
            }

            tracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';

                const img = document.createElement('img');
                img.src = track.cover || 'https://picsum.photos/seed/music/300/300';
                img.alt = track.title;
                img.onerror = function() {
                    this.src = 'https://picsum.photos/seed/music/300/300';
                };
                card.appendChild(img);

                const nameDiv = document.createElement('div');
                nameDiv.className = 'track-name';
                nameDiv.textContent = track.title.length > 30 ? track.title.substring(0, 30) + '...' : track.title;
                card.appendChild(nameDiv);

                const artistDiv = document.createElement('div');
                artistDiv.className = 'track-artists';
                artistDiv.textContent = track.artist;
                card.appendChild(artistDiv);

                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.textContent = '▶ پخش';
                playBtn.onclick = (e) => {
                    e.stopPropagation();
                    playTrack(getGlobalIndex(index));
                };
                card.appendChild(playBtn);

                card.onclick = () => playTrack(getGlobalIndex(index));
                resultsGrid.appendChild(card);
            });
        }

        function getGlobalIndex(localIndex) {
            return currentPage * ITEMS_PER_PAGE + localIndex;
        }

        // ============================================================
        //  پخش آهنگ
        // ============================================================

        function playTrack(index) {
            if (index < 0 || index >= filteredTracks.length) return;

            currentIndex = index;
            const track = filteredTracks[index];

            playerTitle.textContent = track.title;
            playerArtist.textContent = track.artist;
            playerImg.src = track.cover || 'https://picsum.photos/seed/music/300/300';
            playerImg.onerror = function() {
                this.src = 'https://picsum.photos/seed/music/300/300';
            };
            nowPlaying.textContent = `در حال پخش: ${track.title} - ${track.artist}`;

            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer.src = '';
            }

            try {
                audioPlayer = new Audio(track.audio);

                audioPlayer.addEventListener('loadedmetadata', () => {
                    const duration = audioPlayer.duration;
                    if (!isNaN(duration) && duration > 0 && duration !== Infinity) {
                        totalTimeDisplay.textContent = formatTime(duration);
                        progressBar.max = duration;
                    }
                });

                audioPlayer.addEventListener('timeupdate', () => {
                    const current = audioPlayer.currentTime;
                    if (!isNaN(current) && current > 0) {
                        currentTimeDisplay.textContent = formatTime(current);
                        if (!isNaN(progressBar.max) && progressBar.max > 0) {
                            progressBar.value = current;
                        }
                    }
                });

                audioPlayer.addEventListener('ended', () => {
                    playNext();
                });

                audioPlayer.addEventListener('error', () => {
                    alert('خطا در پخش. لطفاً آهنگ دیگری را امتحان کنید.');
                });

                audioPlayer.play()
                    .then(() => {
                        isPlaying = true;
                        playerPlay.textContent = '⏸';
                        playerContainer.classList.add('active');
                    })
                    .catch(() => {
                        alert('امکان پخش این آهنگ وجود ندارد.');
                    });

            } catch (error) {
                console.error('خطا:', error);
                alert('خطا در پخش.');
            }
        }

        // ============================================================
        //  کنترل‌های پلیر
        // ============================================================

        function togglePlay() {
            if (!audioPlayer) return;

            if (isPlaying) {
                audioPlayer.pause();
                playerPlay.textContent = '▶';
                isPlaying = false;
            } else {
                audioPlayer.play()
                    .then(() => {
                        playerPlay.textContent = '⏸';
                        isPlaying = true;
                    })
                    .catch(() => {
                        alert('خطا در پخش.');
                    });
            }
        }

        function playPrev() {
            if (currentIndex > 0) {
                playTrack(currentIndex - 1);
            } else if (filteredTracks.length > 0) {
                playTrack(filteredTracks.length - 1);
            }
        }

        function playNext() {
            if (currentIndex < filteredTracks.length - 1) {
                playTrack(currentIndex + 1);
            } else if (filteredTracks.length > 0) {
                playTrack(0);
            }
        }

        function seekTo(value) {
            if (audioPlayer && !isNaN(value) && value >= 0) {
                try {
                    audioPlayer.currentTime = value;
                } catch (e) {
                    console.error('خطا:', e);
                }
            }
        }

        // ============================================================
        //  توابع کمکی
        // ============================================================

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.className = 'message-box show';
            if (type === 'error') {
                messageBox.style.borderColor = '#6b2a2a';
                messageBox.style.color = '#ff8a8a';
                messageBox.style.background = '#1f0f0f';
            } else if (type === 'loading') {
                messageBox.style.borderColor = '#2a6b2a';
                messageBox.style.color = '#8aff8a';
                messageBox.style.background = '#0f1f0f';
            } else {
                messageBox.style.borderColor = '#3a3a3a';
                messageBox.style.color = '#ccc';
                messageBox.style.background = '#181818';
            }
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }

        // ============================================================
        //  رویدادها
        // ============================================================

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (!query) {
                showMessage('لطفاً نام خواننده یا آهنگ را وارد کنید.', 'info');
                return;
            }
            searchMusic(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        prevBtn.addEventListener('click', goToPrevPage);
        nextBtn.addEventListener('click', goToNextPage);

        playerPlay.addEventListener('click', togglePlay);
        playerPrev.addEventListener('click', playPrev);
        playerNext.addEventListener('click', playNext);
        progressBar.addEventListener('input', (e) => {
            seekTo(parseFloat(e.target.value));
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT' && e.key === ' ') {
                e.preventDefault();
                togglePlay();
            }
        });

        // ============================================================
        //  جستجوی پیش‌فرض با prompt
        // ============================================================

        window.addEventListener('load', () => {
            const userQuery = prompt('🎵 نام خواننده یا آهنگ مورد نظر را وارد کنید:', 'شادمهر');
            
            if (userQuery !== null && userQuery.trim() !== '') {
                searchInput.value = userQuery.trim();
                searchMusic(userQuery.trim());
            } else {
                showMessage('برای جستجو، نام خواننده یا آهنگ را وارد کنید.', 'info');
            }
        });

        console.log('🎵 پارسا موزیک - جستجوی آهنگ ایرانی (آفلاین)');
        console.log(`📀 ${PERSIAN_SONGS.length} آهنگ در کتابخانه موجود است.`);
    </script>
</body>
</html>
