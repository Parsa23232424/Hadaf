<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پارسا موزیک - جستجوی آهنگ ایرانی</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #121212;
            color: #ffffff;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #282828;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1db954;
        }
        .logo span { color: #fff; font-weight: 300; }
        .search-section {
            background: #181818;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }
        .search-section input {
            flex: 1;
            min-width: 200px;
            padding: 0.8rem 1.2rem;
            border-radius: 30px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-section input:focus { border-color: #1db954; }
        .search-section button {
            background: #1db954;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-section button:hover { background: #1ed760; }
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .track-card {
            background: #181818;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.2s;
            text-align: center;
            cursor: pointer;
        }
        .track-card:hover {
            background: #282828;
            transform: translateY(-4px);
        }
        .track-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            background: #333;
        }
        .track-card .track-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }
        .track-card .track-artists {
            font-size: 0.85rem;
            color: #b3b3b3;
            margin-bottom: 0.6rem;
        }
        .track-card .play-btn {
            background: #1db954;
            border: none;
            color: #fff;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
        }
        .track-card .play-btn:hover { background: #1ed760; }
        .message-box {
            background: #1f0f0f;
            border: 1px solid #6b2a2a;
            color: #ff8a8a;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
        }
        .message-box.show { display: block; }
        .message-box.loading {
            background: #0f1f0f;
            border-color: #2a6b2a;
            color: #8aff8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵 پارسا <span>موزیک</span></div>
            <div style="font-size:0.9rem;color:#888;">جستجوی آهنگ با One-api.ir</div>
        </header>

        <div class="search-section">
            <input type="text" id="search-input" placeholder="نام خواننده یا آهنگ را جستجو کن..." />
            <button id="search-btn">🔍 جستجو</button>
        </div>

        <div id="message-box" class="message-box"></div>
        <div id="results-grid"></div>
    </div>

    <script>
        // ============================================================
        //  استفاده از One-api.ir که جدیداً آپدیت شده
        //  این API از ساندکلاود برای جستجوی آهنگ ایرانی استفاده میکنه [citation:3]
        // ============================================================

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resultsGrid = document.getElementById('results-grid');
        const messageBox = document.getElementById('message-box');

        async function searchMusic(query) {
            try {
                showMessage('در حال جستجو در One-api.ir...', 'loading');
                resultsGrid.innerHTML = '';

                // طبق آپدیت جدید One-api.ir [citation:3]
                const url = `https://one-api.ir/api-soundcloud/?action=search&q=${encodeURIComponent(query)}`;

                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`خطا: ${response.status}`);
                }

                const data = await response.json();
                console.log('دیتا:', data);

                // بررسی ساختار پاسخ
                if (!data || !data.result) {
                    showMessage('هیچ نتیجه‌ای پیدا نشد یا ساختار پاسخ تغییر کرده.', 'info');
                    return;
                }

                const tracks = data.result.map((item, index) => ({
                    id: index,
                    title: item.title || item.name || 'بدون نام',
                    artist: item.artist || item.singer || 'ناشناس',
                    cover: item.cover || item.image || 'https://picsum.photos/seed/music/300/300',
                    audio: item.link || item.url || item.mp3 || null
                }));

                if (tracks.length === 0) {
                    showMessage('هیچ آهنگی با این عبارت پیدا نشد.', 'info');
                    return;
                }

                hideMessage();
                renderTracks(tracks);

            } catch (error) {
                console.error('خطا:', error);
                showMessage(`خطا در جستجو: ${error.message}`, 'error');
            }
        }

        function renderTracks(tracks) {
            resultsGrid.innerHTML = '';

            tracks.forEach((track) => {
                const card = document.createElement('div');
                card.className = 'track-card';

                const img = document.createElement('img');
                img.src = track.cover || 'https://picsum.photos/seed/music/300/300';
                img.alt = track.title;
                img.onerror = function() {
                    this.src = 'https://picsum.photos/seed/music/300/300';
                };
                card.appendChild(img);

                const nameDiv = document.createElement('div');
                nameDiv.className = 'track-name';
                nameDiv.textContent = track.title.length > 30 ? track.title.substring(0, 30) + '...' : track.title;
                card.appendChild(nameDiv);

                const artistDiv = document.createElement('div');
                artistDiv.className = 'track-artists';
                artistDiv.textContent = track.artist;
                card.appendChild(artistDiv);

                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.textContent = '▶ پخش';
                playBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (track.audio) {
                        window.open(track.audio, '_blank');
                    } else {
                        alert('لینک پخش برای این آهنگ موجود نیست.');
                    }
                };
                card.appendChild(playBtn);

                resultsGrid.appendChild(card);
            });
        }

        function showMessage(text, type = 'info') {
            messageBox.textContent = text;
            messageBox.className = 'message-box show';
            if (type === 'error') {
                messageBox.style.borderColor = '#6b2a2a';
                messageBox.style.color = '#ff8a8a';
                messageBox.style.background = '#1f0f0f';
            } else if (type === 'loading') {
                messageBox.style.borderColor = '#2a6b2a';
                messageBox.style.color = '#8aff8a';
                messageBox.style.background = '#0f1f0f';
            } else {
                messageBox.style.borderColor = '#3a3a3a';
                messageBox.style.color = '#ccc';
                messageBox.style.background = '#181818';
            }
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (!query) {
                showMessage('لطفاً نام خواننده یا آهنگ را وارد کنید.', 'info');
                return;
            }
            searchMusic(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        // جستجوی پیش‌فرض
        searchInput.value = 'شادمهر';
        setTimeout(() => searchMusic('شادمهر'), 500);
    </script>
</body>
</html>
