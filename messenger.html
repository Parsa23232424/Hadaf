<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="description" content="پیام‌رسان هدف؛ گفت‌وگو، گروه، کانال و ارسال عکس و فیلم">
<title>پیام‌رسان هدف 💬</title>

<style>
:root{
  color-scheme:dark;
  --bg:#07090f;
  --panel:#10131e;
  --panel2:#171b29;
  --line:#282d40;
  --text:#f4f5ff;
  --muted:#9ba2ba;
  --purple:#7665ff;
  --purple2:#5543df;
  --green:#31d69a;
  --red:#ff626f;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.app{
  width:min(1200px,100%);
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  padding:18px 16px;
  background:linear-gradient(135deg,#17152c,#10131e);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
  width:48px;height:48px;
  border-radius:16px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  font-size:25px;
}
.brand h1{font-size:19px;margin:0 0 6px}
.brand p{font-size:12px;color:var(--muted);margin:0}
.account{
  max-width:45%;
  font-size:11px;
  color:var(--muted);
  overflow-wrap:anywhere;
  text-align:left;
}
.main{
  flex:1;
  display:grid;
  grid-template-columns:320px minmax(0,1fr);
  min-height:600px;
}
.sidebar{
  padding:14px;
  border-left:1px solid var(--line);
  background:#0b0e17;
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.section-title h2{font-size:16px;margin:0}
button,.button{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:var(--purple);
  color:white;
}
button.secondary{
  background:var(--panel2);
  border:1px solid var(--line);
}
button.small{padding:8px 10px;font-size:12px}
.search{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  outline:none;
}
.filters{
  display:flex;
  gap:6px;
  margin-bottom:12px;
}
.filters button{
  flex:1;
  padding:9px 4px;
  font-size:12px;
  background:var(--panel2);
  color:var(--muted);
}
.filters button.active{background:var(--purple);color:white}
.chat-list{display:flex;flex-direction:column;gap:8px}
.chat-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:right;
  background:transparent;
  border:1px solid transparent;
  padding:12px 10px;
  border-radius:14px;
}
.chat-item:hover,.chat-item.selected{
  background:var(--panel2);
  border-color:var(--line);
}
.avatar{
  flex-shrink:0;
  width:42px;height:42px;
  border-radius:15px;
  display:grid;place-items:center;
  background:#28234b;
  font-size:21px;
}
.chat-info{min-width:0;flex:1}
.chat-name{
  font-size:13px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:5px;
  overflow-wrap:anywhere;
}
.chat-preview{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.verified{
  display:inline-grid;
  place-items:center;
  width:16px;height:16px;
  border-radius:50%;
  background:#318bff;
  color:white;
  font-size:11px;
  flex-shrink:0;
}
.empty{
  color:var(--muted);
  text-align:center;
  padding:28px 10px;
  font-size:13px;
  line-height:2;
}
.conversation{
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:600px;
}
.conversation-head{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:var(--panel);
}
.conversation-title{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.conversation-title h2{
  font-size:15px;
  margin:0 0 5px;
  overflow-wrap:anywhere;
}
.conversation-title p{margin:0;color:var(--muted);font-size:11px}
.head-actions{display:flex;gap:7px;flex-wrap:wrap}
.messages{
  flex:1;
  min-height:280px;
  max-height:calc(100vh - 300px);
  overflow:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:
    radial-gradient(ellipse at top,#17152b55,transparent 55%),
    var(--bg);
}
.message-row{display:flex;flex-direction:column;max-width:85%;align-self:flex-start}
.message-row.mine{align-self:flex-end}
.sender{
  font-size:11px;
  color:var(--muted);
  margin:0 7px 5px;
}
.bubble{
  border:1px solid var(--line);
  border-radius:16px 16px 16px 5px;
  background:var(--panel);
  padding:10px 12px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  line-height:1.8;
  font-size:13px;
}
.mine .bubble{
  background:#29234b;
  border-color:#484078;
  border-radius:16px 16px 5px 16px;
}
.message-time{
  color:var(--muted);
  font-size:10px;
  margin:4px 5px 0;
}
.media-message{white-space:normal}
.media-message img{
  display:block;
  max-width:min(100%,420px);
  max-height:360px;
  object-fit:contain;
  border-radius:10px;
  cursor:pointer;
}
.media-message video{
  display:block;
  width:min(100%,420px);
  max-height:360px;
  border-radius:10px;
  background:#000;
}
.media-caption{
  margin-top:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.7;
}
.media-name{
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
  overflow-wrap:anywhere;
}
.composer{
  padding:12px;
  background:var(--panel);
  border-top:1px solid var(--line);
}
.composer-tools{
  display:flex;
  align-items:center;
  gap:8px;
}
#messageInput{
  min-width:0;
  flex:1;
  resize:none;
  min-height:46px;
  max-height:130px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}
#messageInput:focus,.search:focus,input:focus,textarea:focus,select:focus{
  border-color:var(--purple);
}
.attach-btn{
  flex-shrink:0;
  width:46px;height:46px;
  padding:0;
  font-size:21px;
  background:var(--panel2);
  border:1px solid var(--line);
}
.send-btn{height:46px;min-width:64px}
.composer-note{
  font-size:10px;
  color:var(--muted);
  margin:9px 4px 0;
  line-height:1.8;
}
.status{
  display:none;
  margin:10px 0 0;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel2);
  font-size:12px;
  line-height:1.8;
  overflow-wrap:anywhere;
}
.status.show{display:block}
.status.error{color:#ff9ca5;border-color:#66313a}
.status.success{color:#8ef0c8;border-color:#285b4b}
.status.info{color:#d2ccff}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:20;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:20px;
  padding:18px;
}
.modal h2{font-size:17px;margin:0 0 16px}
.form-row{margin-bottom:13px}
.form-row label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}
.form-row input,.form-row select,.form-row textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--text);
  padding:12px;
  outline:none;
}
.form-actions{display:flex;gap:8px;margin-top:16px}
.form-actions button{flex:1}
footer{
  text-align:center;
  padding:14px;
  color:var(--muted);
  font-size:11px;
  border-top:1px solid var(--line);
}
#mediaInput{display:none}
@media(max-width:760px){
  .main{grid-template-columns:1fr;min-height:0}
  .sidebar{border-left:0;border-bottom:1px solid var(--line)}
  .chat-list{
    flex-direction:row;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .chat-item{
    min-width:175px;
    max-width:230px;
  }
  .conversation{min-height:500px}
  .messages{max-height:55vh;min-height:250px;padding:13px}
  .message-row{max-width:92%}
  header{padding:13px}
  .brand h1{font-size:16px}
  .brand p{font-size:10px}
  .account{font-size:10px}
  .conversation-head{padding:12px}
  .head-actions button{font-size:11px;padding:8px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="brand-icon">💬</div>
    <div>
      <h1>پیام‌رسان هدف</h1>
      <p>با هم، یک قدم جلوتر 🚀</p>
    </div>
  </div>
  <div class="account" id="accountLabel">در حال بررسی حساب...</div>
</header>

<main class="main">
  <aside class="sidebar">
    <div class="section-title">
      <h2>گفت‌وگوها</h2>
      <button id="newChatBtn" class="small">＋ جدید</button>
    </div>

    <input id="searchInput" class="search" type="search" placeholder="جست‌وجو...">

    <div class="filters">
      <button class="active" data-filter="all">همه</button>
      <button data-filter="private">خصوصی</button>
      <button data-filter="group">گروه‌ها</button>
      <button data-filter="channel">کانال‌ها</button>
    </div>

    <div id="chatList" class="chat-list">
      <div class="empty">در حال بارگذاری گفت‌وگوها...</div>
    </div>
    <div id="chatStatus" class="status"></div>
  </aside>

  <section class="conversation">
    <div class="conversation-head">
      <div class="conversation-title">
        <div id="activeAvatar" class="avatar">💬</div>
        <div>
          <h2 id="activeTitle">یک گفت‌وگو انتخاب کن</h2>
          <p id="activeSubtitle">پیام‌رسان هدف</p>
        </div>
      </div>
      <div class="head-actions">
        <button id="membersBtn" class="secondary small" hidden>＋ عضو</button>
        <button id="refreshBtn" class="secondary small">↻ تازه‌سازی</button>
      </div>
    </div>

    <div id="messages" class="messages">
      <div class="empty">برای شروع، یک گفت‌وگو را انتخاب کن 💬</div>
    </div>

    <div class="composer">
      <div class="composer-tools">
        <textarea id="messageInput" placeholder="پیامت را بنویس..." rows="1"></textarea>
        <button id="sendBtn" class="send-btn">ارسال</button>
      <div id="composerStatus" class="status"></div>
    </div>
  </section>
</main>

<footer>🏹 Hadaf © 2026</footer>
</div>

<!-- پنجره ساخت گفت‌وگو -->
<div id="newChatModal" class="modal-backdrop">
  <div class="modal">
    <h2>ساخت گفت‌وگوی جدید</h2>
    <form id="newChatForm">
      <div class="form-row">
        <label for="chatType">نوع گفت‌وگو</label>
        <select id="chatType">
          <option value="private">گفت‌وگوی خصوصی</option>
          <option value="group">گروه</option>
          <option value="channel">کانال</option>
        </select>
      </div>
      <div class="form-row">
        <label for="chatName">نام گفت‌وگو</label>
        <input id="chatName" maxlength="100" placeholder="مثلاً دوستان هدف">
      </div>
      <div class="form-row" id="privateEmailRow">
        <label for="privateEmail">ایمیل طرف مقابل</label>
        <input id="privateEmail" type="email" placeholder="example@email.com">
      </div>
      <div class="form-row" id="firstMemberRow">
        <label for="firstMember">ایمیل عضو اول (اختیاری)</label>
        <input id="firstMember" type="email" placeholder="example@email.com">
      </div>
      <div class="form-actions">
        <button type="submit" id="createChatSubmit">ساختن</button>
        <button type="button" class="secondary" data-close="newChatModal">انصراف</button>
      </div>
      <div id="newChatStatus" class="status"></div>
    </form>
  </div>
</div>

<!-- پنجره افزودن عضو -->
<div id="memberModal" class="modal-backdrop">
  <div class="modal">
    <h2>افزودن عضو</h2>
    <form id="memberForm">
      <div class="form-row">
        <label for="memberEmail">ایمیل عضو جدید</label>
        <input id="memberEmail" type="email" required placeholder="example@email.com">
      </div>
      <div class="form-actions">
        <button type="submit" id="addMemberSubmit">افزودن</button>
        <button type="button" class="secondary" data-close="memberModal">انصراف</button>
      </div>
      <div id="memberStatus" class="status"></div>
    </form>
  </div>
</div>

<script>
"use strict";

/* ===============================
   تنظیمات پیام‌رسان هدف
================================ */
const API_URL =
  "https://script.google.com/macros/s/AKfycbz4dz-jTt2Pj6FZ1d2f44VKGPuLpHFuHXWJ40eWSF8CGRp-HMDCISfPvC-rCMtP1C-geg/exec";

const SUPABASE_URL =
  "https://nzwgyvkbsznmpcilkpig.supabase.co";

const SUPABASE_BUCKET = "hadaf-media";

/*
  این کلید عمومی Supabase است.
  کلید secret یا service_role را هرگز در HTML قرار نده.
*/
const SUPABASE_PUBLIC_KEY =
  "sb_publishable_JYygUq37Jf0EGZ3UD7TmOA_X4dNI6ll";

const MAX_FILE_SIZE = 30 * 1024 * 1024;
const MEDIA_PREFIX = "hadaf-media::";

const ALLOWED_TYPES = new Set([
  "image/jpeg",
  "image/png",
  "image/webp",
  "image/gif",
  "video/mp4",
  "video/webm",
  "video/quicktime"
]);

/* ===============================
   وضعیت برنامه
================================ */
let currentUser = null;
let chats = [];
let activeChat = null;
let currentFilter = "all";
let loadingMessages = false;
let sendingMessage = false;
let uploadingMedia = false;
let lastMessageSignature = "";
let chatRefreshTimer = null;
let messageRefreshTimer = null;

/* ===============================
   ابزارهای عمومی
================================ */
const $ = id => document.getElementById(id);

function getUser() {
  try {
    const raw = localStorage.getItem("hadafUser");
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (error) {
    console.error("خواندن حساب ناموفق بود:", error);
    return null;
  }
}

function getEmail() {
  return String(currentUser?.email || "").trim().toLowerCase();
}

function getUsername() {
  return String(
    currentUser?.username ||
    currentUser?.name ||
    currentUser?.email ||
    "کاربر"
  );
}

function getChatId(chat) {
  if (!chat) return "";
  return String(
    chat.id ??
    chat.conversation_id ??
    chat.conversationId ??
    chat.chat_id ??
    ""
  );
}

function getChatType(chat) {
  return String(
    chat?.type ??
    chat?.conversation_type ??
    chat?.conversationType ??
    "private"
  ).toLowerCase();
}

function getChatName(chat) {
  return String(
    chat?.name ??
    chat?.title ??
    chat?.conversation_name ??
    chat?.conversationName ??
    chat?.username ??
    "گفت‌وگو"
  );
}

function isOfficial(chat) {
  return Boolean(
    chat?.is_official ||
    chat?.isOfficial ||
    chat?.official ||
    chat?.verified
  );
}

function showStatus(element, message, type = "info") {
  if (!element) return;
  element.textContent = message;
  element.className = "status show " + type;
}

function hideStatus(element) {
  if (!element) return;
  element.textContent = "";
  element.className = "status";
}

function openModal(id) {
  $(id)?.classList.add("show");
}

function closeModal(id) {
  $(id)?.classList.remove("show");
}

function formatTime(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("fa-IR", {
    hour: "2-digit",
    minute: "2-digit",
    month: "numeric",
    day: "numeric"
  });
}

function escapeText(value) {
  return String(value ?? "");
}

function getMessageText(message) {
  return String(
    message?.message ??
    message?.content ??
    message?.text ??
    ""
  );
}

function getSenderEmail(message) {
  return String(
    message?.sender_email ??
    message?.senderEmail ??
    message?.user_email ??
    message?.userEmail ??
    message?.email ??
    ""
  ).toLowerCase();
}

function getSenderName(message) {
  return String(
    message?.sender_username ??
    message?.senderUsername ??
    message?.username ??
    message?.sender_name ??
    message?.senderName ??
    getSenderEmail(message) ??
    "کاربر"
  );
}

function getMessageTime(message) {
  return (
    message?.created_at ??
    message?.createdAt ??
    message?.timestamp ??
    message?.sent_at ??
    ""
  );
}

/* ===============================
   ارتباط با Apps Script
================================ */
async function apiGet(params = {}) {
  if (!getEmail()) {
    throw new Error("ابتدا وارد حساب هدف شو.");
  }

  const query = new URLSearchParams();

  for (const [key, value] of Object.entries(params)) {
    if (value !== undefined && value !== null) {
      query.set(key, String(value));
    }
  }

  query.set("email", getEmail());
  query.set("user_email", getEmail());
  query.set("userEmail", getEmail());

  const response = await fetch(API_URL + "?" + query.toString(), {
    method: "GET",
    cache: "no-store"
  });

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error("پاسخ سرور معتبر نیست. API پیام‌رسان را بررسی کن.");
  }

  if (!response.ok || data?.ok === false || data?.success === false) {
    throw new Error(
      data?.message ||
      data?.error ||
      "دریافت اطلاعات از سرور ناموفق بود."
    );
  }

  return data;
}

async function apiPost(payload = {}) {
  if (!getEmail()) {
    throw new Error("ابتدا وارد حساب هدف شو.");
  }

  const body = {
    ...payload,
    email: getEmail(),
    user_email: getEmail(),
    userEmail: getEmail(),
    username: payload.username || getUsername()
  };

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(body)
  });

  const raw = await response.text();
  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error("پاسخ سرور معتبر نیست. API پیام‌رسان را بررسی کن.");
  }

  if (!response.ok || data?.ok === false || data?.success === false) {
    throw new Error(
      data?.message ||
      data?.error ||
      "انجام عملیات ناموفق بود."
    );
  }

  return data;
}

function unwrapList(data, keys = []) {
  if (Array.isArray(data)) return data;

  for (const key of keys) {
    if (Array.isArray(data?.[key])) return data[key];
    if (Array.isArray(data?.data?.[key])) return data.data[key];
  }

  if (Array.isArray(data?.data)) return data.data;
  if (Array.isArray(data?.results)) return data.results;

  return [];
}

/* ===============================
   گفت‌وگوها
================================ */
async function loadChats(options = {}) {
  const quiet = Boolean(options.quiet);

  try {
    const data = await apiGet({ action: "chats" });

    chats = unwrapList(data, [
      "chats",
      "conversations",
      "items"
    ]);

    renderChats();

    if (activeChat) {
      const id = getChatId(activeChat);
      const updated = chats.find(c => getChatId(c) === id);
      if (updated) activeChat = updated;
      updateConversationHeader();
    }

    hideStatus($("chatStatus"));
  } catch (error) {
    console.error("بارگذاری گفت‌وگوها ناموفق بود:", error);

    if (!quiet) {
      showStatus(
        $("chatStatus"),
        error.message || "بارگذاری گفت‌وگوها ناموفق بود.",
        "error"
      );
    }
  }
}

function renderChats() {
  const list = $("chatList");
  const search = $("searchInput").value.trim().toLowerCase();

  list.replaceChildren();

  const filtered = chats.filter(chat => {
    const type = getChatType(chat);
    const name = getChatName(chat).toLowerCase();

    const typeMatches =
      currentFilter === "all" ||
      type === currentFilter ||
      (currentFilter === "private" && type === "direct");

    return typeMatches && name.includes(search);
  });

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = chats.length
      ? "گفت‌وگویی پیدا نشد."
      : "هنوز گفت‌وگویی نداری. روی «＋ جدید» بزن.";
    list.appendChild(empty);
    return;
  }

  for (const chat of filtered) {
    const id = getChatId(chat);
    const type = getChatType(chat);
    const selected = activeChat && getChatId(activeChat) === id;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "chat-item" + (selected ? " selected" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent =
      type === "group" ? "👥" :
      type === "channel" ? "📢" :
      "👤";

    const info = document.createElement("div");
    info.className = "chat-info";

    const name = document.createElement("div");
    name.className = "chat-name";
    name.textContent = getChatName(chat);

    if (isOfficial(chat)) {
      const tick = document.createElement("span");
      tick.className = "verified";
      tick.title = "حساب رسمی هدف";
      tick.textContent = "✓";
      name.appendChild(tick);
    }

    const preview = document.createElement("div");
    preview.className = "chat-preview";
    preview.textContent =
      chat?.last_message ??
      chat?.lastMessage ??
      (type === "group" ? "گروه" :
       type === "channel" ? "کانال" : "گفت‌وگوی خصوصی");

    info.append(name, preview);
    button.append(avatar, info);

    button.addEventListener("click", () => selectChat(chat));

    list.appendChild(button);
  }
}

async function selectChat(chat) {
  activeChat = chat;
  lastMessageSignature = "";

  renderChats();
  updateConversationHeader();

  $("messages").replaceChildren();

  const loading = document.createElement("div");
  loading.className = "empty";
  loading.textContent = "در حال دریافت پیام‌ها...";
  $("messages").appendChild(loading);

  await loadMessages();

  if (messageRefreshTimer) {
    clearInterval(messageRefreshTimer);
  }

  messageRefreshTimer = setInterval(() => {
    if (activeChat) loadMessages({ quiet: true });
  }, 5000);
}

function updateConversationHeader() {
  if (!activeChat) {
    $("activeTitle").textContent = "یک گفت‌وگو انتخاب کن";
    $("activeSubtitle").textContent = "پیام‌رسان هدف";
    $("activeAvatar").textContent = "💬";
    $("membersBtn").hidden = true;
    return;
  }

  const type = getChatType(activeChat);

  $("activeTitle").textContent = getChatName(activeChat);
  $("activeSubtitle").textContent =
    type === "group" ? "گروه" :
    type === "channel" ? "کانال" :
    "گفت‌وگوی خصوصی";

  $("activeAvatar").textContent =
    type === "group" ? "👥" :
    type === "channel" ? "📢" :
    "👤";

  $("membersBtn").hidden = !(
    type === "group" ||
    type === "channel"
  );
}

/* ===============================
   پیام‌ها
================================ */
async function loadMessages(options = {}) {
  if (!activeChat || loadingMessages) return;

  loadingMessages = true;

  const quiet = Boolean(options.quiet);
  const chatId = getChatId(activeChat);

  try {
    const data = await apiGet({
      action: "messages",
      conversationId: chatId,
      conversation_id: chatId,
      chatId: chatId
    });

    const messages = unwrapList(data, [
      "messages",
      "items"
    ]);

    const signature = JSON.stringify(
      messages.map(m => ({
        id: m.id ?? m.message_id ?? "",
        message: getMessageText(m),
        time: getMessageTime(m),
        sender: getSenderEmail(m)
      }))
    );

    if (signature !== lastMessageSignature) {
      const shouldScroll =
        $("messages").scrollHeight -
        $("messages").scrollTop -
        $("messages").clientHeight < 130;

      renderMessages(messages);
      lastMessageSignature = signature;

      if (shouldScroll) {
        $("messages").scrollTop = $("messages").scrollHeight;
      }
    }
  } catch (error) {
    console.error("بارگذاری پیام‌ها ناموفق بود:", error);

    if (!quiet) {
      $("messages").replaceChildren();

      const err = document.createElement("div");
      err.className = "empty";
      err.textContent = error.message || "بارگذاری پیام‌ها ناموفق بود.";
      $("messages").appendChild(err);
    }
  } finally {
    loadingMessages = false;
  }
}

function parseMediaMessage(text) {
  if (!text.startsWith(MEDIA_PREFIX)) return null;

  try {
    const media = JSON.parse(text.slice(MEDIA_PREFIX.length));

    if (
      media?.version !== 1 ||
      !["image", "video"].includes(media.kind) ||
      !isSafeMediaUrl(media.url)
    ) {
      return null;
    }

    return media;
  } catch {
    return null;
  }
}

function isSafeMediaUrl(value) {
  try {
    const url = new URL(value);

    return (
      url.protocol === "https:" &&
      url.hostname === "nzwgyvkbsznmpcilkpig.supabase.co" &&
      url.pathname.startsWith(
        "/storage/v1/object/public/" + SUPABASE_BUCKET + "/"
      )
    );
  } catch {
    return false;
  }
}

function renderMessages(messages) {
  const container = $("messages");
  container.replaceChildren();

  if (!messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "هنوز پیامی ارسال نشده. اولین پیام را تو بفرست! ✨";
    container.appendChild(empty);
    return;
  }

  for (const message of messages) {
    const row = document.createElement("div");
    const senderEmail = getSenderEmail(message);
    const mine = senderEmail && senderEmail === getEmail();

    row.className = "message-row" + (mine ? " mine" : "");

    if (!mine) {
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = getSenderName(message);
      row.appendChild(sender);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const text = getMessageText(message);
    const media = parseMediaMessage(text);

    if (media) {
      bubble.classList.add("media-message");

      if (media.kind === "image") {
        const img = document.createElement("img");
        img.src = media.url;
        img.alt = media.name || "عکس ارسال‌شده";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        img.addEventListener("click", () => {
          const opened = window.open(media.url, "_blank", "noopener");
          if (opened) opened.opener = null;
        });

        img.addEventListener("error", () => {
          img.alt = "نمایش عکس ممکن نیست";
        });

        bubble.appendChild(img);
      } else {
        const video = document.createElement("video");
        video.src = media.url;
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.setAttribute("controlsList", "nodownload");

        bubble.appendChild(video);
      }

      if (media.caption) {
        const caption = document.createElement("div");
        caption.className = "media-caption";
        caption.textContent = media.caption;
        bubble.appendChild(caption);
      }

      if (media.name) {
        const name = document.createElement("div");
        name.className = "media-name";
        name.textContent = media.name;
        bubble.appendChild(name);
      }
    } else {
      bubble.textContent = text;
    }

    row.appendChild(bubble);

    const timeValue = getMessageTime(message);
    if (timeValue) {
      const time = document.createElement("div");
      time.className = "message-time";
      time.textContent = formatTime(timeValue);
      row.appendChild(time);
    }

    container.appendChild(row);
  }
}

/* ===============================
   ارسال پیام متنی
================================ */
async function sendTextMessage() {
  if (!activeChat) {
    showStatus($("composerStatus"), "ابتدا یک گفت‌وگو انتخاب کن.", "error");
    return;
  }

  const input = $("messageInput");
  const message = input.value.trim();

  if (!message) return;
  if (sendingMessage || uploadingMedia) return;

  sendingMessage = true;
  $("sendBtn").disabled = true;

  try {
    hideStatus($("composerStatus"));

    const id = getChatId(activeChat);

    await apiPost({
      action: "sendMessage",
      username: getUsername(),
      conversationId: id,
      conversation_id: id,
      message
    });

    input.value = "";
    input.style.height = "auto";

    await loadMessages({ quiet: true });
    await loadChats({ quiet: true });
  } catch (error) {
    showStatus(
      $("composerStatus"),
      error.message || "ارسال پیام ناموفق بود.",
      "error"
    );
  } finally {
    sendingMessage = false;
    $("sendBtn").disabled = false;
    input.focus();
  }
}

/* ===============================
   ارسال عکس و فیلم با Supabase
================================ */
function encodeObjectPath(path) {
  return path
    .split("/")
    .map(segment => encodeURIComponent(segment))
    .join("/");
}

function getFileExtension(file) {
  const name = String(file.name || "");
  const dot = name.lastIndexOf(".");

  if (dot >= 0) {
    const ext = name.slice(dot + 1).toLowerCase();
    if (/^[a-z0-9]{1,10}$/.test(ext)) return ext;
  }

  const mimeExtensions = {
    "image/jpeg": "jpg",
    "image/png": "png",
    "image/webp": "webp",
    "image/gif": "gif",
    "video/mp4": "mp4",
    "video/webm": "webm",
    "video/quicktime": "mov"
  };

  return mimeExtensions[file.type] || "bin";
}

function safeFileName(name) {
  const base = String(name || "media")
    .split(/[\\/]/)
    .pop()
    .replace(/[^\p{L}\p{N}._-]/gu, "_")
    .slice(0, 90);

  return base || "media";
}

async function uploadMedia(file) {
  if (!ALLOWED_TYPES.has(file.type)) {
    throw new Error(
      "این نوع فایل پشتیبانی نمی‌شود. عکس JPG، PNG، WEBP، GIF یا فیلم MP4، WEBM و MOV انتخاب کن."
    );
  }

  if (file.size <= 0) {
    throw new Error("فایل انتخاب‌شده خالی است.");
  }

  if (file.size > MAX_FILE_SIZE) {
    throw new Error("حجم فایل باید حداکثر ۳۰ مگابایت باشد.");
  }

  const extension = getFileExtension(file);
  const random = Math.random().toString(36).slice(2, 10);
  const objectName =
    Date.now() + "-" + random + "." + extension;

  const objectPath = "uploads/" + objectName;

  const uploadUrl =
    SUPABASE_URL +
    "/storage/v1/object/" +
    SUPABASE_BUCKET +
    "/" +
    encodeObjectPath(objectPath);

  const response = await fetch(uploadUrl, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_PUBLIC_KEY,
      "Authorization": "Bearer " + SUPABASE_PUBLIC_KEY,
      "Content-Type": file.type,
      "x-upsert": "false"
    },
    body: file
  });

  const raw = await response.text();

  if (!response.ok) {
    let reason = raw;

    try {
      const data = JSON.parse(raw);
      reason =
        data.message ||
        data.error ||
        data.error_description ||
        raw;
    } catch {}

    if (response.status === 401 || response.status === 403) {
      throw new Error(
        "اجازه آپلود صادر نشد. سیاست‌های INSERT باکت hadaf-media را بررسی کن."
      );
    }

    throw new Error("آپلود فایل ناموفق بود: " + reason);
  }

  const publicUrl =
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    SUPABASE_BUCKET +
    "/" +
    encodeObjectPath(objectPath);

  return {
    url: publicUrl,
    name: safeFileName(file.name),
    mime: file.type,
    size: file.size,
    kind: file.type.startsWith("image/") ? "image" : "video"
  };
}

async function sendMediaFile(file) {
  if (!activeChat) {
    showStatus($("composerStatus"), "ابتدا یک گفت‌وگو انتخاب کن.", "error");
    return;
  }

  if (uploadingMedia || sendingMessage) return;

  uploadingMedia = true;
  $("attachBtn").disabled = true;
  $("sendBtn").disabled = true;

  const captionInput = $("messageInput");
  const caption = captionInput.value.trim();

  try {
    showStatus(
      $("composerStatus"),
      "در حال آپلود فایل... لطفاً صفحه را نبند.",
      "info"
    );

    const media = await uploadMedia(file);

    showStatus(
      $("composerStatus"),
      "فایل آپلود شد؛ در حال ارسال پیام...",
      "info"
    );

    const mediaMessage = MEDIA_PREFIX + JSON.stringify({
      version: 1,
      kind: media.kind,
      url: media.url,
      name: media.name,
      mime: media.mime,
      size: media.size,
      caption
    });

    const id = getChatId(activeChat);

    await apiPost({
      action: "sendMessage",
      username: getUsername(),
      conversationId: id,
      conversation_id: id,
      message: mediaMessage
    });

    captionInput.value = "";
    captionInput.style.height = "auto";

    showStatus(
      $("composerStatus"),
      media.kind === "image"
        ? "عکس با موفقیت ارسال شد! 🖼️"
        : "فیلم با موفقیت ارسال شد! 🎬",
      "success"
    );

    await loadMessages({ quiet: true });
    await loadChats({ quiet: true });
  } catch (error) {
    console.error("ارسال فایل ناموفق بود:", error);

    showStatus(
      $("composerStatus"),
      error.message || "ارسال فایل ناموفق بود.",
      "error"
    );
  } finally {
    uploadingMedia = false;
    $("attachBtn").disabled = false;
    $("sendBtn").disabled = false;
    $("mediaInput").value = "";
  }
}

/* ===============================
   ساخت گفت‌وگو
================================ */
function updateNewChatForm() {
  const type = $("chatType").value;
  $("privateEmailRow").hidden = type !== "private";
  $("firstMemberRow").hidden = type === "private";
  $("chatName").placeholder =
    type === "private"
      ? "اختیاری"
      : type === "group"
        ? "مثلاً دوستان هدف"
        : "مثلاً اخبار هدف";
}

async function createChat(event) {
  event.preventDefault();

  const type = $("chatType").value;
  const name = $("chatName").value.trim();
  const privateEmail = $("privateEmail").value.trim().toLowerCase();
  const firstMember = $("firstMember").value.trim().toLowerCase();

  if (type === "private") {
    if (!privateEmail) {
      showStatus($("newChatStatus"), "ایمیل طرف مقابل را وارد کن.", "error");
      return;
    }

    if (privateEmail === getEmail()) {
      showStatus($("newChatStatus"), "نمی‌توانی با خودت گفت‌وگو بسازی.", "error");
      return;
    }
  } else if (!name) {
    showStatus($("newChatStatus"), "نام گروه یا کانال را وارد کن.", "error");
    return;
  }

  const submit = $("createChatSubmit");
  submit.disabled = true;

  try {
    hideStatus($("newChatStatus"));

    const data = await apiPost({
      action: "createConversation",
      type,
      conversationType: type,
      conversation_type: type,
      name,
      title: name,
      recipientEmail: privateEmail,
      recipient_email: privateEmail,
      email: getEmail(),
      memberEmail: firstMember,
      member_email: firstMember
    });

    await loadChats();

    const newId =
      data?.conversationId ??
      data?.conversation_id ??
      data?.chatId ??
      data?.chat?.id ??
      data?.conversation?.id ??
      data?.id;

    const created = chats.find(c => getChatId(c) === String(newId));

    if (created) {
      await selectChat(created);
    }

    closeModal("newChatModal");
    $("newChatForm").reset();
    updateNewChatForm();

    showStatus(
      $("chatStatus"),
      data?.message || "گفت‌وگو ساخته شد.",
      "success"
    );
  } catch (error) {
    showStatus(
      $("newChatStatus"),
      error.message || "ساخت گفت‌وگو ناموفق بود.",
      "error"
    );
  } finally {
    submit.disabled = false;
  }
}

/* ===============================
   افزودن عضو به گروه/کانال
================================ */
async function addMember(event) {
  event.preventDefault();

  if (!activeChat) return;

  const email = $("memberEmail").value.trim().toLowerCase();

  if (!email) {
    showStatus($("memberStatus"), "ایمیل عضو را وارد کن.", "error");
    return;
  }

  const submit = $("addMemberSubmit");
  submit.disabled = true;

  try {
    const id = getChatId(activeChat);

    const data = await apiPost({
      action: "addMember",
      conversationId: id,
      conversation_id: id,
      memberEmail: email,
      member_email: email,
      emailToAdd: email
    });

    showStatus(
      $("memberStatus"),
      data?.message || "درخواست افزودن عضو ارسال شد.",
      "success"
    );

    $("memberEmail").value = "";
    await loadChats({ quiet: true });
  } catch (error) {
    showStatus(
      $("memberStatus"),
      error.message || "افزودن عضو ناموفق بود.",
      "error"
    );
  } finally {
    submit.disabled = false;
  }
}

/* ===============================
   رویدادها
================================ */
$("sendBtn").addEventListener("click", sendTextMessage);

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendTextMessage();
  }
});

$("messageInput").addEventListener("input", () => {
  const input = $("messageInput");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 130) + "px";
});

$("attachBtn").addEventListener("click", () => {
  if (!activeChat) {
    showStatus($("composerStatus"), "اول یک گفت‌وگو انتخاب کن.", "error");
    return;
  }

  $("mediaInput").click();
});

$("mediaInput").addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (file) await sendMediaFile(file);
});

$("newChatBtn").addEventListener("click", () => {
  hideStatus($("newChatStatus"));
  openModal("newChatModal");
});

$("chatType").addEventListener("change", updateNewChatForm);

$("newChatForm").addEventListener("submit", createChat);
$("memberForm").addEventListener("submit", addMember);

$("membersBtn").addEventListener("click", () => {
  hideStatus($("memberStatus"));
  openModal("memberModal");
});

$("refreshBtn").addEventListener("click", async () => {
  await loadChats();
  await loadMessages({ quiet: true });
});

$("searchInput").addEventListener("input", renderChats);

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderChats();
  });
});

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closeModal(button.dataset.close);
  });
});

document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
  backdrop.addEventListener("click", event => {
    if (event.target === backdrop) {
      backdrop.classList.remove("show");
    }
  });
});

/* ===============================
   شروع برنامه
================================ */
async function startApp() {
  currentUser = getUser();

  if (!currentUser || !currentUser.email) {
    $("accountLabel").textContent = "وارد حساب هدف نشده‌ای";
    $("chatList").replaceChildren();

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "برای استفاده از پیام‌رسان، ابتدا وارد حساب هدف شو.";
    $("chatList").appendChild(empty);

    $("messages").replaceChildren();

    const message = document.createElement("div");
    message.className = "empty";
    message.textContent = "ابتدا وارد حساب کاربری‌ات شو.";
    $("messages").appendChild(message);

    $("sendBtn").disabled = true;
    $("attachBtn").disabled = true;
    $("newChatBtn").disabled = true;
    return;
  }

  $("accountLabel").textContent =
    getUsername() + " · " + getEmail();

  updateNewChatForm();

  await loadChats();

  if (chatRefreshTimer) clearInterval(chatRefreshTimer);

  chatRefreshTimer = setInterval(() => {
    loadChats({ quiet: true });
  }, 10000);
}

startApp();
