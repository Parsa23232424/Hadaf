<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>پیکو | دستیار هوش مصنوعی سایت هدف</title>

    <meta
        name="description"
        content="پیکو، دستیار هوش مصنوعی سایت هدف"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Tahoma,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f7f7fb;
            color: #202124;
        }

        /* =========================
           صفحه اصلی
        ========================== */

        .pico-page {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           هدر
        ========================== */

        .pico-header {
            height: 64px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: #ffffff;

            border-bottom: 1px solid #e8e8ef;
        }

        .pico-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pico-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eeeaff;

            font-size: 22px;
        }

        .pico-name {
            font-size: 18px;
            font-weight: 800;
        }

        .pico-description {
            font-size: 11px;
            color: #777b86;
        }

        /* =========================
           برگشت
        ========================== */

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 44px;
            height: 42px;

            padding: 0 14px;

            border: none;
            border-radius: 12px;

            background: #6c5ce7;
            color: #ffffff;

            font-family: inherit;
            font-size: 13px;
            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }

        .back-button:hover {
            background: #5847d8;
        }

        /* =========================
           پیکو
        ========================== */

        .pico-container {
            flex: 1;
            width: 100%;

            position: relative;

            overflow: hidden;
        }

        .pico-frame {
            display: block;

            width: 100%;
            height: 100%;

            border: none;

            background: #ffffff;
        }

        /* =========================
           موبایل
        ========================== */

        @media (max-width: 600px) {

            .pico-header {
                height: 58px;
                padding: 0 10px;
            }

            .pico-icon {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }

            .pico-name {
                font-size: 16px;
            }

            .pico-description {
                font-size: 10px;
            }

            .back-button {
                height: 38px;
                padding: 0 11px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="pico-page">

        <!-- هدر -->
        <header class="pico-header">

            <div class="pico-title">

                <div class="pico-icon">
                    🤖
                </div>

                <div>
                    <div class="pico-name">
                        پیکو
                    </div>

                    <div class="pico-description">
                        دستیار هوش مصنوعی سایت هدف
                    </div>
                </div>

            </div>

            <!--
                اگر صفحه اصلی سایتت index.html است
                همین مقدار درست است.
            -->
            <a
                href="/"
                class="back-button"
            >
                بازگشت
            </a>

        </header>


        <!-- پیکو -->
        <section class="pico-container">

            <iframe
                class="pico-frame"
                src="https://pico-ai.parsabravo.workers.dev"
                title="پیکو - دستیار هوش مصنوعی سایت هدف"
                allow="clipboard-write"
            ></iframe>

        </section>

    </main>

</body>

</html>
