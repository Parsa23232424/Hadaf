<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>هدف 🏹</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
Tahoma,
"Segoe UI",
sans-serif;

min-height:100vh;

background:
linear-gradient(
135deg,
#0f0c29,
#302b63,
#24243e
);

color:white;

}

.container{

width:min(700px,94%);

margin:30px auto;

}

.card{

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.12);

border-radius:25px;

padding:25px;

box-shadow:
0 20px 60px rgba(0,0,0,.4);

backdrop-filter:
blur(12px);

}

.logo{

text-align:center;

font-size:45px;

margin-bottom:5px;

}

h1{

text-align:center;

margin:5px 0 25px;

}

#account{

background:
rgba(99,102,241,.2);

border-radius:18px;

padding:18px;

margin-bottom:20px;

text-align:center;

}

.username{

font-size:21px;

font-weight:bold;

margin-bottom:8px;

}

.score{

font-size:18px;

}

.buttons{

display:grid;

gap:12px;

}

button{

border:0;

border-radius:15px;

padding:15px;

font-family:inherit;

font-size:17px;

font-weight:bold;

cursor:pointer;

color:white;

background:#6366f1;

}

.pico{

background:#10b981;

}

.logout{

background:#ef4444;

}

.guest{

color:#ddd;

line-height:2;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🏹
</div>

<h1>
هدف
</h1>


<div id="account">

<div class="username"
id="username">

⏳ در حال بررسی حساب...

</div>

<div class="score"
id="score">

⭐ امتیاز: 0

</div>

</div>


<div class="buttons">

<button
class="pico"
onclick="location.href='pico.html'">

🤖 چالش هوش پیکو

</button>

<button
onclick="location.href='news.html'">

📰 اخبار هدف

</button>

<button
class="logout"
onclick="logout()">

🚪 خروج از حساب

</button>

</div>

</div>

</div>


<script>

/* =====================================================
   👤 حساب کاربری
===================================================== */

function getUser(){

try{

return JSON.parse(
localStorage.getItem("hadafUser")
);

}catch{

return null;

}

}


/* =====================================================
   نمایش حساب
===================================================== */

function showAccount(){

const user=
getUser();

const username=
document.getElementById("username");

const score=
document.getElementById("score");


if(!user){

username.innerHTML=
"👤 مهمان";

score.innerHTML=
"برای استفاده از حساب وارد شو.";

return;

}


username.innerHTML=
"👤 "+escapeHTML(
user.username ||
"کاربر هدف"
);


score.innerHTML=
"⭐ امتیاز: "+
Number(user.score || 0);

}


/* =====================================================
   امنیت متن
===================================================== */

function escapeHTML(text){

const div=
document.createElement("div");

div.textContent=
text;

return div.innerHTML;

}


/* =====================================================
   🚪 خروج
===================================================== */

function logout(){

localStorage.removeItem(
"hadafUser"
);

location.href=
"login.html";

}


/* =====================================================
   شروع
===================================================== */

showAccount();

</script>

</body>
</html>
