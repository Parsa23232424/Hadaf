<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تست هدف و Streak</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#07090f;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.box{
    max-width:600px;
    margin:auto;
    background:#111522;
    border-radius:18px;
    padding:20px;
    box-shadow:0 10px 30px #0008;
}

h1{
    text-align:center;
}

input,button{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid #30384d;
    font-size:16px;
}

input{
    background:#080b12;
    color:white;
}

button{
    background:#4f7cff;
    color:white;
    border:0;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

.goal{
    margin-top:20px;
    padding:18px;
    background:#080b12;
    border-radius:15px;
}

.success{
    color:#52e58a;
}

.error{
    color:#ff5d6c;
}

pre{
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    background:#05070b;
    padding:15px;
    border-radius:12px;
    overflow:auto;
    font-size:12px;
}
</style>
</head>

<body>

<div class="box">

<h1>🧪 تست هدف و Streak</h1>

<input
    id="email"
    type="email"
    placeholder="ایمیل کاربر"
>

<input
    id="password"
    type="password"
    placeholder="رمز تست"
>

<button id="loadButton">
    📥 دریافت هدف
</button>

<div id="goalBox" class="goal" style="display:none">

    <h2 id="goalTitle">---</h2>

    <p>
        🔥 Streak:
        <b id="streak">0</b>
    </p>

    <p>
        🏆 بهترین Streak:
        <b id="best">0</b>
    </p>

    <p>
        ✅ تعداد انجام:
        <b id="total">0</b>
    </p>

    <button id="completeButton">
        ✅ انجام هدف امروز
    </button>

</div>

<div id="status"></div>

<h3>📡 پاسخ کامل API</h3>

<pre id="raw">هنوز درخواستی ارسال نشده.</pre>

</div>

<script>

/* =====================================================
   تنظیمات تست
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyB0PtuiwLPmoVDo5f6kf4g1R4XnJphMKC1C0HTei3w-fVVYjqxxuSOeeMLAFKJNfsf0y/dev";

const TEST_PASSWORD = "xxxxx";


/* =====================================================
   عناصر صفحه
===================================================== */

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loadButton =
document.getElementById("loadButton");

const completeButton =
document.getElementById("completeButton");

const goalBox =
document.getElementById("goalBox");

const goalTitle =
document.getElementById("goalTitle");

const streak =
document.getElementById("streak");

const best =
document.getElementById("best");

const total =
document.getElementById("total");

const statusBox =
document.getElementById("status");

const rawBox =
document.getElementById("raw");


/* =====================================================
   ایمیل ذخیره‌شده
===================================================== */

try{

    const savedUser =
        localStorage.getItem("hadafUser");

    if(savedUser){

        try{

            const parsed =
                JSON.parse(savedUser);

            if(parsed.email){
                emailInput.value =
                    parsed.email;
            }

        }catch(e){

            if(
                savedUser.includes("@")
            ){
                emailInput.value =
                    savedUser;
            }

        }

    }

}catch(e){}


/* =====================================================
   پیام
===================================================== */

function status(message, type){

    statusBox.innerHTML =
        `<p class="${type || ""}">
            ${message}
        </p>`;

}


/* =====================================================
   بررسی رمز تست
===================================================== */

function checkPassword(){

    const password =
        passwordInput.value.trim();

    if(password !== TEST_PASSWORD){

        status(
            "❌ رمز تست اشتباه است.",
            "error"
        );

        return false;
    }

    return true;
}


/* =====================================================
   ارسال درخواست
===================================================== */

async function callAPI(action, extra = {}){

    const email =
        emailInput.value.trim().toLowerCase();

    if(!email){

        throw new Error(
            "ایمیل را وارد کن."
        );
    }

    const body = {

        action: action,

        email: email,

        ...extra

    };

    const response =
        await fetch(API_URL, {

            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify(body)

        });

    const text =
        await response.text();

    let data;

    try{

        data = JSON.parse(text);

    }catch(e){

        data = {
            raw:text
        };

    }

    const result = {

        httpStatus:
            response.status,

        ok:
            response.ok,

        data:data

    };

    rawBox.textContent =
        JSON.stringify(
            result,
            null,
            2
        );

    return result;
}


/* =====================================================
   استخراج اطلاعات هدف
===================================================== */

function extractGoal(result){

    const data =
        result.data;

    if(!data) return null;

    if(data.goal)
        return data.goal;

    if(data.data &&
       data.data.goal)
        return data.data.goal;

    if(data.result &&
       data.result.goal)
        return data.result.goal;

    if(
        Array.isArray(data.goals) &&
        data.goals.length
    )
        return data.goals[0];

    if(
        data.data &&
        Array.isArray(data.data.goals) &&
        data.data.goals.length
    )
        return data.data.goals[0];

    return null;
}


/* =====================================================
   استخراج مقدار Streak
===================================================== */

function getNumber(obj, names){

    if(!obj) return 0;

    for(const name of names){

        if(
            obj[name] !== undefined &&
            obj[name] !== null
        ){

            const value =
                Number(obj[name]);

            if(!Number.isNaN(value))
                return value;
        }

    }

    return 0;
}


/* =====================================================
   دریافت هدف
===================================================== */

async function loadGoal(){

    if(!checkPassword())
        return;

    const email =
        emailInput.value.trim();

    if(!email){

        status(
            "❌ ایمیل را وارد کن.",
            "error"
        );

        return;
    }

    loadButton.disabled = true;

    status(
        "⏳ در حال دریافت هدف..."
    );

    try{

        const result =
            await callAPI(
                "getGoal"
            );

        if(!result.ok){

            status(
                "❌ دریافت هدف ناموفق بود.",
                "error"
            );

            return;
        }

        const goal =
            extractGoal(result);

        if(!goal){

            status(
                "❌ هدفی در پاسخ API پیدا نشد.",
                "error"
            );

            return;
        }

        goalBox.style.display =
            "block";

        goalTitle.textContent =
            goal.title ||
            goal.goal ||
            goal.name ||
            "هدف بدون نام";

        streak.textContent =
            getNumber(
                goal,
                [
                    "streak",
                    "currentStreak",
                    "current_streak"
                ]
            );

        best.textContent =
            getNumber(
                goal,
                [
                    "best",
                    "bestStreak",
                    "best_streak"
                ]
            );

        total.textContent =
            getNumber(
                goal,
                [
                    "total",
                    "totalCompleted",
                    "completed",
                    "count"
                ]
            );

        completeButton.dataset.goalId =
            goal.id ||
            goal.goalId ||
            goal.goalID ||
            "";

        status(
            "✅ هدف با موفقیت دریافت شد.",
            "success"
        );

    }catch(error){

        status(
            "❌ خطا: " +
            error.message,
            "error"
        );

    }finally{

        loadButton.disabled = false;

    }

}


/* =====================================================
   انجام هدف
===================================================== */

async function completeGoal(){

    if(!checkPassword())
        return;

    const goalId =
        completeButton.dataset.goalId;

    if(!goalId){

        status(
            "❌ شناسه هدف پیدا نشد.",
            "error"
        );

        return;
    }

    completeButton.disabled = true;

    status(
        "⏳ در حال ثبت انجام هدف..."
    );

    try{

        const result =
            await callAPI(
                "completeGoal",
                {
                    goalId:goalId
                }
            );

        if(!result.ok){

            status(
                "❌ completeGoal ناموفق بود.",
                "error"
            );

            return;
        }

        status(
            "🎉 completeGoal با موفقیت اجرا شد!",
            "success"
        );

        /*
          دوباره هدف را می‌گیریم تا ببینیم
          Streak واقعاً تغییر کرده یا نه.
        */

        setTimeout(
            loadGoal,
            500
        );

    }catch(error){

        status(
            "❌ خطا در completeGoal: " +
            error.message,
            "error"
        );

    }finally{

        completeButton.disabled = false;

    }

}


/* =====================================================
   دکمه‌ها
===================================================== */

loadButton.addEventListener(
    "click",
    loadGoal
);

completeButton.addEventListener(
    "click",
    completeGoal
);


/* =====================================================
   Enter
===================================================== */

passwordInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter")
            loadGoal();

    }
);

emailInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter")
            loadGoal();

    }
);

</script>

</body>
</html>
