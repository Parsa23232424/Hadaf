<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<meta name="description" content="آزمایشگاه هوش مصنوعی پیکو در سایت هدف">
<title>پیکو AI | هدف</title><style>
:root {
  --bg:#07090f;
  --primary:#6758ff;
  --orange:#ff7a32;
  --text:#f4f4fb;
  --muted:#a3a7bc;
  --border:#282d40;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 0%,#30216a 0%,transparent 48%),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 5%;
  border-bottom:1px solid var(--border);
  background:#07090fcc;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.logo {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),#a44cff);
  font-size:24px;
}

.brand small {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  font-weight:normal;
}

.header-link {
  color:white;
  text-decoration:none;
  background:#191d2c;
  border:1px solid var(--border);
  padding:10px 13px;
  border-radius:12px;
  font-size:12px;
}

main {
  width:min(700px,92%);
  margin:auto;
  padding:25px 0 35px;
}

.orbit {
  width:130px;
  height:130px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  position:relative;
  border-radius:50%;
  background:radial-gradient(circle,#292052,#111321 70%);
  border:1px solid #5145b9;
  box-shadow:0 0 45px #6758ff30;
}

.pico-image {
  width:108px;
  height:108px;
  object-fit:contain;
  animation:float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #00aaff55);
}

@keyframes float {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-5px)}
}

.spark {
  position:absolute;
  color:#c4b5fd;
  font-size:16px;
}

.spark.one {
  top:8px;
  right:10px;
}

.spark.two {
  bottom:8px;
  left:10px;
  color:var(--orange);
}

.status {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  color:#8ef0b0;
  font-size:12px;
}

.status-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px #22c55e80;
}

h1 {
  text-align:center;
  margin:10px 0;
  font-size:clamp(25px,6vw,36px);
}

h1 span {
  color:#a69dff;
}

.description {
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:2;
}

.chat {
  margin-top:25px;
  padding:15px;
  background:#10131e;
  border:1px solid var(--border);
  border-radius:18px;
}

.messages {
  min-height:180px;
  max-height:430px;
  overflow-y:auto;
  padding:5px;
}

.message {
  max-width:85%;
  padding:11px 14px;
  margin:9px 0;
  border-radius:15px;
  font-size:13px;
  line-height:2;
  white-space:pre-wrap;
}

.user {
  margin-right:auto;
  background:#6758ff;
  color:white;
  border-bottom-right-radius:5px;
}

.pico {
  margin-left:auto;
  background:#191d2c;
  border:1px solid #30364d;
  border-bottom-left-radius:5px;
}

.input-area {
  display:flex;
  gap:8px;
  margin-top:12px;
}

#messageInput {
  flex:1;
  min-width:0;
  resize:none;
  height:48px;
  padding:12px;
  border-radius:13px;
  border:1px solid var(--border);
  background:#080a12;
  color:white;
  outline:none;
  font-family:inherit;
}

#messageInput:focus {
  border-color:#6758ff;
}

#sendButton {
  width:55px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#6758ff,#8b5cf6);
  color:white;
  font-size:20px;
  cursor:pointer;
}

#sendButton:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.loading {
  color:#a69dff;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse {
  from {opacity:.4}
  to {opacity:1}
}

.home {
  display:block;
  width:max-content;
  margin:20px auto 0;
  padding:12px 20px;
  border-radius:13px;
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
}

footer {
  padding:20px;
  border-top:1px solid var(--border);
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

footer a {
  color:#a69dff;
  text-decoration:none;
}

@media(max-width:430px) {
  header {
    padding:12px 4%;
  }

  .brand {
    font-size:13px;
  }

  .header-link {
    padding:9px;
  }

  main {
    width:94%;
  }
}
</style></head><body><header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      آزمایشگاه هوش مصنوعی
      <small>بخشی از سایت هدف</small>
    </div>
  </div>  <a class="header-link" href="index.html">
    صفحه اصلی هدف ↗
  </a>
</header><main>  <div class="orbit">
    <span class="spark one">✦</span><img
  src="pico.png"
  alt="پیکو"
  class="pico-image"
>

<span class="spark two">✧</span>

  </div>  <div class="status">
    <span class="status-dot"></span>
    پیکو آنلاین است
  </div>  <h1>
    سلام! من <span>پیکو</span> هستم 👋
  </h1>  <p class="description">
    هر چیزی خواستی بپرس؛ از برنامه‌نویسی و علم تا بازی و ایده‌های خلاقانه.
  </p>  <div class="chat"><div class="messages" id="messages">
  <div class="message pico">
    سلام! من پیکو هستم، دوست باهوش و خلاق تو! 🤖💙
  </div>
</div>

<div class="input-area">
  <textarea
    id="messageInput"
    placeholder="پیامت را برای پیکو بنویس..."
    maxlength="10000"
  ></textarea>

  <button id="sendButton" aria-label="ارسال">
    ➤
  </button>
</div>

  </div>  <a class="home" href="index.html">
    برگشت به سایت هدف ←
  </a></main><footer>
  <a href="index.html">هدف</a>
  · هر روز یک قدم جلوتر
</footer><script>

const PICO_API =
"https://script.google.com/macros/s/AKfycbzeQTj-MjcZH6qcnpQ7yV4dkXeUvrGpR9ZcP9i9bu-VHbo6sb8bfc53YOqhhin3jN6nwQ/exec";

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;

  return div;
}

async function sendMessage() {

  const message = input.value.trim();

  if (!message || sendButton.disabled) {
    return;
  }

  addMessage(message, "user");

  input.value = "";
  sendButton.disabled = true;

  const loading = addMessage("پیکو داره فکر می‌کنه... ✨", "pico");
  loading.classList.add("loading");

  try {

    const response = await fetch(PICO_API, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    loading.remove();

    if (!data.success) {

      addMessage(
        data.error || "یه مشکلی پیش اومد. دوباره امتحان کن.",
        "pico"
      );

      return;
    }

    addMessage(data.answer, "pico");

  } catch (error) {

    loading.remove();

    addMessage(
      "ارتباط با پیکو برقرار نشد. اینترنتت رو بررسی کن و دوباره امتحان کن.",
      "pico"
    );

  } finally {

    sendButton.disabled = false;
    input.focus();

  }
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});

</script></body>
</html>
